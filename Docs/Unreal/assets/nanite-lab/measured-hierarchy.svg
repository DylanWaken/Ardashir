<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 696" role="img" aria-labelledby="t d"><title id="t">Measured bunny replacement hierarchy and camera selection</title><desc id="d">Bars plot triangle counts computed by the CPU lab, not Unreal statistics.</desc><rect width="1280" height="696" fill="#f6f4ed"/><g font-family="Segoe UI,Arial,sans-serif" fill="#242b24"><text x="40" y="50" font-size="28">What the build retained; what each view requested</text><text x="40" y="84" font-size="17">Measured on Stanford bun_zipper.ply. CPU replacement tree; 640px view; threshold 1px.</text><text x="40" y="158" font-size="17">Level 0</text><rect x="122" y="140" width="330.00" height="25" fill="#648465"/><text x="466.00" y="159" font-size="16">69,451 triangles · 794 regions</text><text x="40" y="204" font-size="17">Level 1</text><rect x="122" y="186" width="165.63" height="25" fill="#648465"/><text x="301.63" y="205" font-size="16">34,859 triangles · 199 regions</text><text x="40" y="250" font-size="17">Level 2</text><rect x="122" y="232" width="83.44" height="25" fill="#648465"/><text x="219.44" y="251" font-size="16">17,561 triangles · 50 regions</text><text x="40" y="296" font-size="17">Level 3</text><rect x="122" y="278" width="42.59" height="25" fill="#648465"/><text x="178.59" y="297" font-size="16">8,963 triangles · 13 regions</text><text x="40" y="342" font-size="17">Level 4</text><rect x="122" y="324" width="21.78" height="25" fill="#648465"/><text x="157.78" y="343" font-size="16">4,583 triangles · 4 regions</text><text x="40" y="388" font-size="17">Level 5</text><rect x="122" y="370" width="10.89" height="25" fill="#648465"/><text x="146.89" y="389" font-size="16">2,291 triangles · 1 regions</text><text x="40" y="434" font-size="17">Level 6</text><rect x="122" y="416" width="5.44" height="25" fill="#648465"/><text x="141.44" y="435" font-size="16">1,145 triangles · 1 regions</text><text x="40" y="480" font-size="17">Level 7</text><rect x="122" y="462" width="2.7