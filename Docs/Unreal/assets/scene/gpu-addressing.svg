<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc"><title id="title">Scene indices and a compact visibility list</title><desc id="desc">Primitive 17 owns instances 400 through 402. Culling retains 400 and 402; compact list indices must be resolved before scene data is read.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#526845"/></marker></defs><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#252722} .small{font-size:18px;fill:#64665e} .label{font-size:23px;font-weight:600} .line{fill:none;stroke:#526845;stroke-width:2.5;marker-end:url(#arrow)} .grid{fill:none;stroke:#c9cabd;stroke-width:1.5} .slab{fill:#e1e7d6;stroke:#526845;stroke-width:2} .warm{fill:#f1dfd1;stroke:#9a5b34;stroke-width:2}</style><rect width="1000" height="465" fill="#fffdf8"/><text x="40" y="42" class="label" text-anchor="start">Compaction does not change identity</text><rect x="50" y="110" width="270" height="115" rx="5" class="slab"/><text x="70" y="146" class="" text-anchor="start">Primitive ID = 17</text><text x="70" y="181" class="small" text-anchor="start">instance start = 400</text><text x="70" y="210" class="small" text-anchor="start">instance count = 3</text><text x="420" y="87" class="small" text-anchor="start">Scene instance entries</text><rect x="420" y="110" width="215" height="54" rx="5" class="slab"/><text x="438" y="144" class="" text-anchor="start">400</text><text x="500" y="144" class="small" text-anchor="start">→ prim 17</text><rect x="420" y="180" width="215" height="54" rx="5" class="warm"/><text x="438" y="214" class="" text-anchor="start">401</text><text x="500" y="214" class="small" text-anchor="start">→ prim 17</text><rect x="420" y="250" width="215" height="54" rx="5" class="slab"/><text x="438" y="284" class="" text-anchor="start">402</text><text x="500" y="284" class="small" text-anchor="start">→ prim 17</text><path d="M320 165 L390 165 L390 137 L415 137" class="line"/><text x="740" y="87" class="small" text-anchor="start">Visible list</text><rect x="745" y="110" width="205" height="60" rx="5" class="slab"/><text x="760" y="147" class="" text-anchor="start">[0] → 400</text><rect x="745" y="250" width="205" height="60" rx="5" class="slab"/><text x="760" y="287" class="" text-anchor="start">[1] → 402</text><path d="M640 137 L735 137" class="line"/><path d="M640 277 L735 277" class="line"/><text x="680" y="217" class="small" text-anchor="start">401 culled</text><text x="50" y="376" class="" text-anchor="start">List position 1 means “load instance 402,” not “load instance 401.”</text><text x="50" y="421" class="small" text-anchor="start">CPU packed index, persistent primitive ID, and GPU offsets also differ.</text></svg>
