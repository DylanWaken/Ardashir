<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Motion requires matching previous geometry and camera state</title><desc id="desc">Previous and current deformation, object placement, and camera projection each produce a screen position. Their difference determines motion.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#526845"/></marker></defs><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#252722} .small{font-size:18px;fill:#64665e} .label{font-size:23px;font-weight:600} .line{fill:none;stroke:#526845;stroke-width:2.5;marker-end:url(#arrow)} .grid{fill:none;stroke:#c9cabd;stroke-width:1.5} .slab{fill:#e1e7d6;stroke:#526845;stroke-width:2} .warm{fill:#f1dfd1;stroke:#9a5b34;stroke-width:2}</style><rect width="1000" height="560" fill="#fffdf8"/><text x="40" y="43" class="label" text-anchor="start">Two complete observations define motion</text><text x="40" y="168" class="" text-anchor="start">Previous</text><rect x="165" y="130" width="205" height="95" rx="5" class="warm"/><text x="268" y="166" class="" text-anchor="middle">Sleeve surface</text><text x="268" y="200" class="small" text-anchor="middle">pose + deformation</text><path d="M375 177 L430 177" class="line"/><rect x="440" y="130" width="205" height="95" rx="5" class="warm"/><text x="542" y="167" class="" text-anchor="middle">Object → world</text><text x="542" y="200" class="small" text-anchor="middle">matching transform</text><path d="M650 177 L705 177" class="line"/><rect x="715" y="130" width="245" height="95" rx="5" class="warm"/><text x="837" y="167" class="" text-anchor="middle">World → screen</text><text x="837" y="200" class="small" text-anchor="middle">matching camera</text><text x="40" y="338" class="" text-anchor="start">Current</text><rect x="165" y="300" width="205" height="95" rx="5" class="slab"/><text x="268" y="336" class="" text-anchor="middle">Sleeve surface</text><text x="268" y="370" class="small" text-anchor="middle">pose + deformation</text><path d="M375 347 L430 347" class="line"/><rect x="440" y="300" width="205" height="95" rx="5" class="slab"/><text x="542" y="337" class="" text-anchor="middle">Object → world</text><text x="542" y="370" class="small" text-anchor="middle">matching transform</text><path d="M650 347 L705 347" class="line"/><rect x="715" y="300" width="245" height="95" rx="5" class="slab"/><text x="837" y="337" class="" text-anchor="middle">World → screen</text><text x="837" y="370" class="small" text-anchor="middle">matching camera</text><path d="M835 230 L835 268" class="line"/><text x="40" y="476" class="" text-anchor="start">screen motion = current screen position − previous screen position</text><text x="40" y="520" class="small" text-anchor="start">A moving camera, a moving object, and a changing pose can all contribute.</text></svg>
