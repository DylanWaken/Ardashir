<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 425" role="img" aria-labelledby="title desc"><title id="title">Geometry shared by placements</title><desc id="desc">One local indexed floor patch becomes several world placements without duplicating its local positions. Placement C is visibly rotated.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#526845"/></marker></defs><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#252722} .small{font-size:18px;fill:#64665e} .label{font-size:23px;font-weight:600} .line{fill:none;stroke:#526845;stroke-width:2.5;marker-end:url(#arrow)} .grid{fill:none;stroke:#c9cabd;stroke-width:1.5} .slab{fill:#e1e7d6;stroke:#526845;stroke-width:2} .warm{fill:#f1dfd1;stroke:#9a5b34;stroke-width:2}</style><rect width="1000" height="425" fill="#fffdf8"/><text x="45" y="45" class="label" text-anchor="start">One shape, three placements</text><text x="55" y="95" class="" text-anchor="start">Room floor patch</text><path d="M95 255 L95 125 M95 255 L275 255" class="grid"/><path d="M115 220 L245 220 L245 130 L115 130 Z M115 220 L245 130" class="slab"/><text x="100" y="243" class="small" text-anchor="start">0</text><text x="250" y="240" class="small" text-anchor="start">1</text><text x="250" y="125" class="small" text-anchor="start">2</text><text x="95" y="125" class="small" text-anchor="start">3</text><text x="45" y="295" class="small" text-anchor="start">indices: 0,1,2 · 0,2,3</text><text x="45" y="323" class="small" text-anchor="start">positions remain unchanged</text><path d="M305 205 L398 205" class="line"/><text x="432" y="95" class="" text-anchor="start">Room placements</text><text x="420" y="385" class="small" text-anchor="start">Each placement has its own transform and tint.</text><path d="M445 190 l95 0 l30 -35 l-95 0 Z M445 190 l125 -35" class="slab"/><text x="440" y="223" class="small" text-anchor="start">A: (−50,200) cm</text><path d="M650 190 l95 0 l30 -35 l-95 0 Z M650 190 l125 -35" class="slab"/><text x="645" y="223" class="small" text-anchor="start">B: (50,200) cm</text><path d="M760 270 l95 0 l30 -35 l-95 0 Z M760 270 l125 -35" class="slab" transform="rotate(-40 822 248)"/><text x="755" y="337" class="small" text-anchor="start">C: rotated</text></svg>
