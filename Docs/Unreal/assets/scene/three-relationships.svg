<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc"><title id="title">Different relations in the same indoor room</title><desc id="desc">Inheritance, transform attachment, and shared asset references are different relations. A spatial query can select the matte block independently of them.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#526845"/></marker></defs><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#252722} .small{font-size:18px;fill:#64665e} .label{font-size:23px;font-weight:600} .line{fill:none;stroke:#526845;stroke-width:2.5;marker-end:url(#arrow)} .grid{fill:none;stroke:#c9cabd;stroke-width:1.5} .slab{fill:#e1e7d6;stroke:#526845;stroke-width:2} .warm{fill:#f1dfd1;stroke:#9a5b34;stroke-width:2}</style><rect width="1000" height="565" fill="#fffdf8"/><text x="45" y="43" class="label" text-anchor="start">The links have different meanings</text><text x="50" y="98" class="small" text-anchor="start">INHERITS BEHAVIOR</text><text x="350" y="98" class="small" text-anchor="start">FOLLOWS MOTION</text><text x="685" y="98" class="small" text-anchor="start">REUSES GEOMETRY</text><text x="50" y="150" class="" text-anchor="start">Scene component</text><path d="M85 165 L85 208" class="line"/><text x="50" y="240" class="" text-anchor="start">Primitive component</text><path d="M85 255 L85 298" class="line"/><text x="50" y="330" class="" text-anchor="start">Mesh component</text><text x="470" y="150" class="" text-anchor="middle">Hinge / TeachingRoot</text><path d="M465 170 L385 223" class="line"/><path d="M475 170 L575 223" class="line"/><text x="350" y="260" class="" text-anchor="start">Door</text><text x="520" y="260" class="" text-anchor="start">Indicator</text><text x="350" y="330" class="small" text-anchor="start">Siblings share the root transform</text><text x="700" y="150" class="" text-anchor="start">Door panel</text><text x="700" y="310" class="" text-anchor="start">Matte block</text><rect x="700" y="200" width="215" height="55" rx="5" class="slab"/><text x="807" y="234" class="" text-anchor="middle">Shared cube mesh</text><path d="M795 160 L795 195" class="line"/><path d="M795 285 L795 262" class="line"/><text x="50" y="405" class="small" text-anchor="start">A spatial query tests the resolved bounds, regardless of these links.</text><path d="M360 435 h550 v105 h-550 Z" class="grid"/><circle cx="440" cy="485" r="23" class="slab"/><circle cx="830" cy="485" r="23" class="slab"/><text x="440" y="552" class="small" text-anchor="middle">door panel</text><text x="830" y="552" class="small" text-anchor="middle">matte block</text><ellipse cx="810" cy="480" rx="85" ry="35" fill="none" stroke="#9a5b34" stroke-width="2" stroke-dasharray="7 5"/><text x="60" y="485" class="small" text-anchor="start">Camera query →</text></svg>
