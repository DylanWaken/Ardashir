<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">Semantic scene updates reach affected consumers</title><desc id="desc">A proposed Arda door transform update feeds instance uploads, ray instance updates and lighting invalidation while keeping unchanged geometry and material resources.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#526845"/></marker></defs><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#252722} .small{font-size:18px;fill:#64665e} .label{font-size:23px;font-weight:600} .line{fill:none;stroke:#526845;stroke-width:2.5;marker-end:url(#arrow)} .grid{fill:none;stroke:#c9cabd;stroke-width:1.5} .slab{fill:#e1e7d6;stroke:#526845;stroke-width:2} .warm{fill:#f1dfd1;stroke:#9a5b34;stroke-width:2}</style><rect width="1000" height="630" fill="#fffdf8"/><text x="40" y="43" class="label" text-anchor="start">A transform update has several consumers</text><text x="45" y="98" class="small" text-anchor="start">Proposed Arda contract — not existing API</text><rect x="45" y="240" width="245" height="100" rx="5" class="slab"/><text x="65" y="276" class="" text-anchor="start">Door {42, 7} moved</text><text x="65" y="310" class="small" text-anchor="start">new transform + bounds</text><rect x="390" y="245" width="220" height="90" rx="5" class="slab"/><text x="500" y="279" class="" text-anchor="middle">Scene revision 121</text><text x="500" y="311" class="small" text-anchor="middle">resolve identity</text><path d="M295 290 L380 290" class="line"/><rect x="705" y="110" width="260" height="95" rx="5" class="slab"/><text x="835" y="146" class="" text-anchor="middle">GPU scene upload</text><text x="835" y="182" class="small" text-anchor="middle">Culling and raster draws</text><path d="M615 290 L660 290 L660 155 L695 155" class="line"/><rect x="705" y="270" width="260" height="95" rx="5" class="slab"/><text x="835" y="306" class="" text-anchor="middle">Ray instance update</text><text x="835" y="342" class="small" text-anchor="middle">Acceleration structure</text><path d="M615 290 L660 290 L660 315 L695 315" class="line"/><rect x="705" y="430" width="260" height="95" rx="5" class="slab"/><text x="835" y="466" class="" text-anchor="middle">Lighting invalidation</text><text x="835" y="502" class="small" text-anchor="middle">Refresh affected cache</text><path d="M615 290 L660 290 L660 475 L695 475" class="line"/><rect x="45" y="440" width="350" height="85" rx="5" class="warm"/><text x="220" y="475" class="" text-anchor="middle">Mesh + material program</text><text x="220" y="508" class="small" text-anchor="middle">unchanged resources are retained</text><text x="45" y="587" class="small" text-anchor="start">Retirement is separate: old readers keep valid resources until they finish.</text></svg>
