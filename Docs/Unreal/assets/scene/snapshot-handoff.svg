<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">A scene snapshot crosses execution boundaries</title><desc id="desc">A complete version of transform and bounds passes to rendering while gameplay advances. Prior GPU work retains its resources until completion.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#526845"/></marker></defs><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#252722} .small{font-size:18px;fill:#64665e} .label{font-size:23px;font-weight:600} .line{fill:none;stroke:#526845;stroke-width:2.5;marker-end:url(#arrow)} .grid{fill:none;stroke:#c9cabd;stroke-width:1.5} .slab{fill:#e1e7d6;stroke:#526845;stroke-width:2} .warm{fill:#f1dfd1;stroke:#9a5b34;stroke-width:2}</style><rect width="1000" height="520" fill="#fffdf8"/><text x="40" y="43" class="label" text-anchor="start">Publish a complete version</text><text x="35" y="130" class="" text-anchor="start">Gameplay</text><path d="M205 130 L945 130" class="grid"/><text x="35" y="260" class="" text-anchor="start">Rendering</text><path d="M205 260 L945 260" class="grid"/><text x="35" y="390" class="" text-anchor="start">GPU</text><path d="M205 390 L945 390" class="grid"/><rect x="245" y="92" width="235" height="65" rx="5" class="slab"/><text x="362" y="119" class="" text-anchor="middle">Gate version 12</text><text x="362" y="144" class="small" text-anchor="middle">transform + bounds</text><rect x="620" y="92" width="270" height="65" rx="5" class="slab"/><text x="755" y="130" class="" text-anchor="middle">Gameplay advances to 13</text><path d="M480 125 L590 125" class="line"/><path d="M405 160 L535 215" class="line"/><rect x="485" y="220" width="270" height="73" rx="5" class="slab"/><text x="620" y="249" class="" text-anchor="middle">Consume version 12</text><text x="620" y="276" class="small" text-anchor="middle">prepare render resources</text><path d="M755 255 L855 350" class="line"/><rect x="715" y="352" width="220" height="75" rx="5" class="slab"/><text x="825" y="380" class="" text-anchor="middle">Draw version 12</text><text x="825" y="406" class="small" text-anchor="middle">after dependencies</text><rect x="250" y="352" width="240" height="75" rx="5" class="warm"/><text x="370" y="382" class="" text-anchor="middle">Earlier work still runs</text><text x="370" y="408" class="small" text-anchor="middle">its resources stay alive</text><text x="235" y="477" class="small" text-anchor="start">time →     The lanes illustrate overlap, not a fixed latency guarantee.</text></svg>
