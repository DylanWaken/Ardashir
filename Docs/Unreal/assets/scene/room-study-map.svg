<text x="30" y="40" font-family="Arial, sans-serif" font-size="26" fill="#263a36" text-anchor="start" font-weight="bold">One room is the coordinate reference for the whole essay</text>
<rect x="80" y="140" width="440" height="500" rx="0" fill="#f0eee4" stroke="#53665f" stroke-width="2"/>
<line x1="80" y1="140" x2="80" y2="640" stroke="#a74834" stroke-width="8"/>
<line x1="520" y1="140" x2="520" y2="640" stroke="#237665" stroke-width="8"/>
