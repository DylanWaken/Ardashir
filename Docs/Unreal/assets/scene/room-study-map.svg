<text x="300" y="111" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="middle" font-weight="normal">Back wall: Y = 500 cm</text>
<text x="80" y="77" font-family="Arial, sans-serif" font-size="21" fill="#a74834" text-anchor="start" font-weight="normal">+X = screen-left</text>
<text x="520" y="77" font-family="Arial, sans-serif" font-size="21" fill="#237665" text-anchor="end" font-weight="normal">−X = screen-right</text>
<text x="300" y="674" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="middle" font-weight="normal">Open front: Y = 0</text>
