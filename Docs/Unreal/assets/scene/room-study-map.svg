<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">One room is the coordinate reference for the whole essay</title><desc id="desc">A top-down coordinate map of the four by five meter indoor room. Positive Unreal X is screen-left, positive Y points to the back wall. Solid objects are the captured baseline; dashed objects extend that same room. A tinted one-meter floor patch supports the computed geometry examples.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237665"/></marker></defs>
