<rect x="333.0" y="210" width="99.00000000000001" height="100" rx="0" fill="#b9cbd0" stroke="#326f96" stroke-width="2"/>
<text x="214" y="346" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="middle" font-weight="normal">Matte</text>
