<text x="620" y="310" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Y ∈ [0,500] cm; Z ∈ [0,300] cm</text>
<text x="620" y="340" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">L: ceiling source at (0,270,298) cm</text>
<text x="620" y="398" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">H: hinge at (−150,200,0) cm</text>
<text x="620" y="428" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">The two dashed segments are two door poses.</text>
<text x="620" y="458" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Yellow marks show its attached indicator.</text>
<text x="620" y="515" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">M: skeletal mannequin at (65,110,0) cm</text>
<text x="620" y="545" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Pots 0–2: X = −145, −105, −65; Y = 80 cm</text>
<text x="620" y="575" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">F: X ∈ [−50,50], Y ∈ [200,300], Z = 0</text>
<text x="620" y="647" font-family="Arial, sans-serif" font-size="19" fill="#263a36" text-anchor="start" font-weight="normal">A coordinate schematic, not a rendered screenshot.</text>
<text x="620" y="675" font-family="Arial, sans-serif" font-size="19" fill="#263a36" text-anchor="start" font-weight="normal">Solid block footprints use the captured bounds.</text>
<text x="620" y="703" font-family="Arial, sans-serif" font-size="19" fill="#263a36" text-anchor="start" font-weight="normal">The floor patch is an analytic teaching surface.</text>
