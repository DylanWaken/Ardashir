<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A mesh description specialized by a rendering pass</title><desc id="desc">A mesh batch supplies geometry and appearance. Different pass processors select different data, shader behavior and view state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#526845"/></marker></defs><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#252722} .small{font-size:18px;fill:#64665e} .label{font-size:23px;font-weight:600} .line{fill:none;stroke:#526845;stroke-width:2.5;marker-end:url(#arrow)} .grid{fill:none;stroke:#c9cabd;stroke-width:1.5} .slab{fill:#e1e7d6;stroke:#526845;stroke-width:2} .warm{fill:#f1dfd1;stroke:#9a5b34;stroke-width:2}</style><rect width="1000" height="600" fill="#fffdf8"/><text x="40" y="43" class="label" text-anchor="start">One description, several questions</text><rect x="45" y="205" width="275" height="112" rx="5" class="slab"/><text x="65" y="241" class="" text-anchor="start">Slab mesh batch</text><text x="65" y="275" class="small" text-anchor="start">geometry + material</text><text x="65" y="300" class="small" text-anchor="start">scene instance addressing</text><rect x="470" y="80" width="465" height="100" rx="5" class="slab"/><text x="490" y="115" class="" text-anchor="start">Depth: which surface is nearest?</text><text x="490" y="153" class="small" text-anchor="start">Position and coverage</text><rect x="470" y="240" width="465" height="100" rx="5" class="slab"/><text x="490" y="275" class="" text-anchor="start">Base pass: what is the surface?</text><text x="490" y="313" class="small" text-anchor="start">UVs, normal, material outputs</text><rect x="470" y="400" width="465" height="100" rx="5" class="slab"/><text x="490" y="435" class="" text-anchor="start">Shadow: is light blocked?</text><text x="490" y="473" class="small" text-anchor="start">Light view and material coverage</text><path d="M325 246 L395 246 L395 130 L460 130" class="line"/><path d="M325 260 L460 290" class="line"/><path d="M325 280 L395 280 L395 450 L460 450" class="line"/><text x="45" y="555" class="small" text-anchor="start">Displacement must affect the relevant shapes; masking must affect coverage.</text></svg>
