<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Deferred lighting reuses visible surface data</title><desc id="desc">One slab sample writes surface attributes. Two lights read those attributes and add their linear contributions to the resulting pixel.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#526845"/></marker></defs><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#252722} .small{font-size:18px;fill:#64665e} .label{font-size:23px;font-weight:600} .line{fill:none;stroke:#526845;stroke-width:2.5;marker-end:url(#arrow)} .grid{fill:none;stroke:#c9cabd;stroke-width:1.5} .slab{fill:#e1e7d6;stroke:#526845;stroke-width:2} .warm{fill:#f1dfd1;stroke:#9a5b34;stroke-width:2}</style><rect width="1000" height="550" fill="#fffdf8"/><text x="40" y="43" class="label" text-anchor="start">Reuse one visible surface for two lights</text><path d="M65 220 L210 220 L160 90 Z" class="slab"/><circle cx="150" cy="165" r="6" fill="#9a5b34"/><text x="45" y="263" class="small" text-anchor="start">Slab sample</text><path d="M220 170 L310 170" class="line"/><rect x="325" y="90" width="290" height="200" rx="5" class="slab"/><text x="345" y="130" class="" text-anchor="start">Stored surface</text><text x="345" y="168" class="small" text-anchor="start">normal, color, roughness</text><text x="345" y="204" class="small" text-anchor="start">shading model + depth</text><text x="345" y="252" class="small" text-anchor="start">Logical attributes only</text><rect x="720" y="80" width="230" height="77" rx="5" class="slab"/><text x="835" y="112" class="" text-anchor="middle">Evaluate lamp A</text><text x="835" y="140" class="small" text-anchor="middle">(0.12, 0.10, 0.06)</text><rect x="720" y="220" width="230" height="77" rx="5" class="slab"/><text x="835" y="252" class="" text-anchor="middle">Evaluate lamp B</text><text x="835" y="280" class="small" text-anchor="middle">(0.02, 0.03, 0.05)</text><path d="M620 155 L710 118" class="line"/><path d="M620 225 L710 258" class="line"/><path d="M830 305 L830 350" class="line"/><path d="M955 120 L975 120 L975 395 L945 395" class="line"/><rect x="590" y="360" width="350" height="85" rx="5" class="warm"/><text x="765" y="393" class="" text-anchor="middle">Accumulated linear scene color</text><text x="765" y="426" class="small" text-anchor="middle">(0.14, 0.13, 0.11)</text><text x="45" y="503" class="small" text-anchor="start">The material describes a response. Lights supply incoming illumination.</text></svg>
