<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Regrouping releases old boundaries</title><desc id="desc">Two groups constrain their outside borders while interior edges can simplify. At the next level a different grouping makes the old central boundary an interior edge.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2c7568"/></marker></defs><rect width="960" height="500" fill="#fcfaf5"/>
<text x="32" y="40" fill="#24332e" font-family="Arial, sans-serif" font-size="25" text-anchor="start" font-weight="bold">A boundary must not stay locked forever</text>
<text x="32" y="138" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">Fine clusters</text>
<rect x="260" y="90" width="145" height="80" rx="0" fill="#e2ece4" stroke="#586960" stroke-width="1"/>
<text x="332" y="137" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">A</text>
<rect x="407" y="90" width="145" height="80" rx="0" fill="#e9eddb" stroke="#586960" stroke-width="1"/>
<text x="479" y="137" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">B</text>
<rect x="554" y="90" width="145" height="80" rx="0" fill="#eaded3" stroke="#586960" stroke-width="1"/>
<text x="626" y="137" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">C</text>
<rect x="701" y="90" width="145" height="80" rx="0" fill="#dfe9ee" stroke="#586960" stroke-width="1"/>
<text x="773" y="137" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">D</text>
<rect x="260" y="90" width="294" height="80" rx="0" fill="none" stroke="#a04d33" stroke-width="5"/>
<rect x="554" y="90" width="294" height="80" rx="0" fill="none" stroke="#a04d33" stroke-width="5"/>
<line x1="907" y1="172" x2="907" y2="215" stroke="#2c7568" stroke-width="3" marker-end="url(#arrow)"/>
<text x="32" y="268" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">Reduce groups</text>
<rect x="260" y="220" width="145" height="80" rx="0" fill="#e2ece4" stroke="#586960" stroke-width="1"/>
<text x="332" y="267" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">P1</text>
<rect x="407" y="220" width="145" height="80" rx="0" fill="#e9eddb" stroke="#586960" stroke-width="1"/>
<text x="479" y="267" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">P2</text>
<rect x="554" y="220" width="145" height="80" rx="0" fill="#eaded3" stroke="#586960" stroke-width="1"/>
<text x="626" y="267" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">P3</text>
<rect x="701" y="220" width="145" height="80" rx="0" fill="#dfe9ee" stroke="#586960" stroke-width="1"/>
<text x="773" y="267" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">P4</text>
<rect x="260" y="220" width="294" height="80" rx="0" fill="none" stroke="#a04d33" stroke-width="5"/>
<rect x="554" y="220" width="294" height="80" rx="0" fill="none" stroke="#a04d33" stroke-width="5"/>
<line x1="907" y1="302" x2="907" y2="345" stroke="#2c7568" stroke-width="3" marker-end="url(#arrow)"/>
<text x="32" y="403" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">Regroup</text>
<rect x="260" y="355" width="145" height="80" rx="0" fill="#e2ece4" stroke="#586960" stroke-width="1"/>
<text x="332" y="402" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">C1</text>
<rect x="407" y="355" width="145" height="80" rx="0" fill="#e9eddb" stroke="#586960" stroke-width="1"/>
<text x="479" y="402" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">C2</text>
<rect x="554" y="355" width="145" height="80" rx="0" fill="#eaded3" stroke="#586960" stroke-width="1"/>
<text x="626" y="402" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">C3</text>
<rect x="701" y="355" width="145" height="80" rx="0" fill="#dfe9ee" stroke="#586960" stroke-width="1"/>
<text x="773" y="402" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">C4</text>
<rect x="407" y="355" width="294" height="80" rx="0" fill="none" stroke="#2c7568" stroke-width="5"/>
<line x1="554" y1="362" x2="554" y2="428" stroke="#9caa9f" stroke-width="2" stroke-dasharray="6 5"/>
<text x="261" y="192" fill="#586960" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal">Edges inside each pair may collapse.</text>
<text x="261" y="323" fill="#a04d33" font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="normal">The old middle border is still protected here.</text>
<text x="261" y="471" fill="#2c7568" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="normal">New grouping crosses that border, allowing simplification.</text>
</svg>
