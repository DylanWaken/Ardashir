<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">History follows a surface rather than a screen coordinate</title><desc id="desc">A crate moves right, exposing the floor behind its old location. Reprojected crate history can be used for the crate, while newly exposed floor must reject the old crate observation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2c7568"/></marker></defs><rect width="960" height="470" fill="#fcfaf5"/>
<text x="32" y="40" fill="#24332e" font-family="Arial, sans-serif" font-size="25" text-anchor="start" font-weight="bold">The same pixel address can describe a different surface</text>
<text x="245" y="93" fill="#24332e" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" font-weight="normal">Previous frame</text>
<text x="712" y="93" fill="#24332e" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" font-weight="normal">Current frame</text>
<rect x="45" y="116" width="400" height="214" rx="0" fill="#e6ebdf" stroke="#586960" stroke-width="1"/>
<line x1="46" y1="269" x2="444" y2="269" stroke="#a3b39f" stroke-width="2"/>
<rect x="513" y="116" width="400" height="214" rx="0" fill="#e6ebdf" stroke="#586960" stroke-width="1"/>
<line x1="514" y1="269" x2="912" y2="269" stroke="#a3b39f" stroke-width="2"/>
<rect x="146" y="161" width="135" height="141" rx="0" fill="#d0ac84" stroke="#a04d33" stroke-width="3"/>
<rect x="749" y="161" width="135" height="141" rx="0" fill="#d0ac84" stroke="#a04d33" stroke-width="3"/>
<circle cx="213" cy="228" r="9" fill="#2c7568" stroke="#2c7568" stroke-width="2"/>
<circle cx="816" cy="228" r="9" fill="#2c7568" stroke="#2c7568" stroke-width="2"/>
<path d="M216 228 C403 361 614 361 806 236" fill="none" stroke="#2c7568" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="614" y="180" width="52" height="93" rx="0" fill="#dce7d3" stroke="#2c7568" stroke-width="2" stroke-dasharray="6 4"/>
<text x="640" y="160" fill="#24332e" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="normal">New floor</text>
<line x1="213" y1="148" x2="630" y2="148" stroke="#a04d33" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M622 130 L642 150 M642 130 L622 150" fill="none" stroke="#a04d33" stroke-width="3"/>
<text x="245" y="383" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Crate history tracks the crate</text>
<text x="245" y="412" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">using motion correspondence.</text>
<text x="719" y="383" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Exposed floor rejects the old</text>
<text x="719" y="412" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">crate lighting at this address.</text>
<text x="480" y="452" fill="#24332e" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal">Lighting caches can have their own age, even after image history is rejected.</text>
</svg>
