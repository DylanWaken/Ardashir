<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">An indirect light path</title><desc id="desc">A lamp illuminates a crate; the crate reflects light to the wall; the wall reflects light toward the camera. Each segment requires visibility and each surface changes the spectrum and direction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2c7568"/></marker></defs><rect width="960" height="480" fill="#fcfaf5"/>
<text x="32" y="40" fill="#24332e" font-family="Arial, sans-serif" font-size="25" text-anchor="start" font-weight="bold">Indirect light connects several surfaces</text>
<circle cx="100" cy="142" r="31" fill="#f4d99c" stroke="#a87520" stroke-width="2"/>
<text x="100" y="88" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Lamp</text>
<rect x="252" y="269" width="165" height="124" rx="0" fill="#d5b491" stroke="#a04d33" stroke-width="2"/>
<text x="334" y="429" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Wooden crate</text>
<rect x="721" y="122" width="78" height="271" rx="0" fill="#d8ddd1" stroke="#586960" stroke-width="2"/>
<text x="761" y="88" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Stone wall</text>
<path d="M470 135 L525 113 L525 167 Z" fill="#ddeaf1" stroke="#3b657f" stroke-width="2"/>
<rect x="441" y="119" width="38" height="32" rx="0" fill="#ddeaf1" stroke="#3b657f" stroke-width="2"/>
<text x="482" y="87" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Camera</text>
<line x1="124" y1="168" x2="280" y2="279" stroke="#2c7568" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="406" y1="313" x2="713" y2="219" stroke="#2c7568" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="714" y1="200" x2="533" y2="142" stroke="#2c7568" stroke-width="3" marker-end="url(#arrow)"/>
<text x="58" y="260" fill="#2c7568" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="normal">Direct segment</text>
<text x="515" y="324" fill="#2c7568" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="normal">Reflected segment</text>
<text x="586" y="160" fill="#2c7568" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="normal">To observer</text>
<line x1="55" y1="396" x2="861" y2="396" stroke="#586960" stroke-width="2"/>
<text x="480" y="469" fill="#24332e" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal">Every bounce combines surface response with visible incoming radiance.</text>
</svg>
