<text x="50" y="344" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">The same world-space deviation</text>
<text x="50" y="373" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="normal">needs finer geometry nearby.</text>
<text x="585" y="320" fill="#24332e" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="normal">Projected error ≈ focal scale × error / distance</text>
<text x="585" y="349" fill="#24332e" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="normal">Example: 2 mm at 20 m is smaller than at 2 m.</text>
