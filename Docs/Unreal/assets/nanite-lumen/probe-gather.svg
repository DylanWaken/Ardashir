<text x="760" y="155" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Probe position comes</text>
<text x="760" y="184" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">from visible geometry.</text>
<text x="760" y="246" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Each probe gathers</text>
<text x="760" y="275" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">many directions.</text>
<text x="760" y="337" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Reject inappropriate</text>
<text x="760" y="366" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">cross-surface sharing.</text>
