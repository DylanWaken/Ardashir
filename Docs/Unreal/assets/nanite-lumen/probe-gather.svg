<text x="480" y="456" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">Spatial density and angular resolution solve different problems.</text>
<text x="480" y="485" fill="#24332e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal">A floor sample should not be blended freely onto the crate.</text>
