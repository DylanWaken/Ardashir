<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc"><title id="title">One sleeve vertex keeps its weights while its bone results move</title><desc id="desc">A small triangulated strip is skinned with two bone transforms. For the tracked vertex, weights are 0.75 and 0.25. The current bone results 2,0 and 2,4 produce 2,1; the previous second-bone result 2,2 produced 2,0.5.</desc>
