<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc"><title id="title">A geometric hit identifies a place; the cache must still cover it</title><desc id="desc">A ray hits a triangular wall at coordinates one,one,zero. A card projection maps the hit into quarter,quarter of a four-by-four capture region. A highlighted atlas texel supplies a lighting lookup independently of the triangle intersection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237665"/></marker></defs>
<rect width="1040" height="650" fill="#fcfaf5"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="26" fill="#263a36" text-anchor="start" font-weight="bold">A geometric hit identifies a place; the cache must still cover it</text>
<polygon points="63.00,382.00 410.00,382.00 63.00,121.00" fill="#dcd4bf" stroke="#ac7420" stroke-width="2"/>
<circle cx="149.75" cy="316.75" r="9" fill="#a74834" stroke="#a74834" stroke-width="2"/>
<line x1="353" y1="148" x2="149.75" y2="316.75" stroke="#326f96" stroke-width="3" marker-end="url(#arrow)"/>
<text x="328" y="121" font-family="Arial, sans-serif" font-size="22" fill="#326f96" text-anchor="middle" font-weight="normal">incoming ray</text>
<text x="187" y="423" font-family="Arial, sans-serif" font-size="22" fill="#a74834" text-anchor="middle" font-weight="normal">hit P = (1,1,0)</text>
<text x="35" y="477" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">Intersection reports P and surface identity.</text>
<text x="35" y="506" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">It does not report the final light value.</text>
