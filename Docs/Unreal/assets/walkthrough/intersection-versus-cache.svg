<text x="198" y="425" font-family="Arial, sans-serif" font-size="21" fill="#a74834" text-anchor="middle" font-weight="normal">P = (−100,500,75) cm</text>
<text x="35" y="478" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Intersection supplies P and surface identity.</text>
<text x="35" y="507" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Cache lookup is a separate operation.</text>
