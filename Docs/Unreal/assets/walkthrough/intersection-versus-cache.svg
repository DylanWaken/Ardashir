<text x="32" y="587" font-family="Arial, sans-serif" font-size="19" fill="#263a36" text-anchor="start" font-weight="normal">The wall projection is a teaching parameterization, not a measured Lumen card assignment.</text>
<text x="32" y="614" font-family="Arial, sans-serif" font-size="19" fill="#263a36" text-anchor="start" font-weight="normal">Pink cells illustrate missing coverage; they do not assert missing coverage in this room capture.</text>
<text x="32" y="641" font-family="Arial, sans-serif" font-size="19" fill="#263a36" text-anchor="start" font-weight="normal">Card coordinates need not equal the wall material’s authored UV coordinates.</text>
