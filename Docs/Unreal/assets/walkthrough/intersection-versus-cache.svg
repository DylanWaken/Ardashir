<text x="591" y="481" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Card coordinate = (1/4, 1/4)</text>
<text x="591" y="512" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Map to resident atlas page; sample lighting.</text>
<path d="M415 321 L512 321 L512 225 L633 225" stroke="#237665" fill="none" stroke-width="3" marker-end="url(#arrow)"/>
<text x="32" y="582" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Pink cells illustrate missing cache coverage: a ray can hit geometry and still lack good cached data.</text>
<text x="32" y="611" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Card coordinates come from capture projection; they are not automatically the material’s UVs.</text>
