<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 675" role="img" aria-labelledby="title desc"><title id="title">A hit on the room’s back wall still needs a valid cache lookup</title><desc id="desc">A ray hits the baseline back wall at minus one hundred,five hundred,seventy five centimeters. The wall capture spans X minus two hundred to two hundred and Z zero to three hundred. Its normalized card coordinate is one quarter,one quarter, independently of material UVs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237665"/></marker></defs>
