<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">An unchanged rest bound can reject a visible moving hand</title><desc id="desc">A character stands outside the illustrated view region, but the animated arm reaches into it. The small rest bound misses the view; an updated bound intersects the view and preserves visibility.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237665"/></marker></defs>
<rect width="1040" height="620" fill="#fcfaf5"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="26" fill="#263a36" text-anchor="start" font-weight="bold">An unchanged rest bound can reject a visible moving hand</text>
<rect x="30" y="118" width="968" height="336" rx="0" fill="#f4f0e5" stroke="#53665f" stroke-width="1"/>
<rect x="568" y="119" width="429" height="334" rx="0" fill="#dce9df" stroke="#237665" stroke-width="2"/>
<text x="784" y="151" font-family="Arial, sans-serif" font-size="22" fill="#237665" text-anchor="middle" font-weight="normal">Visible region of this view</text>
<rect x="237" y="200" width="186" height="235" rx="0" fill="none" stroke="#a74834" stroke-width="3" stroke-dasharray="8 6"/>
<text x="250" y="187" font-family="Arial, sans-serif" font-size="21" fill="#a74834" text-anchor="start" font-weight="normal">stale rest bound</text>
<circle cx="329" cy="239" r="27" fill="#c7d9e4" stroke="#326f96" stroke-width="2"/>
<path d="M329 268 L329 359 M329 292 L277 338 M329 294 L418 255 L642 226 M329 357 L291 426 M329 357 L364 426" stroke="#326f96" fill="none" stroke-width="17"/>
<circle cx="644" cy="226" r="14" fill="#d9af83" stroke="#a74834" stroke-width="2"/>
<rect x="235" y="198" width="435" height="239" rx="0" fill="none" stroke="#237665" stroke-width="4"/>
<text x="596" y="418" font-family="Arial, sans-serif" font-size="20" fill="#237665" text-anchor="middle" font-weight="normal">current bound</text>
<line x1="568" y1="108" x2="568" y2="471" stroke="#237665" stroke-width="3"/>
<text x="37" y="508" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">Old bound: no overlap with the view → object incorrectly discarded.</text>
<text x="37" y="541" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">Updated bound: overlaps the view → animated hand can be drawn.</text>
<text x="37" y="574" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">The bound must enclose the actual pose, including material displacement.</text>
</svg>
