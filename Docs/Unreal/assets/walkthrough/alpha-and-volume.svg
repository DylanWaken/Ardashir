<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc"><title id="title">Room glass panes and mist accumulate differently</title><desc id="desc">Two room display-case panes apply alpha compositing in order. The room humidifier mist uses exponential transmittance along distance, with plotted attenuation and discrete segment values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237665"/></marker></defs>
<rect width="1040" height="650" fill="#fcfaf5"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="26" fill="#263a36" text-anchor="start" font-weight="bold">Room glass panes and mist accumulate differently</text>
<text x="263" y="91" font-family="Arial, sans-serif" font-size="24" fill="#263a36" text-anchor="middle" font-weight="bold">Room display-case panes</text>
<rect x="45" y="139" width="197" height="195" rx="0" fill="#ffffff" stroke="#53665f" stroke-width="1"/>
<rect x="65" y="158" width="124" height="124" fill="#0000ff" fill-opacity="0.5"/>
<rect x="111" y="198" width="114" height="115" fill="#ff0000" fill-opacity="0.5"/>
<text x="144" y="366" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="middle" font-weight="normal">Red in front</text>
<rect x="265" y="139" width="197" height="195" rx="0" fill="#ffffff" stroke="#53665f" stroke-width="1"/>
<rect x="285" y="158" width="124" height="124" fill="#ff0000" fill-opacity="0.5"/>
<rect x="331" y="198" width="114" height="115" fill="#0000ff" fill-opacity="0.5"/>
<text x="364" y="366" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="middle" font-weight="normal">Blue in front</text>
<text x="41" y="412" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Both α = 0.5, over white (1,1,1)</text>
<text x="41" y="446" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Red over blue: (0.75, 0.25, 0.50)</text>
<text x="41" y="480" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Blue over red: (0.50, 0.25, 0.75)</text>
<text x="795" y="91" font-family="Arial, sans-serif" font-size="24" fill="#263a36" text-anchor="middle" font-weight="bold">Room humidifier mist</text>
