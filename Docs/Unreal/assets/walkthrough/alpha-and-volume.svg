<text x="592" y="148" font-family="Arial, sans-serif" font-size="18" fill="#263a36" text-anchor="end" font-weight="normal">1</text>
<text x="979" y="399" font-family="Arial, sans-serif" font-size="18" fill="#263a36" text-anchor="end" font-weight="normal">distance (m)</text>
<text x="577" y="123" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">T</text>
<text x="594" y="445" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">T(d) = exp(−σt d), σt = 0.5 /m</text>
<text x="594" y="479" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">1 m: 0.607    2 m: 0.368    4 m: 0.135</text>
<text x="32" y="574" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Fog also adds in-scattered and emitted light along the ray; transmittance alone is only extinction.</text>
<text x="32" y="603" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Illustrative equations and colors, not Unreal’s complete translucency or volumetric pipeline.</text>
</svg>
