<text x="510" y="428" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">Each row also supplies a surface normal.</text>
<text x="510" y="457" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">Here all four normals are (0, 0, 1).</text>
<text x="510" y="486" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">The two triangles share v0 and v2.</text>
<text x="31" y="572" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">A vertex index selects a whole attribute row; a UV selects a place in a texture.</text>
