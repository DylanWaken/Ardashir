<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 630" role="img" aria-labelledby="title desc"><title id="title">The gate can leave the camera while its shadow remains visible</title><desc id="desc">A top-down plan shows the camera frustum, a visible paving sample, a lamp, and a gate outside the camera frustum. The lamp-to-sample segment crosses the gate, so the sample is shadowed.</desc>
