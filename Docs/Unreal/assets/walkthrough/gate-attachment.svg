<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">The room door carries its attached indicator through the same turn</title><desc id="desc">A top-down room door rotates ninety degrees around a hinge at world −150,200 centimeters. The door endpoint moves from −50,200 to −150,300. An indicator sixty centimeters from the hinge moves from −90,200 to −150,260.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237665"/></marker></defs>
<rect width="1040" height="620" fill="#fcfaf5"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="26" fill="#263a36" text-anchor="start" font-weight="bold">The room door carries its attached indicator through the same turn</text>
<line x1="112.0" y1="450.0" x2="112.0" y2="112.5" stroke="#dce1d5" stroke-width="1"/>
<line x1="157.0" y1="450.0" x2="157.0" y2="112.5" stroke="#dce1d5" stroke-width="1"/>
