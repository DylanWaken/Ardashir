<line x1="472.0" y1="450.0" x2="472.0" y2="112.5" stroke="#dce1d5" stroke-width="1"/>
<line x1="517.0" y1="450.0" x2="517.0" y2="112.5" stroke="#dce1d5" stroke-width="1"/>
<line x1="112.0" y1="427.5" x2="517.0" y2="427.5" stroke="#dce1d5" stroke-width="1"/>
<line x1="112.0" y1="382.5" x2="517.0" y2="382.5" stroke="#dce1d5" stroke-width="1"/>
<line x1="112.0" y1="337.5" x2="517.0" y2="337.5" stroke="#dce1d5" stroke-width="1"/>
