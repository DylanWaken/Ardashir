<line x1="112.0" y1="157.5" x2="517.0" y2="157.5" stroke="#dce1d5" stroke-width="1"/>
<line x1="112.0" y1="112.5" x2="517.0" y2="112.5" stroke="#dce1d5" stroke-width="1"/>
<line x1="202.0" y1="382.5" x2="427.0" y2="382.5" stroke="#a74834" stroke-width="10"/>
<line x1="202.0" y1="382.5" x2="202.0" y2="157.5" stroke="#237665" stroke-width="10"/>
<circle cx="202.0" cy="382.5" r="10" fill="#263a36" stroke="#263a36" stroke-width="2"/>
<circle cx="337.0" cy="382.5" r="13" fill="#edcf83" stroke="#ac7420" stroke-width="2"/>
<circle cx="202.0" cy="247.5" r="13" fill="#edcf83" stroke="#ac7420" stroke-width="2"/>
<path d="M332.0 382.5 A130 130 0 0 0 202.0 252.5" stroke="#237665" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<text x="282.0" y="294.5" font-family="Arial, sans-serif" font-size="23" fill="#237665" text-anchor="start" font-weight="normal">90°</text>
<text x="427.0" y="417.5" font-family="Arial, sans-serif" font-size="20" fill="#a74834" text-anchor="middle" font-weight="normal">(−50,200)</text>
<text x="202.0" y="135.5" font-family="Arial, sans-serif" font-size="20" fill="#237665" text-anchor="middle" font-weight="normal">(−150,300)</text>
<text x="182.0" y="421.5" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="middle" font-weight="normal">hinge (−150,200)</text>
<text x="593" y="139" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">Door endpoint, local (100,0):</text>
<text x="593" y="173" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">Rz(90°) × (100,0) = (0,100)</text>
<text x="593" y="207" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">world = (−150,200) + (0,100)</text>
<text x="593" y="241" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">= (−150,300) cm</text>
<text x="593" y="337" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">Indicator offset, local (60,0):</text>
<text x="593" y="371" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">Rz(90°) × (60,0) = (0,60)</text>
<text x="593" y="405" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="start" font-weight="normal">world indicator = (−150,260) cm</text>
<text x="32" y="551" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">Top-down attachment schematic: XY only; indicator height is omitted.</text>
<text x="32" y="580" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">The GPU can read resolved world transforms; it need not traverse this attachment chain.</text>
</svg>
