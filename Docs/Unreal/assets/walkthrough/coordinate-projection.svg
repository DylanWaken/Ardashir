<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc"><title id="title">The room floor patch in local, world, and image space</title><desc id="desc">A mathematical one-meter square patch of the room floor is translated to minus fifty,two hundred,zero centimeters. A teaching overhead camera projects it by dividing by positive forward depth. This extracted patch is not the room Cube mesh topology.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237665"/></marker></defs>
<rect width="1040" height="680" fill="#fcfaf5"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="26" fill="#263a36" text-anchor="start" font-weight="bold">The room floor patch in local, world, and image space</text>
<text x="173" y="86" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="middle" font-weight="normal">Local patch</text>
<text x="173" y="115" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="middle" font-weight="normal">100 × 100 cm</text>
<line x1="55" y1="321" x2="300" y2="321" stroke="#53665f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="80" y1="347" x2="80" y2="135" stroke="#53665f" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="80.00,321.00 250.00,321.00 250.00,151.00" fill="#e3eadd" stroke="#237665" stroke-width="2"/>
<text x="509" y="86" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="middle" font-weight="normal">World floor</text>
<text x="509" y="115" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="middle" font-weight="normal">translation (−50,200,0)</text>
<rect x="419" y="145.0" width="176.0" height="220.0" rx="0" fill="#efeee6" stroke="#53665f" stroke-width="1"/>
<polygon points="485.00,277.00 529.00,277.00 529.00,233.00" fill="#e4dcc5" stroke="#ac7420" stroke-width="2"/>
<text x="507" y="397" font-family="Arial, sans-serif" font-size="18" fill="#263a36" text-anchor="middle" font-weight="normal">inside 4 m × 5 m room</text>
<text x="853" y="86" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="middle" font-weight="normal">Teaching image</text>
<text x="853" y="115" font-family="Arial, sans-serif" font-size="22" fill="#263a36" text-anchor="middle" font-weight="normal">x = cx + f X / Z</text>
<rect x="711" y="158" width="301" height="231" rx="0" fill="#e7ece7" stroke="#53665f" stroke-width="1"/>
<polygon points="889.72,273.50 946.16,273.50 946.16,215.75" fill="#d5e4ee" stroke="#326f96" stroke-width="2"/>
<circle cx="80.0" cy="321.0" r="7" fill="#bd4939" stroke="#bd4939" stroke-width="2"/>
<circle cx="250.0" cy="321.0" r="7" fill="#287c6b" stroke="#287c6b" stroke-width="2"/>
<circle cx="250.0" cy="151.0" r="7" fill="#3d72b0" stroke="#3d72b0" stroke-width="2"/>
<circle cx="485.0" cy="277.0" r="7" fill="#bd4939" stroke="#bd4939" stroke-width="2"/>
<circle cx="529.0" cy="277.0" r="7" fill="#287c6b" stroke="#287c6b" stroke-width="2"/>
<circle cx="529.0" cy="233.0" r="7" fill="#3d72b0" stroke="#3d72b0" stroke-width="2"/>
<circle cx="889.71875" cy="273.5" r="7" fill="#bd4939" stroke="#bd4939" stroke-width="2"/>
<circle cx="946.15625" cy="273.5" r="7" fill="#287c6b" stroke="#287c6b" stroke-width="2"/>
<circle cx="946.15625" cy="215.75" r="7" fill="#3d72b0" stroke="#3d72b0" stroke-width="2"/>
<text x="32" y="441" font-family="Arial, sans-serif" font-size="24" fill="#263a36" text-anchor="start" font-weight="normal">Track the red vertex v0:</text>
<text x="50" y="481" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">Local: (0,0,0)</text>
<text x="50" y="510" font-family="Arial, sans-serif" font-size="21" fill="#263a36" text-anchor="start" font-weight="normal">World: (−50,200,0) cm</text>
<text x="362" y="467" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Camera coordinates: (50,0,400)</text>
<text x="362" y="496" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">positive forward depth = 400 cm</text>
<text x="362" y="525" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">f = 240 px; center = (160,120)</text>
<text x="763" y="481" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Image: (190,120)</text>
<text x="763" y="510" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">240 × 50 / 400 = 30 px</text>
<text x="32" y="582" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Overhead teaching camera at (−100,200,400) cm, looking down along −Z.</text>
<text x="32" y="611" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">The ceiling is omitted for this mathematical closeup; this is not the Unreal capture camera.</text>
<text x="32" y="640" font-family="Arial, sans-serif" font-size="20" fill="#263a36" text-anchor="start" font-weight="normal">Image Y increases downward. The same patch returns in the one-pixel worked example.</text>
</svg>
