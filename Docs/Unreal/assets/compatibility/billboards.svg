<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Billboards face the current view</title><desc id="desc">Two planar signs point toward a camera from different positions. Their orientation follows the view rather than remaining a fixed mesh plane.</desc><defs><radialGradient id="smoke"><stop stop-color="#788879" stop-opacity=".65"/><stop offset="1" stop-color="#aab6a3" stop-opacity="0"/></radialGradient><radialGradient id="fire"><stop stop-color="#ffe9a1"/><stop offset=".5" stop-color="#df943f" stop-opacity=".85"/><stop offset="1" stop-color="#df943f" stop-opacity="0"/></radialGradient></defs><rect width="900" height="330" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="25" y="32" font-size="23" text-anchor="start" fill="#30342d">Billboards face the current view</text><polygon points="126,117 276,94 276,239 126,258" fill="#d2e0e0" stroke="#30342d" stroke-width="2"/><circle cx="203" cy="175" r="40" fill="#c99c64" stroke="none" opacity="1"/><polygon points="480,101 629,123 629,269 480,247" fill="#dce6ce" stroke="#30342d" stroke-width="2"/><path d="M505 216 Q552 117 604 217 Q554 263 505 216" fill="#8eaa7b" stroke="#30342d" stroke-width="2" /><line x1="204" y1="264" x2="778" y2="181" stroke="#a7b59a" stroke-width="1" stroke-dasharray="7 6"/><line x1="555" y1="272" x2="778" y2="181" stroke="#a7b59a" stroke-width="1" stroke-dasharray="7 6"/><polygon points="772,151 824,167 824,207 772,223" fill="#b8c4ab" stroke="#30342d" stroke-width="2"/><text x="805" y="261" font-size="18" text-anchor="middle" fill="#30342d">Camera</text><text x="450" y="312" font-size="18" text-anchor="middle" fill="#30342d">Facing and size rules are evaluated per view</text></g></svg>