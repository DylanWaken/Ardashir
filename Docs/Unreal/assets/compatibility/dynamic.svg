<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Editable mesh connectivity</title><desc id="desc">The right mesh has a local cut with new highlighted boundaries, illustrating topology and attribute updates rather than only vertex movement.</desc><defs><radialGradient id="smoke"><stop stop-color="#788879" stop-opacity=".65"/><stop offset="1" stop-color="#aab6a3" stop-opacity="0"/></radialGradient><radialGradient id="fire"><stop stop-color="#ffe9a1"/><stop offset=".5" stop-color="#df943f" stop-opacity=".85"/><stop offset="1" stop-color="#df943f" stop-opacity="0"/></radialGradient></defs><rect width="900" height="330" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="25" y="32" font-size="23" text-anchor="start" fill="#30342d">Editable mesh connectivity</text><g transform="translate(100 100) scale(1.45)"><polygon points="0,45 38,0 62,53" fill="#bbc8ac" stroke="#30342d" stroke-width="2"/><polygon points="38,0 112,10 62,53" fill="#d9dfcd" stroke="#30342d" stroke-width="2"/><polygon points="112,10 145,60 62,53" fill="#c0cdb3" stroke="#30342d" stroke-width="2"/><polygon points="145,60 112,110 62,53" fill="#8d9e81" stroke="#30342d" stroke-width="2"/><polygon points="112,110 30,103 62,53" fill="#a7b794" stroke="#30342d" stroke-width="2"/><polygon points="30,103 0,45 62,53" fill="#cad5bb" stroke="#30342d" stroke-width="2"/></g><text x="205" y="293" font-size="18" text-anchor="middle" fill="#30342d">Before edit</text><path d="M383 175 L475 175 M461 164 L475 175 L461 186" fill="none" stroke="#617858" stroke-width="2" /><polygon points="565,165 601,109 705,117 757,187 700,259 576,249" fill="#d4dfc5" stroke="#30342d" stroke-width="2"/><polygon points="654,177 705,117 757,187 701,188" fill="#fffdf8" stroke="#caa662" stroke-width="3"/><line x1="565" y1="165" x2="654" y2="177" stroke="#30342d" stroke-width="2"/><line x1="576" y1="249" x2="654" y2="177" stroke="#30342d" stroke-width="2"/><line x1="700" y1="259" x2="654" y2="177" stroke="#30342d" stroke-width="2"/><line x1="654" y1="177" x2="601" y2="109" stroke="#30342d" stroke-width="2"/><text x="666" y="293" font-size="18" text-anchor="middle" fill="#30342d">After local topology edit</text></g></svg>