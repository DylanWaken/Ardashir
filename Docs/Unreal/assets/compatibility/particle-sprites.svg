<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Sprite particles are generated surfaces</title><desc id="desc">Soft circular smoke marks sit on square planes facing a camera. The planes are generated from particle data.</desc><defs><radialGradient id="smoke"><stop stop-color="#788879" stop-opacity=".65"/><stop offset="1" stop-color="#aab6a3" stop-opacity="0"/></radialGradient><radialGradient id="fire"><stop stop-color="#ffe9a1"/><stop offset=".5" stop-color="#df943f" stop-opacity=".85"/><stop offset="1" stop-color="#df943f" stop-opacity="0"/></radialGradient></defs><rect width="900" height="330" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="25" y="32" font-size="23" text-anchor="start" fill="#30342d">Sprite particles are generated surfaces</text><rect x="73" y="134" width="94" height="94" fill="#f4f4ea" stroke="#9eac93"/><circle cx="120" cy="181" r="47" fill="url(#smoke)" stroke="none" opacity="1"/><rect x="211" y="76" width="104" height="104" fill="#f4f4ea" stroke="#9eac93"/><circle cx="263" cy="128" r="52" fill="url(#smoke)" stroke="none" opacity="1"/><rect x="337" y="172" width="78" height="78" fill="#f4f4ea" stroke="#9eac93"/><circle cx="376" cy="211" r="39" fill="url(#smoke)" stroke="none" opacity="1"/><rect x="470" y="68" width="100" height="100" fill="#f4f4ea" stroke="#9eac93"/><circle cx="520" cy="118" r="50" fill="url(#smoke)" stroke="none" opacity="1"/><rect x="598" y="131" width="118" height="118" fill="#f4f4ea" stroke="#9eac93"/><circle cx="657" cy="190" r="59" fill="url(#smoke)" stroke="none" opacity="1"/><polygon points="796,148 845,169 845,202 796,221" fill="#c4cfb8" stroke="#30342d" stroke-width="2"/><polygon points="778,169 796,157 796,213 778,201" fill="#829675" stroke="#30342d" stroke-width="2"/><text x="808" y="267" font-size="18" text-anchor="middle" fill="#30342d">Camera</text><text x="350" y="302" font-size="18" text-anchor="middle" fill="#30342d">Particle records expand into facing quads</text></g></svg>