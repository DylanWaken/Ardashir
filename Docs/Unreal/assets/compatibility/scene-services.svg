<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Room services: beyond surface geometry</title><desc id="desc">Schematic room services: beyond surface geometry in the same red/green-walled indoor room. Baseline light; other services proposed. The left plan locates the example; the right drawing explains its representation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#d6ad51"/></marker><radialGradient id="smoke"><stop stop-color="#748782" stop-opacity=".8"/><stop offset="1" stop-color="#748782" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="500" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="24" y="35" font-size="25" fill="#303a38" text-anchor="start">Room services: beyond surface geometry</text><text x="24" y="61" font-size="16" fill="#626d65" text-anchor="start">Baseline light; other services proposed · original explanatory SVG</text><line x1="296" y1="80" x2="296" y2="475" stroke="#d2d8ce" stroke-width="2" /><text x="26" y="91" font-size="20" fill="#303a38" text-anchor="start">Same 4 × 5 × 3 m room</text><rect x="42" y="135" width="200" height="250" fill="#f0eee6" stroke="#303a38" stroke-width="2" /><line x1="42" y1="135" x2="42" y2="385" stroke="#c67770" stroke-width="9" /><line x1="242" y1="135" x2="242" y2="385" stroke="#729b74" stroke-width="9" /><line x1="42" y1="135" x2="242" y2="135" stroke="#858c84" stroke-width="9" /><rect x="79.5" y="215.0" width="47.5" height="55.00000000000001" fill="#c9c3ac" stroke="#303a38" stroke-width="2" /><rect x="157.0" y="170.0" width="45.0" height="50" fill="#b7bec7" stroke="#303a38" stroke-width="2" /><text x="96" y="251" font-size="16" fill="#303a38" text-anchor="start">M</text><text x="171" y="204" font-size="16" fill="#303a38" text-anchor="start">G</text><rect x="113" y="236" width="58" height="40" fill="none" stroke="#d6ad51" stroke-width="2" stroke-dasharray="5 4"/><text x="142" y="128" font-size="15" fill="#303a38" text-anchor="middle">back wall</text><text x="142" y="411" font-size="16" fill="#303a38" text-anchor="middle">open front / camera</text><text x="24" y="438" font-size="16" fill="#303a38" text-anchor="start">M matte  ·  G glossy</text><text x="24" y="463" font-size="15" fill="#303a38" text-anchor="start">dashed: overhead RectLight</text><circle cx="142.00" cy="260.00" r="15" fill="#fff3be" stroke="#d6ad51" stroke-width="1.5"/><text x="142.0" y="266.0" font-size="20" fill="#303a38" text-anchor="middle">•</text><g transform="translate(321 84) scale(1)"><text x="25" y="35" font-size="19" fill="#303a38" text-anchor="start">The same room: light, decal projection, fog and view settings</text><rect x="75" y="96" width="205" height="184" fill="#e8e4d9" stroke="#303a38" stroke-width="2" /><rect x="75" y="96" width="10" height="184" fill="#c67770" stroke="none" stroke-width="2" /><rect x="270" y="96" width="10" height="184" fill="#729b74" stroke="none" stroke-width="2" /><rect x="148" y="99" width="60" height="9" fill="#d6ad51" stroke="none" stroke-width="2" /><path d="M148 112 L98 263 L254 263 L208 112 Z" fill="#f3e2a9" stroke="none" stroke-width="2" /><polygon points="133,202 151,184 217,184 199,202" fill="#e5e8dc" stroke="#303a38" stroke-width="2"/><polygon points="199,202 217,184 217,245 199,263" fill="#9eafa2" stroke="#303a38" stroke-width="2"/><rect x="133" y="202" width="66" height="61" fill="#c9d4c1" stroke="#303a38" stroke-width="2" /><path d="M180 217 l18 12 -17 17 -18 -11 Z" fill="#c67770" stroke="#303a38" stroke-width="2" /><text x="95" y="325" font-size="18" fill="#303a38" text-anchor="start">RectLight + receiver</text><rect x="375" y="117" width="150" height="163" fill="#e4e9e2" stroke="#303a38" stroke-width="2" /><ellipse cx="450" cy="229" rx="69" ry="44" fill="url(#smoke)"/><text x="382" y="325" font-size="18" fill="#303a38" text-anchor="start">bounded fog</text><rect x="614" y