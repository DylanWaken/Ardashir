<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Integrate a spatially varying medium</title><desc id="desc">Uneven smoke and flame occupy a bounding region. A ray samples density through the volume instead of shading only its boundary.</desc><defs><radialGradient id="smoke"><stop stop-color="#788879" stop-opacity=".65"/><stop offset="1" stop-color="#aab6a3" stop-opacity="0"/></radialGradient><radialGradient id="fire"><stop stop-color="#ffe9a1"/><stop offset=".5" stop-color="#df943f" stop-opacity=".85"/><stop offset="1" stop-color="#df943f" stop-opacity="0"/></radialGradient></defs><rect width="900" height="330" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="25" y="32" font-size="23" text-anchor="start" fill="#30342d">Integrate a spatially varying medium</text><polygon points="163,96 541,96 625,150 247,150" fill="#faf9f1" stroke="#96a48d" stroke-width="2"/><polygon points="163,96 247,150 247,269 163,212" fill="#faf9f1" stroke="#96a48d" stroke-width="2"/><polygon points="247,150 625,150 625,269 247,269" fill="none" stroke="#96a48d" stroke-width="2"/><circle cx="292" cy="195" r="78" fill="url(#smoke)" stroke="none" opacity="1"/><circle cx="362" cy="142" r="84" fill="url(#smoke)" stroke="none" opacity="1"/><circle cx="441" cy="193" r="92" fill="url(#smoke)" stroke="none" opacity="1"/><circle cx="514" cy="166" r="75" fill="url(#smoke)" stroke="none" opacity="1"/><circle cx="379" cy="223" r="74" fill="url(#smoke)" stroke="none" opacity="1"/><circle cx="390" cy="224" r="51" fill="url(#fire)" stroke="none" opacity="1"/><path d="M368 250 Q350 217 389 167 Q379 209 413 217 Q437 255 368 250 Z" fill="#dc9c48" stroke="none" stroke-width="2" /><line x1="119" y1="244" x2="693" y2="170" stroke="#caa662" stroke-width="3"/><circle cx="230" cy="230.0" r="3.5" fill="#caa662" stroke="none" opacity="1"/><circle cx="273" cy="224.5" r="3.5" fill="#caa662" stroke="none" opacity="1"/><circle cx="316" cy="219.0" r="3.5" fill="#caa662" stroke="none" opacity="1"/><circle cx="359" cy="213.5" r="3.5" fill="#caa662" stroke="none" opacity="1"/><circle cx="402" cy="208.0" r="3.5" fill="#caa662" stroke="none" opacity="1"/><circle cx="445" cy="202.5" r="3.5" fill="#caa662" stroke="none" opacity="1"/><circle cx="488" cy="197.0" r="3.5" fill="#caa662" stroke="none" opacity="1"/><circle cx="531" cy="191.5" r="3.5" fill="#caa662" stroke="none" opacity="1"/><circle cx="574" cy="186.0" r="3.5" fill="#caa662" stroke="none" opacity="1"/><text x="744" y="125" font-size="18" text-anchor="middle" fill="#30342d">Density</text><text x="744" y="155" font-size="18" text-anchor="middle" fill="#30342d">Emission</text><text x="744" y="185" font-size="18" text-anchor="middle" fill="#30342d">Integration</text><text x="450" y="311" font-size="18" text-anchor="middle" fill="#30342d">The bounding box is not the visible surface of the smoke.</text></g></svg>