<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Conventional triangle surface</title><desc id="desc">A faceted rock shows indexed triangle faces. Surface attributes and one placement transform accompany the mesh.</desc><defs><radialGradient id="smoke"><stop stop-color="#788879" stop-opacity=".65"/><stop offset="1" stop-color="#aab6a3" stop-opacity="0"/></radialGradient><radialGradient id="fire"><stop stop-color="#ffe9a1"/><stop offset=".5" stop-color="#df943f" stop-opacity=".85"/><stop offset="1" stop-color="#df943f" stop-opacity="0"/></radialGradient></defs><rect width="900" height="330" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="25" y="32" font-size="23" text-anchor="start" fill="#30342d">Conventional triangle surface</text><g transform="translate(120 73) scale(1.75)"><polygon points="0,45 38,0 62,53" fill="#bbc8ac" stroke="#30342d" stroke-width="2"/><polygon points="38,0 112,10 62,53" fill="#d9dfcd" stroke="#30342d" stroke-width="2"/><polygon points="112,10 145,60 62,53" fill="#c0cdb3" stroke="#30342d" stroke-width="2"/><polygon points="145,60 112,110 62,53" fill="#8d9e81" stroke="#30342d" stroke-width="2"/><polygon points="112,110 30,103 62,53" fill="#a7b794" stroke="#30342d" stroke-width="2"/><polygon points="30,103 0,45 62,53" fill="#cad5bb" stroke="#30342d" stroke-width="2"/></g><text x="240" y="302" font-size="19" text-anchor="middle" fill="#30342d">Indexed triangles</text><line x1="400" y1="158" x2="566" y2="126" stroke="#617858" stroke-width="2"/><text x="672" y="121" font-size="20" text-anchor="middle" fill="#30342d">Positions + indices</text><text x="672" y="151" font-size="18" text-anchor="middle" fill="#30342d">UVs, normals, materials</text><text x="672" y="218" font-size="18" text-anchor="middle" fill="#30342d">One component transform</text></g></svg>