<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Skylight: external cloud service</title><desc id="desc">Schematic skylight: external cloud service in the same red/green-walled indoor room. Proposed roof opening; no baseline sky. The left plan locates the example; the right drawing explains its representation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#d6ad51"/></marker><radialGradient id="smoke"><stop stop-color="#748782" stop-opacity=".8"/><stop offset="1" stop-color="#748782" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="500" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="24" y="35" font-size="25" fill="#303a38" text-anchor="start">Skylight: external cloud service</text><text x="24" y="61" font-size="16" fill="#626d65" text-anchor="start">Proposed roof opening; no baseline sky · original explanatory SVG</text><line x1="296" y1="80" x2="296" y2="475" stroke="#d2d8ce" stroke-width="2" /><text x="26" y="91" font-size="20" fill="#303a38" text-anchor="start">Same 4 × 5 × 3 m room</text><rect x="42" y="135" width="200" height="250" fill="#f0eee6" stroke="#303a38" stroke-width="2" /><line x1="42" y1="135" x2="42" y2="385" stroke="#c67770" stroke-width="9" /><line x1="242" y1="135" x2="242" y2="385" stroke="#729b74" stroke-width="9" /><line x1="42" y1="135" x2="242" y2="135" stroke="#858c84" stroke-width="9" /><rect x="79.5" y="215.0" width="47.5" height="55.00000000000001" fill="#c9c3ac" stroke="#303a38" stroke-width="2" /><rect x="157.0" y="170.0" width="45.0" height="50" fill="#b7bec7" stroke="#303a38" stroke-width="2" /><text x="96" y="251" font-size="16" fill="#303a38" text-anchor="start">M</text><text x="171" y="204" font-size="16" fill="#303a38" text-anchor="start">G</text><rect x="113" y="236" width="58" height="40" fill="none" stroke="#d6ad51" stroke-width="2" stroke-dasharray="5 4"/><text x="142" y="128" font-size="15" fill="#303a38" text-anchor="middle">back wall</text><text x="142" y="411" font-size="16" fill="#303a38" text-anchor="middle">open front / camera</text><text x="24" y="438" font-size="16" fill="#303a38" text-anchor="start">M matte  ·  G glossy</text><text x="24" y="463" font-size="15" fill="#303a38" text-anchor="start">dashed: overhead RectLight</text><circle cx="142.00" cy="180.00" r="15" fill="#fff3be" stroke="#d6ad51" stroke-width="1.5"/><text x="142.0" y="186.0" font-size="20" fill="#303a38" text-anchor="middle">•</text><g transform="translate(321 84) scale(1)"><text x="25" y="35" font-size="19" fill="#303a38" text-anchor="start">Optional skylight view: room geometry stays separate from sky services</text><rect x="92" y="126" width="560" height="175" fill="#ece9df" stroke="#303a38" stroke-width="2" /><rect x="242" y="127" width="235" height="48" fill="#c4d7df" stroke="#303a38" stroke-width="2" /><line x1="92" y1="126" x2="241" y2="126" stroke="#303a38" stroke-width="6" /><line x1="478" y1="126" x2="652" y2="126" stroke="#303a38" stroke-width="6" /><ellipse cx="284" cy="83" rx="32" ry="22" fill="#bacbd3"/><ellipse cx="330" cy="68" rx="40" ry="22" fill="#bacbd3"/><ellipse cx="377" cy="87" rx="34" ry="22" fill="#bacbd3"/><ellipse cx="431" cy="73" rx="30" ry="22" fill="#bacbd3"/><line x1="356" y1="273" x2="356" y2="94" stroke="#d6ad51" stroke-width="3" marker-end="url(#arrow)"/><text x="465" y="221" font-size="18" fill="#303a38" text-anchor="start">view ray through opening</text><text x="25" y="342" font-size="17" fill="#303a38" text-anchor="start">Clouds remain an outdoor atmospheric layer, never a miniature indoor cloud</text></g></g></svg>
