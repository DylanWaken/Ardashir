<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 342" role="img" aria-labelledby="title desc"><title id="title">A cloud layer around an atmospheric world</title><desc id="desc">Cloud volumes sit above a curved horizon and receive sunlight. The visible medium has layer altitude and thickness.</desc><defs><radialGradient id="smoke"><stop stop-color="#788879" stop-opacity=".65"/><stop offset="1" stop-color="#aab6a3" stop-opacity="0"/></radialGradient><radialGradient id="fire"><stop stop-color="#ffe9a1"/><stop offset=".5" stop-color="#df943f" stop-opacity=".85"/><stop offset="1" stop-color="#df943f" stop-opacity="0"/></radialGradient></defs><rect width="900" height="342" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="25" y="32" font-size="23" text-anchor="start" fill="#30342d">A cloud layer around an atmospheric world</text><path d="M45 288 Q450 166 855 288" fill="#cbd7b4" stroke="#617858" stroke-width="2" /><path d="M45 232 Q450 93 855 232" fill="none" stroke="#acc7d5" stroke-width="1" /><ellipse cx="176" cy="171" rx="75" ry="32" fill="#d4dfe0" opacity="0.8"/><ellipse cx="238" cy="148" rx="76" ry="40" fill="#d4dfe0" opacity="0.8"/><ellipse cx="310" cy="172" rx="63" ry="29" fill="#d4dfe0" opacity="0.8"/><ellipse cx="483" cy="139" rx="91" ry="40" fill="#d4dfe0" opacity="0.8"/><ellipse cx="558" cy="161" rx="74" ry="31" fill="#d4dfe0" opacity="0.8"/><ellipse cx="693" cy="191" rx="100" ry="34" fill="#d4dfe0" opacity="0.8"/><circle cx="787" cy="77" r="28" fill="#e5bf6d" stroke="none" opacity="1"/><line x1="765" y1="104" x2="619" y2="197" stroke="#caa662" stroke-width="2"/><line x1="747" y1="91" x2="448" y2="174" stroke="#caa662" stroke-width="2"/><text x="450" y="318" font-size="18" text-anchor="middle" fill="#30342d">Layer altitude + thickness + material density + atmospheric lighting</text></g></svg>