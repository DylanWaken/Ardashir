<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Application-generated triangle sections</title><desc id="desc">Five explicitly numbered vertices form three triangles. The highlighted triangle is new topology.</desc><defs><radialGradient id="smoke"><stop stop-color="#788879" stop-opacity=".65"/><stop offset="1" stop-color="#aab6a3" stop-opacity="0"/></radialGradient><radialGradient id="fire"><stop stop-color="#ffe9a1"/><stop offset=".5" stop-color="#df943f" stop-opacity=".85"/><stop offset="1" stop-color="#df943f" stop-opacity="0"/></radialGradient></defs><rect width="900" height="330" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="25" y="32" font-size="23" text-anchor="start" fill="#30342d">Application-generated triangle sections</text><polygon points="150,228 289,259 297,107" fill="#d4dec4" stroke="#30342d" stroke-width="2"/><polygon points="289,259 430,197 297,107" fill="#a8bc95" stroke="#30342d" stroke-width="2"/><polygon points="430,197 542,147 297,107" fill="#e5d29c" stroke="#30342d" stroke-width="2"/><circle cx="150" cy="228" r="5" fill="#30342d" stroke="none" opacity="1"/><text x="150" y="215" font-size="18" text-anchor="middle" fill="#30342d">0</text><circle cx="289" cy="259" r="5" fill="#30342d" stroke="none" opacity="1"/><text x="289" y="246" font-size="18" text-anchor="middle" fill="#30342d">1</text><circle cx="430" cy="197" r="5" fill="#30342d" stroke="none" opacity="1"/><text x="430" y="184" font-size="18" text-anchor="middle" fill="#30342d">2</text><circle cx="297" cy="107" r="5" fill="#30342d" stroke="none" opacity="1"/><text x="297" y="94" font-size="18" text-anchor="middle" fill="#30342d">3</text><circle cx="542" cy="147" r="5" fill="#30342d" stroke="none" opacity="1"/><text x="542" y="134" font-size="18" text-anchor="middle" fill="#30342d">4</text><text x="693" y="125" font-size="18" text-anchor="middle" fill="#30342d">Explicit vertex array</text><text x="693" y="165" font-size="18" text-anchor="middle" fill="#30342d">Explicit triangle indices</text><text x="693" y="205" font-size="18" text-anchor="middle" fill="#30342d">Mutable sections</text><text x="450" y="315" font-size="18" text-anchor="middle" fill="#30342d">A new triangle is a topology update, not merely a transform change.</text></g></svg>