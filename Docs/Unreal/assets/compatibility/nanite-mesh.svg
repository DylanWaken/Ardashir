" x2="275" y2="152" stroke="#697b64" stroke-width="1"/><line x1="105" y1="216" x2="275" y2="178" stroke="#697b64" stroke-width="1"/><g transform="translate(625 124) scale(0.9)"><polygon points="0,45 38,0 62,53" fill="#bbc8ac" stroke="#30342d" stroke-width="2"/><polygon points="38,0 112,10 62,53" fill="#d9dfcd" stroke="#30342d" stroke-width="2"/><polygon points="112,10 145,60 62,53" fill="#c0cdb3" stroke="#30342d" stroke-width="2"/><polygon points="145,60 112,110 62,53" fill="#8d9e81" stroke="#30342d" stroke-width="2"/><polygon points="112,110 30,103 62,53" fill="#a7b794" stroke="#30342d" stroke-width="2"/><polygon points="30,103 0,45 62,53" fill="#cad5bb" stroke="#30342d" stroke-width="2"/></g><text x="210" y="302" font-size="19" text-anchor="middle" fill="#30342d">Fine triangle groups</text><text x="699" y="302" font-size="19" text-anchor="middle" fill="#30342d">Coarser visible detail</text><path d="M380 161 L514 161 M499 151 L514 161 L499 171" fill="none" stroke="#617858" stroke-width="2" /></g></svg>