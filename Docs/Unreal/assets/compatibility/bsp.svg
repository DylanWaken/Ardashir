<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-labelledby="title desc"><title id="title">Model surfaces from brush construction</title><desc id="desc">A corner of a room includes a doorway cut through one wall; the remaining polygonal surfaces are triangulated for rendering.</desc><defs><radialGradient id="smoke"><stop stop-color="#788879" stop-opacity=".65"/><stop offset="1" stop-color="#aab6a3" stop-opacity="0"/></radialGradient><radialGradient id="fire"><stop stop-color="#ffe9a1"/><stop offset=".5" stop-color="#df943f" stop-opacity=".85"/><stop offset="1" stop-color="#df943f" stop-opacity="0"/></radialGradient></defs><rect width="900" height="345" fill="#fffdf8"/><g font-family="Arial,sans-serif"><text x="25" y="32" font-size="23" text-anchor="start" fill="#30342d">Model surfaces from brush construction</text><polygon points="190,92 435,71 435,225 190,255" fill="#dbe4d2" stroke="#30342d" stroke-width="2"/><polygon points="435,71 689,105 689,257 435,225" fill="#bdcfae" stroke="#30342d" stroke-width="2"/><polygon points="190,255 435,225 689,257 419,288" fill="#e6e5d1" stroke="#30342d" stroke-width="2"/><polygon points="280,151 350,144 350,241 280,250" fill="#fffdf8" stroke="#30342d" stroke-width="2"/><line x1="190" y1="92" x2="280" y2="151" stroke="#617858" stroke-width="1"/><line x1="350" y1="144" x2="435" y2="71" stroke="#617858" stroke-width="1"/><line x1="350" y1="241" x2="435" y2="225" stroke="#617858" stroke-width="1"/><line x1="435" y1="71" x2="689" y2="257" stroke="#617858" stroke-width="1"/><text x="450" y="321" font-size="18" text-anchor="middle" fill="#30342d">Authored solid operations → renderable model surfaces</text></g></svg>