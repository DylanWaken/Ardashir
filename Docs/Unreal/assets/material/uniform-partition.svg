<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">Partition work by its dependencies</title><desc id="desc">The product of tint and brightness can be evaluated for material uniform data. The UV-dependent texture result remains varying and multiplies the cached tint.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526845"/></marker></defs>
<rect width="960" height="510" fill="#fffdf8"/>
<g font-family="Arial, sans-serif"><text x="30" y="36" text-anchor="start" font-size="24" fill="#252722" font-weight="600">Partition work by its dependencies</text><line x1="30" y1="274" x2="930" y2="274" stroke="#d5d7cf"/><text x="30" y="85" text-anchor="start" font-size="17" fill="#526845" font-weight="600">UNIFORM FOR THE MATERIAL BINDING</text><rect x="30" y="116" width="240" height="83" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="150.0" y="150.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Tint and Brightness</text><text x="150.0" y="177.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Runtime parameters</text><polyline points="270,158 353,158" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="355" y="116" width="235" height="83" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="472.5" y="150.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Engine-side evaluation</text><text x="472.5" y="177.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Multiply values</text><polyline points="590,158 673,158" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="675" y="116" width="255" height="83" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="802.5" y="150.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Material uniform buffer</text><text x="802.5" y="177.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">AdjustedTint</text><text x="480" y="242" text-anchor="middle" font-size="18" fill="#252722" font-weight="400">Changing these values invalidates data; it need not create new shader code.</text><text x="30" y="311" text-anchor="start" font-size="17" fill="#526845" font-weight="600">VARYING ACROSS THE SURFACE</text><rect x="30" y="344" width="240" height="91" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="150.0" y="382.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">UV0 × Tiling</text><text x="150.0" y="409.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Interpolated coordinates</text><polyline points="270,388 353,388" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="355" y="344" width="235" height="91" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="472.5" y="382.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Texture sample</text><text x="472.5" y="409.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Varies with UV</text><polyline points="590,388 673,388" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="675" y="344" width="255" height="91" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="802.5" y="382.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Multiply by AdjustedTint</text><text x="802.5" y="409.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Base Color</text><polyline points="803,199 908,199 908,329" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="480" y="479" text-anchor="middle" font-size="18" fill="#252722" font-weight="400">A uniform texture handle does not make a varying texture sample uniform.</text></g></svg>