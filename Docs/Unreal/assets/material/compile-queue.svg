<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">Schedule shader compilation as identified work</title><desc id="desc">Cache hits bypass backend compilation. Misses go to compile workers. Results are validated and associated with the matching material shader-map request.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526845"/></marker></defs>
<rect width="960" height="570" fill="#fffdf8"/>
<g font-family="Arial, sans-serif"><text x="30" y="36" text-anchor="start" font-size="24" fill="#252722" font-weight="600">Schedule shader compilation as identified work</text><rect x="30" y="100" width="240" height="88" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="150.0" y="136.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Material translation</text><text x="150.0" y="163.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Code + interface</text><polyline points="270,144 345,144" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="347" y="100" width="265" height="88" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="479.5" y="136.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Build requested jobs</text><text x="479.5" y="163.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Identity + target + entry</text><polyline points="612,144 682,144" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="684" y="100" width="246" height="88" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="807.0" y="150.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Cache lookup</text><polyline points="850,188 850,269" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="590" y="271" width="340" height="93" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="760.0" y="310.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Cache miss → worker</text><text x="760.0" y="337.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Compile the target shader</text><polyline points="715,188 715,225 520,225 520,406" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><text x="480" y="242" text-anchor="middle" font-size="18" fill="#252722" font-weight="400">Cache hit</text><polyline points="760,364 760,446 639,446" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="317" y="408" width="322" height="80" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="478.0" y="440.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Validate and associate results</text><text x="478.0" y="467.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Ready material shader map</text><text x="480" y="539" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">The completed result carries the identity of the request it satisfies.</text></g></svg>