<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" role="img" aria-labelledby="title desc">
<title id="title">Keep four reusable products distinct</title><desc id="desc">Translation caches, shader caches, cooked shader code, and pipeline-state caches have different keys and avoid different kinds of work. Arrows indicate a conceptual progression, not one universal cache implementation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526845"/></marker></defs>
<rect width="960" height="575" fill="#fffdf8"/>
<g font-family="Arial, sans-serif"><text x="30" y="36" text-anchor="start" font-size="24" fill="#252722" font-weight="600">Keep four reusable products distinct</text><rect x="30" y="90" width="260" height="83" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="160.0" y="137.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Translation cache</text><text x="330" y="120" text-anchor="start" font-size="18" fill="#252722" font-weight="400">Graph + static choices + translator configuration</text><text x="330" y="152" text-anchor="start" font-size="18" fill="#252722" font-weight="400">Product: generated material source and interface</text><polyline points="160,173 160,211" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="30" y="213" width="260" height="83" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="160.0" y="260.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Shader-map / job cache</text><text x="330" y="243" text-anchor="start" font-size="18" fill="#252722" font-weight="400">Shader type + target + source dependencies</text><text x="330" y="275" text-anchor="start" font-size="18" fill="#252722" font-weight="400">Product: compiled shaders and binding metadata</text><polyline points="160,296 160,334" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="30" y="336" width="260" height="83" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="160.0" y="383.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Cooked shader code</text><text x="330" y="366" text-anchor="start" font-size="18" fill="#252722" font-weight="400">Target build and required shader content</text><text x="330" y="398" text-anchor="start" font-size="18" fill="#252722" font-weight="400">Product: packaged reusable shader binaries</text><polyline points="160,419 160,457" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="30" y="459" width="260" height="83" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="160.0" y="506.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Pipeline-state cache</text><text x="330" y="489" text-anchor="start" font-size="18" fill="#252722" font-weight="400">Shaders + formats + render state + layout</text><text x="330" y="521" text-anchor="start" font-size="18" fill="#252722" font-weight="400">Product: a backend pipeline ready for execution</text></g></svg>