<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Two translators, one downstream contract</title><desc id="desc">The inspected engine chooses legacy translation or an experimental material IR route. Both emit generated material source and metadata. They are not consecutive stages.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526845"/></marker></defs>
<rect width="960" height="610" fill="#fffdf8"/>
<g font-family="Arial, sans-serif"><text x="30" y="36" text-anchor="start" font-size="24" fill="#252722" font-weight="600">Two translators, one downstream contract</text><rect x="327" y="80" width="305" height="70" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="479.5" y="121.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Material + target + static values</text><polyline points="478,150 478,193" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><text x="480" y="219" text-anchor="middle" font-size="20" fill="#252722" font-weight="600">Select the enabled translation route</text><polyline points="440,237 260,237 260,277" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="520,237 700,237 700,277" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="75" y="279" width="370" height="115" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="260.0" y="315.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Legacy FHLSLMaterialTranslator</text><text x="260.0" y="342.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Expression calls → typed chunks</text><text x="260.0" y="369.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Uniform-expression metadata</text><rect x="515" y="279" width="370" height="115" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="700.0" y="315.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Experimental material IR</text><text x="700.0" y="342.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">FMaterialIRModuleBuilder</text><text x="700.0" y="369.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">IR → HLSL translation</text><polyline points="260,394 260,434 429,434 429,464" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="700,394 700,434 531,434 531,464" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="225" y="465" width="510" height="79" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="480.0" y="510.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Generated Material.ush + compilation output</text><text x="480" y="583" text-anchor="middle" font-size="18" fill="#252722" font-weight="400">5.8.1 source default: new translator disabled; project/material gates still apply.</text></g></svg>