<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">A parameter update crosses a data boundary</title><desc id="desc">A game-thread material parameter change becomes a render command. The proxy updates uniforms, which bind to an already compatible shader program for execution.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526845"/></marker></defs>
<rect width="960" height="550" fill="#fffdf8"/>
<g font-family="Arial, sans-serif"><text x="30" y="36" text-anchor="start" font-size="24" fill="#252722" font-weight="600">A parameter update crosses a data boundary</text><text x="30" y="86" text-anchor="start" font-size="17" fill="#526845" font-weight="600">GAME THREAD</text><rect x="30" y="107" width="285" height="91" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="172.5" y="145.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Set Tint on an instance</text><text x="172.5" y="172.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Copy identity and value</text><polyline points="315,153 383,153" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="385" y="107" width="280" height="91" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="525.0" y="158.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Enqueue render command</text><polyline points="665,153 797,153 797,266" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><line x1="30" y1="235" x2="930" y2="235" stroke="#d5d7cf"/><text x="30" y="270" text-anchor="start" font-size="17" fill="#526845" font-weight="600">RENDER-FACING STATE</text><rect x="665" y="287" width="265" height="91" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="797.5" y="325.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Material render proxy</text><text x="797.5" y="352.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Update uniform cache</text><polyline points="665,333 578,333" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="320" y="287" width="255" height="91" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="447.5" y="325.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Shader bindings</text><text x="447.5" y="352.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Compatible parameter layout</text><polyline points="447,378 447,432" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="30" y="287" width="220" height="91" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="140.0" y="325.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Existing shader map</text><text x="140.0" y="352.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Program is unchanged</text><polyline points="250,333 318,333" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="270" y="434" width="355" height="79" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="447.5" y="466.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">GPU execution</text><text x="447.5" y="493.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Updated Tint, same algorithm</text></g></svg>