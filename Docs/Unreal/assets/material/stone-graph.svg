<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">The tiled stone graph</title><desc id="desc">Tiled UV coordinates feed color and normal texture samples. Tint multiplies color. A static switch selects a roughness expression.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526845"/></marker></defs>
<rect width="960" height="500" fill="#fffdf8"/>
<g font-family="Arial, sans-serif"><text x="30" y="36" text-anchor="start" font-size="24" fill="#252722" font-weight="600">The tiled stone graph</text><rect x="30" y="91" width="170" height="67" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="115.0" y="130.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">UV0</text><rect x="30" y="188" width="170" height="67" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="115.0" y="227.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Tiling</text><polyline points="200,124 250,124 250,167 294,167" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="200,221 250,221 250,193 294,193" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="295" y="144" width="185" height="74" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="387.5" y="173.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Multiply</text><text x="387.5" y="200.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Tiled UV</text><polyline points="480,169 530,169 530,120 584,120" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="480,194 530,194 530,298 584,298" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="585" y="82" width="165" height="75" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="667.5" y="125.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Color sample</text><rect x="585" y="260" width="165" height="75" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="667.5" y="303.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Normal sample</text><rect x="585" y="170" width="165" height="63" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="667.5" y="207.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Tint</text><polyline points="750,120 790,120" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="750,201 777,201 777,143 790,143" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="790" y="83" width="140" height="85" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="860.0" y="118.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Multiply</text><text x="860.0" y="145.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Base Color</text><polyline points="750,298 790,298" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="790" y="260" width="140" height="75" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="860.0" y="303.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Normal</text><rect x="30" y="378" width="245" height="79" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="152.5" y="423.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Dry / wet roughness</text><polyline points="275,417 343,417" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="345" y="378" width="315" height="79" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="502.5" y="410.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Static UseWetLayer</text><text x="502.5" y="437.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Choose during specialization</text><polyline points="660,417 790,417" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="790" y="378" width="140" height="79" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="860.0" y="423.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Roughness</text><text x="292" y="355" text-anchor="start" font-size="18" fill="#252722" font-weight="400">One dependency can feed several consumers.</text></g></svg>