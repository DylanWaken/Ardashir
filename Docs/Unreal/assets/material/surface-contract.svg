<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">A material supplies a surface contract</title><desc id="desc">Geometry and instance data enter the material. Surface properties are passed to lighting and other renderer consumers.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526845"/></marker></defs>
<rect width="960" height="510" fill="#fffdf8"/>
<g font-family="Arial, sans-serif"><text x="30" y="36" text-anchor="start" font-size="24" fill="#252722" font-weight="600">A material supplies a surface contract</text><rect x="30" y="102" width="225" height="100" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="142.5" y="144.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Geometry inputs</text><text x="142.5" y="171.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">UV · normal · position</text><rect x="30" y="270" width="225" height="100" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="142.5" y="312.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Instance data</text><text x="142.5" y="339.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Tint · textures · tiling</text><polyline points="255,152 305,152 305,220 344,220" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="255,320 305,320 305,250 344,250" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="345" y="170" width="230" height="115" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="460.0" y="220.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Material program</text><text x="460.0" y="247.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Evaluate properties</text><polyline points="575,226 654,226" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="655" y="164" width="275" height="125" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="792.5" y="205.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Surface properties</text><text x="792.5" y="232.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Base Color · roughness</text><text x="792.5" y="259.5" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Normal · coverage</text><polyline points="790,289 790,369" fill="none" stroke="#526845" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="655" y="370" width="275" height="83" rx="6" fill="#f0f2e8" stroke="#7a826a" stroke-width="1.5"/><text x="792.5" y="404.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Pass + visibility + light</text><text x="792.5" y="431.0" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Produce an image</text><text x="317" y="410" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Material evaluation describes the surface.</text><text x="317" y="437" text-anchor="middle" font-size="19" fill="#252722" font-weight="400">Lighting uses that description.</text></g></svg>