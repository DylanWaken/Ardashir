<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">The actual indoor room from asset sharing to renderer consumers</title>
<desc id="desc">Seven static mesh components share the Engine cube asset and five materials. The matte block has measured position 77.5,285,52.5 centimeters and scale .95,1.1,1.05. Its renderer proxy, scene membership, GPU placement and view-dependent consumers are explained without inventing internal IDs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#546a82"/></marker></defs>
<rect width="1120" height="660" rx="14" fill="#f3f6fa"/>
<g font-family="Arial,sans-serif" fill="#18304c"><text x="35" y="44" font-size="23" font-weight="bold">One real room, several representations</text><text x="35" y="73" font-size="15">Left: exported authoring data. Right: the source-backed renderer relationship.</text></g>
<g stroke="#93a9bf" stroke-width="1.5"><rect x="35" y="110" width="330" height="90" rx="10" fill="#dfebf8"/><rect x="35" y="250" width="330" height="215" rx="10" fill="#fff"/><rect x="35" y="505" width="330" height="105" rx="10" fill="#e5efe4"/><rect x="450" y="110" width="300" height="120" rx="10" fill="#fff"/><rect x="450" y="280" width="300" height="100" rx="10" fill="#e2eaf7"/><rect x="450" y="430" width="300" height="100" rx="10" fill="#e2eaf7"/><rect x="830" y="280" width="250" height="100" rx="10" fill="#f9ecd9"/><rect x="830" y="430" width="250" height="155" rx="10" fill="#f9ecd9"/></g>
<g font-family="Arial,sans-serif" fill="#18304c" font-size="17"><text x="55" y="142" font-weight="bold">One shared UStaticMesh</text><text x="55" y="174" font-size="15">/Engine/BasicShapes/Cube.Cube</text><text x="55" y="283" font-weight="bold">Seven StaticMeshComponents</text><text x="55" y="318">Floor · ceiling · back wall</text><text x="55" y="350">Red wall · green wall</text><text x="55" y="382">Matte block · glossy block</text><text x="55" y="428" font-size="15">Independent transforms and bounds</text><text x="55" y="538" font-weight="bold">Five material assets</text><text x="55" y="570">Neutral · red · green</text><text x="55" y="596">Matte · glossy</text><text x="470" y="143" font-weight="bold">Follow: Matte block</text><text x="470" y="177" font-size="15">Position: (77.5, 285, 52.5) cm</text><text x="470" y="207" font-size="15">Scale: (0.95, 1.1, 1.05)</text><text x="470" y="316" font-weight="bold">FPrimitiveSceneProxy</text><text x="470" y="350" font-size="15">Mirrored properties + behavior</text><text x="470" y="466" font-weight="bold">FPrimitiveSceneInfo</text><text x="470" y="500" font-size="15">Scene membership + cached links</text><text x="850" y="316" font-weight="bold">GPU placement</text><text x="850" y="350" font-size="15">Transform, bounds, bindings</text><text x="850" y="467" font-weight="bold">View-dependent work</text><text x="850" y="502" font-size="15">Camera / shadow visibility</text><text x="850" y="530" font-size="15">Surface-cache capture</text><text x="850" y="558" font-size="15">Tracing representation</text></g>
<g fill="none" stroke="#546a82" stroke-width="2" marker-end="url(#arrow)"><path d="M200 250V205"/><path d="M200 505V470"/><path d="M365 360H400V170H445"/><path d="M600 230V275"/><path d="M600 380V425"/><path d="M750 480H790V330H825"/><path d="M955 380V425"/></g>
<text x="450" y="627" font-family="Arial,sans-serif" font-size="14" fill="#52667d">No private renderer IDs or GPU indices were inferred from the actor inventory.</text>
</svg>
