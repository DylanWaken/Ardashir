<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="title desc">
<title id="title">Mesh description, vertex factory, material and pass processing</title><desc id="desc">A proxy supplies mesh batches. A batch combines geometry access via a vertex factory with material state. A pass processor creates compatible mesh draw commands, possibly cached.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="440" fill="#f8fafc" rx="12"/><text x="30" y="32" class="kicker" text-anchor="start">CONVENTIONAL MESH PATH · DESCRIPTION BECOMES PASS WORK</text><rect x="30" y="62" width="266" height="103" rx="8" class="blue"/><text x="46" y="90" class="strong" text-anchor="start">FPrimitiveSceneProxy</text><text x="46" y="115" class="label" text-anchor="start">Static descriptions cached</text><text x="46" y="137" class="label" text-anchor="start">or dynamic collection per view</text><path d="M296 113 L336 113" class="arrow"  marker-end="url(#head)"/><rect x="336" y="62" width="266" height="103" rx="8" class="green"/><text x="352" y="90" class="strong" text-anchor="start">FMeshBatch</text><text x="352" y="115" class="label" text-anchor="start">Geometry ranges + elements</text><text x="352" y="137" class="label" text-anchor="start">Vertex factory + material proxy</text><path d="M602 113 L644 113" class="arrow"  marker-end="url(#head)"/><rect x="644" y="62" width="266" height="103" rx="8" class="amber"/><text x="660" y="90" class="strong" text-anchor="start">FMeshPassProcessor</text><text x="660" y="115" class="label" text-anchor="start">Select pass-compatible shaders</text><text x="660" y="137" class="label" text-anchor="start">Set pipeline and bindings</text><rect x="30" y="221" width="266" height="104" rx="8" class="blue"/><text x="46" y="249" class="strong" text-anchor="start">FVertexFactory</text><text x="46" y="274" class="label" text-anchor="start">How to fetch positions / UVs</text><text x="46" y="296" class="label" text-anchor="start">and apply geometry-specific work</text><path d="M296 256 L336 148" class="arrow" stroke-dasharray="6 5" marker-end="url(#head)"/><rect x="336" y="221" width="266" height="104" rx="8" class="green"/><text x="352" y="249" class="strong" text-anchor="start">FMaterialRenderProxy</text><text x="352" y="274" class="label" text-anchor="start">Which surface program / values</text><text x="352" y="296" class="label" text-anchor="start">Fallback when applicable</text><path d="M470 221 L470 165" class="arrow" stroke-dasharray="6 5" marker-end="url(#head)"/><path d="M777 166 L777 221" class="arrow"  marker-end="url(#head)"/><rect x="644" y="221" width="266" height="104" rx="8" class="amber"/><text x="660" y="249" class="strong" text-anchor="start">FMeshDrawCommand</text><text x="660" y="274" class="label" text-anchor="start">Pass-specific draw state</text><text x="660" y="296" class="label" text-anchor="start">Cached when eligible</text><text x="30" y="375" class="small" text-anchor="start">Solid: transformation into work. Dashed: geometry / material dependencies.</text><text x="30" y="407" class="small" text-anchor="start">One batch can participate in depth, shadow and base passes with different shader work.</text></svg>