<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 405" role="img" aria-labelledby="title desc">
<title id="title">One world, several coordinated representations</title><desc id="desc">Authoring data produces a retained render scene. Each view selects work. Camera depth, shadow maps, ray geometry and lighting caches are derived representations with different purposes.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="405" fill="#f8fafc" rx="12"/><text x="30" y="34" class="kicker" text-anchor="start">ONE WORLD · DIFFERENT QUESTIONS</text><rect x="30" y="66" width="260" height="125" rx="8" class="blue"/><text x="46" y="94" class="strong" text-anchor="start">Authoring / gameplay</text><text x="46" y="119" class="label" text-anchor="start">What exists?</text><text x="46" y="141" class="label" text-anchor="start">Assets + components</text><text x="46" y="163" class="label" text-anchor="start">Transforms + animation</text><path d="M290 128 L350 128" class="arrow"  marker-end="url(#head)"/><rect x="350" y="66" width="250" height="125" rx="8" class="green"/><text x="366" y="94" class="strong" text-anchor="start">Retained render scene</text><text x="366" y="119" class="label" text-anchor="start">What may be rendered?</text><text x="366" y="141" class="label" text-anchor="start">Proxies + primitive records</text><text x="366" y="163" class="label" text-anchor="start">Versioned GPU tables</text><path d="M600 128 L660 128" class="arrow"  marker-end="url(#head)"/><rect x="660" y="66" width="250" height="125" rx="8" class="amber"/><text x="676" y="94" class="strong" text-anchor="start">Per-view work</text><text x="676" y="119" class="label" text-anchor="start">What matters this frame?</text><text x="676" y="141" class="label" text-anchor="start">Cull → raster / trace</text><text x="676" y="163" class="label" text-anchor="start">Shade → light → compose</text><path d="M475 191 L475 240" class="arrow"  marker-end="url(#head)"/><rect x="90" y="240" width="760" height="94" rx="8" class="plain"/><text x="106" y="268" class="strong" text-anchor="start">Derived representations answer different visibility queries</text><text x="106" y="293" class="label" text-anchor="start">Camera: depth / visibility     Light: shadow pages     Rays: distance fields / BVH</text><text x="106" y="315" class="label" text-anchor="start">Cached lighting: Lumen cards and radiance     None is the complete world.</text><text x="30" y="375" class="small" text-anchor="start">Solid arrows: data is converted or selected, not one shared mutable object.</text></svg>