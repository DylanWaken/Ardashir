<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 449" role="img" aria-labelledby="title desc">
<title id="title">Indexed geometry and material sections</title><desc id="desc">A quad consists of two indexed triangles sharing vertices. Attribute seams may require duplicate vertices, while sections assign materials and instances place shared geometry.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="449" fill="#f8fafc" rx="12"/><text x="30" y="33" class="kicker" text-anchor="start">INDEXED TRIANGLES · ONE QUAD, TWO SURFACES OF REUSE</text><path d="M65 100 L285 100 L285 300 L65 300Z M65 100 L285 300" fill="#e6f0fa" stroke="#6394bd" stroke-width="3"/><text x="65" y="88" class="strong" text-anchor="middle">v0</text><text x="285" y="88" class="strong" text-anchor="middle">v1</text><text x="285" y="326" class="strong" text-anchor="middle">v2</text><text x="65" y="326" class="strong" text-anchor="middle">v3</text><text x="108" y="245" class="label" text-anchor="start">triangle 1</text><text x="158" y="160" class="label" text-anchor="start">triangle 0</text><rect x="365" y="64" width="535" height="95" rx="8" class="blue"/><text x="381" y="92" class="strong" text-anchor="start">Vertex streams</text><text x="381" y="117" class="label" text-anchor="start">positions: [v0, v1, v2, v3]</text><text x="381" y="139" class="label" text-anchor="start">UVs, normals, tangents: attributes indexed with positions</text><rect x="365" y="180" width="535" height="87" rx="8" class="green"/><text x="381" y="208" class="strong" text-anchor="start">Index stream</text><text x="381" y="233" class="label" text-anchor="start">[0, 1, 2,  0, 2, 3] → six indices reference four vertices</text><rect x="365" y="288" width="535" height="89" rx="8" class="amber"/><text x="381" y="316" class="strong" text-anchor="start">Mesh section → material slot</text><text x="381" y="341" class="label" text-anchor="start">A triangle range selects a material binding.</text><text x="381" y="363" class="label" text-anchor="start">An instance transform places shared local-space geometry.</text><text x="30" y="417" class="small" text-anchor="start">At a UV or normal seam, one position may require multiple attribute vertices.</text></svg>