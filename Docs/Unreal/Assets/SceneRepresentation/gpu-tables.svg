<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 455" role="img" aria-labelledby="title desc">
<title id="title">CPU identities and GPU Scene indirection</title><desc id="desc">Component identity, persistent scene primitive index and packed CPU index have different lifetimes. One GPU primitive record points to multiple instance records; geometry assets are shared.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="455" fill="#f8fafc" rx="12"/><text x="30" y="32" class="kicker" text-anchor="start">IDENTITY IS NOT AN ARRAY POSITION</text><rect x="30" y="62" width="260" height="100" rx="8" class="blue"/><text x="46" y="90" class="strong" text-anchor="start">Component identity</text><text x="46" y="115" class="label" text-anchor="start">FPrimitiveComponentId</text><text x="46" y="137" class="label" text-anchor="start">can survive re-registration</text><rect x="340" y="62" width="265" height="100" rx="8" class="green"/><text x="356" y="90" class="strong" text-anchor="start">Scene membership</text><text x="356" y="115" class="label" text-anchor="start">FPersistentPrimitiveIndex</text><text x="356" y="137" class="label" text-anchor="start">valid while added to scene</text><rect x="660" y="62" width="250" height="100" rx="8" class="amber"/><text x="676" y="90" class="strong" text-anchor="start">CPU storage location</text><text x="676" y="115" class="label" text-anchor="start">PackedIndex</text><text x="676" y="137" class="label" text-anchor="start">may move in packed arrays</text><path d="M290 110 L340 110" class="arrow"  marker-end="url(#head)"/><path d="M605 110 L660 110" class="arrow"  marker-end="url(#head)"/><rect x="30" y="213" width="400" height="122" rx="8" class="green"/><text x="46" y="241" class="strong" text-anchor="start">GPU primitive record P</text><text x="46" y="266" class="label" text-anchor="start">Shared primitive-level state</text><text x="46" y="288" class="label" text-anchor="start">InstanceSceneDataOffset = B</text><text x="46" y="310" class="label" text-anchor="start">NumInstanceSceneDataEntries = K</text><path d="M430 274 L482 274" class="arrow"  marker-end="url(#head)"/><rect x="482" y="195" width="428" height="158" rx="8" class="blue"/><text x="498" y="223" class="strong" text-anchor="start">GPU instance range [B, B + K)</text><text x="498" y="248" class="label" text-anchor="start">Instance B + 0 → primitive P, transform T0</text><text x="498" y="270" class="label" text-anchor="start">Instance B + 1 → primitive P, transform T1</text><text x="498" y="292" class="label" text-anchor="start">Instance B + 2 → primitive P, transform T2</text><text x="498" y="314" class="label" text-anchor="start">Optional payload: custom data / history</text><text x="30" y="395" class="strong" text-anchor="start">A mesh asset supplies geometry; the instance record supplies placement.</text><text x="30" y="425" class="small" text-anchor="start">Persistent here means stable during scene membership, not serialized or never reused.</text></svg>