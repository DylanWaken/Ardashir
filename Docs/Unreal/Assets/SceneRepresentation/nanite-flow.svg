<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 445" role="img" aria-labelledby="title desc">
<title id="title">Nanite build, stream, cull, raster and shade</title><desc id="desc">Nanite builds clusters and a simplification hierarchy. Per-view selection uses resident detail, requests pages, rasterizes IDs and evaluates materials for visible surfaces. GPU Scene is separate.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="445" fill="#f8fafc" rx="12"/><text x="30" y="32" class="kicker" text-anchor="start">NANITE · SELECT DETAIL BEFORE EVALUATING SURFACES</text><rect x="30" y="64" width="266" height="115" rx="8" class="blue"/><text x="46" y="92" class="strong" text-anchor="start">Build / cook</text><text x="46" y="117" class="label" text-anchor="start">Triangle clusters</text><text x="46" y="139" class="label" text-anchor="start">Simplified groups + hierarchy</text><text x="46" y="161" class="label" text-anchor="start">Compressed streaming pages</text><path d="M296 120 L336 120" class="arrow"  marker-end="url(#head)"/><rect x="336" y="64" width="266" height="115" rx="8" class="green"/><text x="352" y="92" class="strong" text-anchor="start">Per view on GPU</text><text x="352" y="117" class="label" text-anchor="start">Instance / cluster culling</text><text x="352" y="139" class="label" text-anchor="start">Choose resident detail</text><text x="352" y="161" class="label" text-anchor="start">Request missing pages</text><path d="M602 120 L644 120" class="arrow"  marker-end="url(#head)"/><rect x="644" y="64" width="266" height="115" rx="8" class="amber"/><text x="660" y="92" class="strong" text-anchor="start">Visibility rasterization</text><text x="660" y="117" class="label" text-anchor="start">Small / large triangles</text><text x="660" y="139" class="label" text-anchor="start">Compute + hardware paths</text><text x="660" y="161" class="label" text-anchor="start">Depth + visible triangle IDs</text><rect x="30" y="224" width="572" height="88" rx="8" class="plain"/><text x="46" y="252" class="strong" text-anchor="start">Streaming has latency</text><text x="46" y="277" class="label" text-anchor="start">A valid resident coarser representation covers missing fine detail.</text><text x="46" y="299" class="label" text-anchor="start">The selected hierarchy cut changes with projected error.</text><path d="M777 180 L777 224" class="arrow"  marker-end="url(#head)"/><rect x="644" y="224" width="266" height="115" rx="8" class="blue"/><text x="660" y="252" class="strong" text-anchor="start">Material evaluation</text><text x="660" y="277" class="label" text-anchor="start">Fetch triangle attributes</text><text x="660" y="299" class="label" text-anchor="start">Evaluate surface program</text><text x="660" y="321" class="label" text-anchor="start">Write deferred surface data</text><text x="30" y="383" class="strong" text-anchor="start">GPU Scene supplies placements; Nanite owns specialized geometry and visibility.</text><text x="30" y="414" class="small" text-anchor="start">Conceptual baseline. Programmable deformation / masking complicates the clean split.</text></svg>