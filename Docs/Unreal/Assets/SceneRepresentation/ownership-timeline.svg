<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" role="img" aria-labelledby="title desc">
<title id="title">Game thread, render thread and GPU lifetimes</title><desc id="desc">An update is consumed asynchronously. Render-thread processing does not imply GPU completion. Old GPU allocations must remain alive until all consuming submissions complete.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="510" fill="#f8fafc" rx="12"/><text x="30" y="32" class="kicker" text-anchor="start">OWNERSHIP AND TIME · ILLUSTRATIVE OVERLAP</text><text x="22" y="87" class="strong" text-anchor="start">Game thread</text><path d="M175 119H910" class="arrow"/><text x="22" y="195" class="strong" text-anchor="start">Render thread</text><path d="M175 227H910" class="arrow"/><text x="22" y="303" class="strong" text-anchor="start">GPU</text><path d="M175 335H910" class="arrow"/><rect x="184" y="52" width="212" height="69" rx="8" class="blue"/><text x="200" y="80" class="strong" text-anchor="start">Edit component</text><text x="200" y="105" class="label" text-anchor="start">frame N: new transform</text><rect x="465" y="52" width="230" height="69" rx="8" class="blue"/><text x="481" y="80" class="strong" text-anchor="start">Continue simulation</text><text x="481" y="105" class="label" text-anchor="start">frame N+1 can overlap</text><path d="M395 106 L450 160" class="arrow"  marker-end="url(#head)"/><rect x="385" y="160" width="263" height="70" rx="8" class="green"/><text x="401" y="188" class="strong" text-anchor="start">Consume ordered update</text><text x="401" y="213" class="label" text-anchor="start">render-owned copy / records</text><path d="M648 225 L702 268" class="arrow"  marker-end="url(#head)"/><rect x="659" y="268" width="251" height="70" rx="8" class="amber"/><text x="675" y="296" class="strong" text-anchor="start">Execute submitted work</text><text x="675" y="321" class="label" text-anchor="start">reads retained GPU resources</text><text x="30" y="388" class="strong" text-anchor="start">Two different completion conditions</text><text x="30" y="420" class="label" text-anchor="start">Render-thread consumption: the CPU copy has been accepted.</text><text x="30" y="446" class="label" text-anchor="start">GPU completion: old buffers / descriptors / IDs may finally be retired.</text><text x="30" y="477" class="small" text-anchor="start">Do not reuse an ID or allocation while an older submission can still read it.</text></svg>