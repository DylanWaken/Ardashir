<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 433" role="img" aria-labelledby="title desc">
<title id="title">Deformation before placement, with current and previous state</title><desc id="desc">Skinning and other local deformation occur separately from object placement. Motion reconstruction requires previous deformation as well as transforms; all visibility bounds must be conservative.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="433" fill="#f8fafc" rx="12"/><text x="30" y="32" class="kicker" text-anchor="start">PLACEMENT, DEFORMATION AND TEMPORAL HISTORY</text><rect x="30" y="65" width="260" height="100" rx="8" class="blue"/><text x="46" y="93" class="strong" text-anchor="start">Bind-space vertex p</text><text x="46" y="118" class="label" text-anchor="start">Position + bone weights</text><text x="46" y="140" class="label" text-anchor="start">UVs / normals / tangents</text><path d="M290 115 L340 115" class="arrow"  marker-end="url(#head)"/><rect x="340" y="65" width="260" height="100" rx="8" class="green"/><text x="356" y="93" class="strong" text-anchor="start">Deform in local space</text><text x="356" y="118" class="label" text-anchor="start">Skin / morph / cloth</text><text x="356" y="140" class="label" text-anchor="start">May change local bounds</text><path d="M600 115 L650 115" class="arrow"  marker-end="url(#head)"/><rect x="650" y="65" width="260" height="100" rx="8" class="amber"/><text x="666" y="93" class="strong" text-anchor="start">Place in world</text><text x="666" y="118" class="label" text-anchor="start">Component / instance matrix</text><text x="666" y="140" class="label" text-anchor="start">Then camera projection</text><rect x="30" y="218" width="410" height="118" rx="8" class="blue"/><text x="46" y="246" class="strong" text-anchor="start">Current rendered state</text><text x="46" y="271" class="label" text-anchor="start">current pose + current transform</text><text x="46" y="293" class="label" text-anchor="start">current camera view / projection</text><text x="46" y="315" class="label" text-anchor="start">→ current clip / screen position</text><rect x="500" y="218" width="410" height="118" rx="8" class="green"/><text x="516" y="246" class="strong" text-anchor="start">Previous rendered state</text><text x="516" y="271" class="label" text-anchor="start">previous pose + previous transform</text><text x="516" y="293" class="label" text-anchor="start">previous camera view / projection</text><text x="516" y="315" class="label" text-anchor="start">→ previous clip / screen position</text><text x="470" y="277" class="strong" text-anchor="middle">−</text><text x="30" y="369" class="strong" text-anchor="start">Velocity needs both states. A transform alone cannot describe a moving elbow.</text><text x="30" y="402" class="small" text-anchor="start">Bounds, shadow geometry and ray geometry must describe the deformation they consume.</text></svg>