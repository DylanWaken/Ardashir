<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 517" role="img" aria-labelledby="title desc">
<title id="title">Visibility, material evaluation and illumination are distinct</title><desc id="desc">Classic and Nanite paths create surface data differently but feed the deferred renderer. Lighting then combines that surface data with light visibility and indirect illumination.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="517" fill="#f8fafc" rx="12"/><text x="30" y="32" class="kicker" text-anchor="start">DEFERRED SHADING · SEPARATE THREE QUESTIONS</text><rect x="30" y="64" width="263" height="101" rx="8" class="blue"/><text x="46" y="92" class="strong" text-anchor="start">1 · Which surface wins?</text><text x="46" y="117" class="label" text-anchor="start">Raster depth / visibility</text><text x="46" y="139" class="label" text-anchor="start">Triangle or fragment identity</text><path d="M293 112 L338 112" class="arrow"  marker-end="url(#head)"/><rect x="338" y="64" width="263" height="101" rx="8" class="green"/><text x="354" y="92" class="strong" text-anchor="start">2 · What is the surface?</text><text x="354" y="117" class="label" text-anchor="start">Material evaluation</text><text x="354" y="139" class="label" text-anchor="start">Normal, albedo, roughness…</text><path d="M601 112 L647 112" class="arrow"  marker-end="url(#head)"/><rect x="647" y="64" width="263" height="101" rx="8" class="amber"/><text x="663" y="92" class="strong" text-anchor="start">3 · How much light?</text><text x="663" y="117" class="label" text-anchor="start">Shading model + lights</text><text x="663" y="139" class="label" text-anchor="start">Visibility + indirect radiance</text><rect x="30" y="216" width="263" height="95" rx="8" class="blue"/><text x="46" y="244" class="strong" text-anchor="start">Classic raster</text><text x="46" y="269" class="label" text-anchor="start">Base pass evaluates material</text><text x="46" y="291" class="label" text-anchor="start">as accepted fragments run.</text><rect x="338" y="216" width="263" height="95" rx="8" class="green"/><text x="354" y="244" class="strong" text-anchor="start">Nanite raster</text><text x="354" y="269" class="label" text-anchor="start">Visibility IDs first; then</text><text x="354" y="291" class="label" text-anchor="start">material evaluation / bins.</text><path d="M162 312 L230 354" class="arrow"  marker-end="url(#head)"/><path d="M469 312 L469 354" class="arrow"  marker-end="url(#head)"/><rect x="188" y="354" width="570" height="94" rx="8" class="plain"/><text x="204" y="382" class="strong" text-anchor="start">Deferred surface buffers → lighting → scene color</text><text x="204" y="407" class="label" text-anchor="start">GBuffer / configured Substrate encoding is surface data.</text><text x="204" y="429" class="label" text-anchor="start">Lumen supplies indirect illumination; it is not a material compiler.</text><text x="30" y="486" class="small" text-anchor="start">Transparency, hair and volumes require additional paths; this is the opaque baseline.</text></svg>