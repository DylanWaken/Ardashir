<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 545" role="img" aria-labelledby="title desc">
<title id="title">Proposed Arda scene module boundaries</title><desc id="desc">Applications emit changes and render features read scene snapshots. Scene core coordinates IDs and versions, providers create specialized representations, and existing backend and dependency graph manage GPU storage and work.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="545" fill="#f8fafc" rx="12"/><text x="30" y="32" class="kicker" text-anchor="start">PROPOSED ARDA DESIGN · DEPENDENCIES POINT DOWN</text><rect x="30" y="64" width="415" height="100" rx="8" class="blue"/><text x="46" y="92" class="strong" text-anchor="start">Application / importer / animation</text><text x="46" y="117" class="label" text-anchor="start">Own gameplay and asset authoring</text><text x="46" y="139" class="label" text-anchor="start">Emit typed scene changes; do not record renderer work</text><rect x="495" y="64" width="415" height="100" rx="8" class="amber"/><text x="511" y="92" class="strong" text-anchor="start">Frame renderer + feature consumers</text><text x="511" y="117" class="label" text-anchor="start">Depth / GBuffer / shadows / optional GI</text><text x="511" y="139" class="label" text-anchor="start">Read a stable scene snapshot; declare graph work</text><path d="M236 164 L236 218" class="arrow"  marker-end="url(#head)"/><path d="M702 164 L702 218" class="arrow"  marker-end="url(#head)"/><rect x="30" y="218" width="880" height="105" rx="8" class="green"/><text x="46" y="246" class="strong" text-anchor="start">Scene core + representation providers</text><text x="46" y="271" class="label" text-anchor="start">Core: stable handles, asset / instance records, versions, deltas, retirement</text><text x="46" y="293" class="label" text-anchor="start">Providers: geometry uploads, deformation, visibility, optional ray / distance-field / GI outputs</text><path d="M236 323 L236 376" class="arrow"  marker-end="url(#head)"/><path d="M702 323 L702 376" class="arrow"  marker-end="url(#head)"/><rect x="30" y="376" width="415" height="95" rx="8" class="blue"/><text x="46" y="404" class="strong" text-anchor="start">Existing ArdaBackend</text><text x="46" y="429" class="label" text-anchor="start">Persistent GPU storage, commands, device</text><text x="46" y="451" class="label" text-anchor="start">Formats, resource states, completion</text><rect x="495" y="376" width="415" height="95" rx="8" class="blue"/><text x="511" y="404" class="strong" text-anchor="start">Existing ArdaDependencyGraph</text><text x="511" y="429" class="label" text-anchor="start">Pass/resource dependencies and execution</text><text x="511" y="451" class="label" text-anchor="start">Bind retained scene resources into graph work</text><text x="30" y="513" class="small" text-anchor="start">A provider declares capabilities and invalidation rules; the core does not become a GI renderer.</text></svg>