<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 405" role="img" aria-labelledby="title desc">
<title id="title">Material response, incoming illumination and final shading</title><desc id="desc">A material evaluates surface attributes. Lights and indirect illumination supply incoming radiance. A scattering model combines those values to produce outgoing radiance.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="405" fill="#f8fafc" rx="12"/><text x="30" y="32" class="kicker" text-anchor="start">SURFACE RESPONSE IS A FUNCTION, NOT THE FINAL PIXEL COLOR</text><rect x="30" y="63" width="270" height="110" rx="8" class="blue"/><text x="46" y="91" class="strong" text-anchor="start">Material evaluation</text><text x="46" y="116" class="label" text-anchor="start">Textures + parameters + UVs</text><text x="46" y="138" class="label" text-anchor="start">→ normal, roughness, color…</text><text x="46" y="160" class="label" text-anchor="start">Defines a surface response</text><rect x="335" y="63" width="270" height="110" rx="8" class="green"/><text x="351" y="91" class="strong" text-anchor="start">Incident illumination</text><text x="351" y="116" class="label" text-anchor="start">Light direction + intensity</text><text x="351" y="138" class="label" text-anchor="start">Shadow / visibility</text><text x="351" y="160" class="label" text-anchor="start">Indirect incoming radiance</text><path d="M165 173 V196 H775 V175" class="arrow" marker-end="url(#head)"/><path d="M605 116 L640 116" class="arrow"  marker-end="url(#head)"/><rect x="640" y="63" width="270" height="110" rx="8" class="amber"/><text x="656" y="91" class="strong" text-anchor="start">Shading</text><text x="656" y="116" class="label" text-anchor="start">Evaluate scattering model</text><text x="656" y="138" class="label" text-anchor="start">for view and light directions</text><text x="656" y="160" class="label" text-anchor="start">→ outgoing radiance</text><rect x="30" y="222" width="880" height="107" rx="8" class="plain"/><text x="46" y="250" class="strong" text-anchor="start">Example: the same rough wooden crate under two lights</text><text x="46" y="275" class="label" text-anchor="start">Its albedo / roughness stay fixed. A blue lamp changes incident light, so the shaded color changes.</text><text x="46" y="297" class="label" text-anchor="start">Changing roughness changes the angular spread of reflected light; it does not move the crate.</text><text x="46" y="319" class="label" text-anchor="start">Emissive adds outgoing energy; a separate light can approximate how that bulb illuminates others.</text><text x="30" y="372" class="small" text-anchor="start">The arrows describe the dependency, not the storage format or GPU scheduling order.</text></svg>