<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" role="img" aria-labelledby="title desc">
<title id="title">Attachment, spatial and level-of-detail hierarchies</title><desc id="desc">Three graph structures have distinct meanings. Attachment composes transforms, spatial bounds accelerate visibility, and Nanite selects levels of geometric detail.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="438" fill="#f8fafc" rx="12"/><text x="30" y="34" class="kicker" text-anchor="start">SAME SURFACE · THREE DIFFERENT GRAPHS</text><rect x="30" y="68" width="256" height="104" rx="8" class="blue"/><text x="46" y="96" class="strong" text-anchor="start">Attachment hierarchy</text><text x="46" y="121" class="label" text-anchor="start">Parent → child transforms</text><text x="46" y="143" class="label" text-anchor="start">Child follows by default</text><circle cx="158" cy="220" r="16" class="blue"/><path d="M150 235 L95 282" class="arrow"  marker-end="url(#head)"/><path d="M166 235 L220 282" class="arrow"  marker-end="url(#head)"/><rect x="66" y="283" width="56" height="31" rx="4" class="blue"/><rect x="194" y="283" width="56" height="31" rx="4" class="blue"/><text x="158" y="352" class="strong" text-anchor="middle">Question: where?</text><rect x="342" y="68" width="256" height="104" rx="8" class="green"/><text x="358" y="96" class="strong" text-anchor="start">Spatial hierarchy</text><text x="358" y="121" class="label" text-anchor="start">Bounds contain smaller bounds</text><text x="358" y="143" class="label" text-anchor="start">Reject hidden / distant groups</text><circle cx="470" cy="220" r="16" class="green"/><path d="M462 235 L407 282" class="arrow"  marker-end="url(#head)"/><path d="M478 235 L532 282" class="arrow"  marker-end="url(#head)"/><rect x="378" y="283" width="56" height="31" rx="4" class="green"/><rect x="506" y="283" width="56" height="31" rx="4" class="green"/><text x="470" y="352" class="strong" text-anchor="middle">Question: visible?</text><rect x="654" y="68" width="256" height="104" rx="8" class="amber"/><text x="670" y="96" class="strong" text-anchor="start">Nanite hierarchy</text><text x="670" y="121" class="label" text-anchor="start">Alternative levels of detail</text><text x="670" y="143" class="label" text-anchor="start">Choose a compatible cut</text><circle cx="782" cy="220" r="16" class="amber"/><path d="M774 235 L719 282" class="arrow"  marker-end="url(#head)"/><path d="M790 235 L844 282" class="arrow"  marker-end="url(#head)"/><rect x="690" y="283" width="56" height="31" rx="4" class="amber"/><rect x="818" y="283" width="56" height="31" rx="4" class="amber"/><text x="782" y="386" class="strong" text-anchor="middle">Question: how much detail?</text><path d="M718 314 L782 345" class="arrow"  marker-end="url(#head)"/><path d="M846 314 L782 345" class="arrow"  marker-end="url(#head)"/><rect x="762" y="345" width="40" height="22" rx="4" class="amber"/><text x="30" y="407" class="small" text-anchor="start">These structures are not interchangeable: parenthood, proximity and simplification differ.</text></svg>