<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 529" role="img" aria-labelledby="title desc">
<title id="title">Lumen intersection geometry is distinct from cached lighting</title><desc id="desc">Screen traces fall back to supported distance fields or hardware ray geometry. Surface Cache stores material and lighting information at hits, not a universal intersection representation.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#516576"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#193044}.label{font-size:16px}.strong{font-size:18px;font-weight:700}.small{font-size:14px}.kicker{font-size:14px;letter-spacing:1.5px;fill:#4e6376}.blue{fill:#e6f0fa;stroke:#6394bd}.green{fill:#e1f2e9;stroke:#65a08a}.amber{fill:#fff0d7;stroke:#c79b4e}.plain{fill:#fff;stroke:#a3b4c2}.arrow{fill:none;stroke:#516576;stroke-width:2}.muted{fill:#556c7d}</style>
<rect width="940" height="529" fill="#f8fafc" rx="12"/><text x="30" y="32" class="kicker" text-anchor="start">LUMEN · GEOMETRY ANSWERS WHERE; CACHES ANSWER WHAT LIGHT</text><rect x="30" y="64" width="255" height="102" rx="8" class="blue"/><text x="46" y="92" class="strong" text-anchor="start">Probe / reflection ray</text><text x="46" y="117" class="label" text-anchor="start">Screen trace, when enabled</text><text x="46" y="139" class="label" text-anchor="start">Reuse available screen data</text><path d="M285 115 L335 115" class="arrow"  marker-end="url(#head)"/><rect x="335" y="64" width="575" height="102" rx="8" class="green"/><text x="351" y="92" class="strong" text-anchor="start">A miss / unresolved region needs scene geometry</text><text x="351" y="117" class="label" text-anchor="start">Software: mesh / global distance fields and supported terrain</text><text x="351" y="139" class="label" text-anchor="start">Hardware: acceleration structures for supported geometry</text><path d="M620 167 L620 220" class="arrow"  marker-end="url(#head)"/><rect x="335" y="220" width="575" height="110" rx="8" class="amber"/><text x="351" y="248" class="strong" text-anchor="start">Lighting at the hit</text><text x="351" y="273" class="label" text-anchor="start">Surface Cache: material captures + cached lighting</text><text x="351" y="295" class="label" text-anchor="start">Optional hardware hit lighting: evaluate more at the hit</text><text x="351" y="317" class="label" text-anchor="start">Cards parameterize surfaces; they are not intersection geometry.</text><rect x="30" y="220" width="255" height="110" rx="8" class="plain"/><text x="46" y="248" class="strong" text-anchor="start">Not every surface exists</text><text x="46" y="273" class="label" text-anchor="start">Screen: current view only</text><text x="46" y="295" class="label" text-anchor="start">Fields: geometry limits</text><text x="46" y="317" class="label" text-anchor="start">RT: residency / cost limits</text><path d="M620 330 L620 378" class="arrow"  marker-end="url(#head)"/><rect x="335" y="378" width="575" height="78" rx="8" class="blue"/><text x="351" y="406" class="strong" text-anchor="start">Filter / accumulate / integrate indirect illumination</text><text x="351" y="431" class="label" text-anchor="start">Combine with the main camera’s material and direct lighting.</text><text x="30" y="497" class="strong" text-anchor="start">Missing geometry, missing cache coverage and stale lighting are three different failures.</text></svg>