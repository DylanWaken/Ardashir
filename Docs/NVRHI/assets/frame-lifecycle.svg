<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
  <title id="title">NVRHI frame lifecycle</title>
  <desc id="desc">Acquire a swap-chain image, open and record a command list, close and submit it, present, then run garbage collection.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#38bdf8"/></marker>
    <style>.t{font:600 16px system-ui,sans-serif;fill:#f8fafc;text-anchor:middle}.s{font:13px system-ui,sans-serif;fill:#cbd5e1;text-anchor:middle}.b{rx:12;fill:#172554;stroke:#60a5fa;stroke-width:2}.p{fill:none;stroke:#38bdf8;stroke-width:3;marker-end:url(#a)}</style>
  </defs>
  <rect width="1100" height="310" rx="20" fill="#0f172a"/>
  <text x="550" y="35" class="t" font-size="22">One frame</text>
  <rect class="b" x="30" y="80" width="150" height="100"/><text class="t" x="105" y="115">Acquire</text><text class="s" x="105" y="141">native API</text><text class="s" x="105" y="160">wait semaphore/fence</text>
  <rect class="b" x="215" y="80" width="150" height="100"/><text class="t" x="290" y="115">Open</text><text class="s" x="290" y="141">commandList.open()</text><text class="s" x="290" y="160">start tracking</text>
  <rect class="b" x="400" y="65" width="190" height="130"/><text class="t" x="495" y="103">Record</text><text class="s" x="495" y="130">writes, copies, barriers</text><text class="s" x="495" y="151">set state, draw/dispatch</text><text class="s" x="495" y="172">queries, markers</text>
  <rect class="b" x="625" y="80" width="150" height="100"/><text class="t" x="700" y="115">Close</text><text class="s" x="700" y="141">commandList.close()</text><text class="s" x="700" y="160">final transitions</text>
  <rect class="b" x="810" y="80" width="150" height="100"/><text class="t" x="885" y="115">Submit</text><text class="s" x="885" y="141">executeCommandList</text><text class="s" x="885" y="160">returns instance ID</text>
  <path class="p" d="M180 130H207"/><path class="p" d="M365 130H392"/><path class="p" d="M590 130H617"/><path class="p" d="M775 130H802"/>
  <path class="p" d="M960 130H1020V235H165"/>
  <rect class="b" x="30" y="215" width="135" height="65"/><text class="t" x="98" y="244">Present</text><text class="s" x="98" y="264">native API</text>
  <rect class="b" x="200" y="215" width="235" height="65"/><text class="t" x="318" y="244">Garbage collection</text><text class="s" x="318" y="264">at least once each frame</text>
  <path class="p" d="M200 247H173"/>
  <text class="s" x="650" y="250">NVRHI retains referenced objects until submitted GPU work finishes.</text>
</svg>
