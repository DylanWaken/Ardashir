<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
  <title id="title">NVRHI resource state policies</title>
  <desc id="desc">A resource can use keep-initial-state boundaries, explicit begin/end tracking, or a one-way permanent state.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4 0 8Z" fill="#5eead4"/></marker>
  <style>.h{font:600 17px system-ui,sans-serif;fill:#f8fafc;text-anchor:middle}.t{font:13px system-ui,sans-serif;fill:#cbd5e1;text-anchor:middle}.b{rx:12;stroke-width:2}.p{stroke:#5eead4;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1040" height="450" rx="20" fill="#0f172a"/><text class="h" x="520" y="36" font-size="22">Choose one command-list boundary policy per resource</text>
  <rect class="b" x="30" y="75" width="300" height="300" fill="#172554" stroke="#60a5fa"/>
  <text class="h" x="180" y="108">Keep initial state</text><text class="t" x="180" y="135">descriptor: initialState + keepInitialState</text>
  <rect class="b" x="85" y="165" width="190" height="55" fill="#1e3a8a" stroke="#93c5fd"/><text class="t" x="180" y="198">entry: initial state</text>
  <rect class="b" x="85" y="260" width="190" height="55" fill="#1e3a8a" stroke="#93c5fd"/><text class="t" x="180" y="293">exit: restored state</text><path class="p" d="M180 220V252"/>
  <text class="t" x="180" y="345">simple, may add end transitions</text>
  <rect class="b" x="370" y="75" width="300" height="300" fill="#134e4a" stroke="#2dd4bf"/>
  <text class="h" x="520" y="108">Explicit tracking</text><text class="t" x="520" y="135">beginTracking* after open</text>
  <rect class="b" x="425" y="165" width="190" height="55" fill="#115e59" stroke="#5eead4"/><text class="t" x="520" y="190">known entry state</text><text class="t" x="520" y="208">provided by application</text>
  <rect class="b" x="425" y="260" width="190" height="55" fill="#115e59" stroke="#5eead4"/><text class="t" x="520" y="285">chosen exit state</text><text class="t" x="520" y="303">setTexture/BufferState</text><path class="p" d="M520 220V252"/>
  <text class="t" x="520" y="345">flexible, scheduler owns boundaries</text>
  <rect class="b" x="710" y="75" width="300" height="300" fill="#3b1d55" stroke="#c084fc"/>
  <text class="h" x="860" y="108">Permanent state</text><text class="t" x="860" y="135">setPermanent* during initialization</text>
  <rect class="b" x="765" y="165" width="190" height="55" fill="#581c87" stroke="#d8b4fe"/><text class="t" x="860" y="198">transition once</text>
  <rect class="b" x="765" y="260" width="190" height="55" fill="#581c87" stroke="#d8b4fe"/><text class="t" x="860" y="285">fixed compatible state</text><text class="t" x="860" y="303">across all command lists</text><path class="p" d="M860 220V252"/>
  <text class="t" x="860" y="345">cheapest; state cannot later change</text>
  <text class="t" x="520" y="415">Unknown means untracked, not a usable GPU state. Bindless/native accesses require application knowledge.</text>
</svg>
