<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-labelledby="title desc">
  <title id="title">NVRHI pipeline families</title>
  <desc id="desc">The four pipeline families each combine shaders and layouts, are installed through a state object, then execute a matching draw or dispatch command.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4 0 8Z" fill="#93c5fd"/></marker>
  <style>.h{font:700 18px system-ui,sans-serif;fill:#f8fafc;text-anchor:middle}.t{font:14px system-ui,sans-serif;fill:#dbeafe;text-anchor:middle}.b{rx:12;stroke-width:2}.p{stroke:#93c5fd;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1040" height="460" rx="20" fill="#0f172a"/><text x="520" y="36" class="h" font-size="23">Immutable pipeline to complete command state to execution</text>
  <g>
    <rect class="b" x="30" y="75" width="230" height="105" fill="#1e3a8a" stroke="#60a5fa"/><text class="h" x="145" y="109">Graphics</text><text class="t" x="145" y="137">VS, HS, DS, GS, PS</text><text class="t" x="145" y="160">input + raster + depth + blend</text>
    <rect class="b" x="290" y="75" width="230" height="105" fill="#14532d" stroke="#4ade80"/><text class="h" x="405" y="109">Compute</text><text class="t" x="405" y="137">CS</text><text class="t" x="405" y="160">layouts</text>
    <rect class="b" x="550" y="75" width="230" height="105" fill="#581c87" stroke="#c084fc"/><text class="h" x="665" y="109">Meshlet</text><text class="t" x="665" y="137">AS/task, MS, PS</text><text class="t" x="665" y="160">raster + depth + blend</text>
    <rect class="b" x="810" y="75" width="200" height="105" fill="#7c2d12" stroke="#fb923c"/><text class="h" x="910" y="109">Ray tracing</text><text class="t" x="910" y="137">shader library + groups</text><text class="t" x="910" y="160">global/local layouts</text>
  </g>
  <g>
    <path class="p" d="M145 180V232"/><path class="p" d="M405 180V232"/><path class="p" d="M665 180V232"/><path class="p" d="M910 180V232"/>
    <rect class="b" x="30" y="240" width="230" height="75" fill="#172554" stroke="#60a5fa"/><text class="h" x="145" y="270">GraphicsState</text><text class="t" x="145" y="296">framebuffer + dynamic state</text>
    <rect class="b" x="290" y="240" width="230" height="75" fill="#173c2b" stroke="#4ade80"/><text class="h" x="405" y="270">ComputeState</text><text class="t" x="405" y="296">bindings + indirect buffer</text>
    <rect class="b" x="550" y="240" width="230" height="75" fill="#3b1d55" stroke="#c084fc"/><text class="h" x="665" y="270">MeshletState</text><text class="t" x="665" y="296">framebuffer + dynamic state</text>
    <rect class="b" x="810" y="240" width="200" height="75" fill="#4c2618" stroke="#fb923c"/><text class="h" x="910" y="270">rt::State</text><text class="t" x="910" y="296">shader table + globals</text>
  </g>
  <g>
    <path class="p" d="M145 315V365"/><path class="p" d="M405 315V365"/><path class="p" d="M665 315V365"/><path class="p" d="M910 315V365"/>
    <text class="h" x="145" y="398">draw*</text><text class="h" x="405" y="398">dispatch*</text><text class="h" x="665" y="398">dispatchMesh*</text><text class="h" x="910" y="398">dispatchRays</text>
  </g>
  <text class="t" x="520" y="438">Every pipeline stores binding layouts; every state supplies compatible binding sets in layout order.</text>
</svg>
