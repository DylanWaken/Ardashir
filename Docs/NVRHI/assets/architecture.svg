<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">NVRHI architecture</title>
  <desc id="desc">Application systems use NVRHI's common API, which translates work to Direct3D 11, Direct3D 12, or Vulkan while allowing native interop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .box{rx:14;stroke-width:2}.label{font:600 18px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#b9c8dc;text-anchor:middle}.flow{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="520" rx="22" fill="url(#bg)"/>
  <text x="480" y="38" class="label" font-size="22">Portable engine code, explicit platform ownership</text>
  <rect class="box" x="115" y="65" width="730" height="105" fill="#1f3656" stroke="#60a5fa"/>
  <text x="480" y="101" class="label">Application / Engine</text>
  <text x="480" y="130" class="small">render graph, materials, passes, simulation, inference</text>
  <text x="480" y="153" class="small">owns windows, native device creation, swap chain, acquire and present</text>
  <path class="flow" d="M480 170 V211"/>
  <rect class="box" x="115" y="215" width="730" height="130" fill="#214b45" stroke="#34d399"/>
  <text x="480" y="252" class="label">NVRHI common interface</text>
  <text x="480" y="281" class="small">resources, bindings, pipelines, command lists, barriers, queries</text>
  <text x="480" y="306" class="small">reference counting, deferred destruction, upload/scratch allocation, validation</text>
  <text x="480" y="330" class="small">native object access remains available when the abstraction is insufficient</text>
  <path class="flow" d="M270 345 V388"/><path class="flow" d="M480 345 V388"/><path class="flow" d="M690 345 V388"/>
  <rect class="box" x="145" y="392" width="250" height="90" fill="#3a294d" stroke="#c084fc"/>
  <rect class="box" x="405" y="392" width="150" height="90" fill="#3a294d" stroke="#c084fc"/>
  <rect class="box" x="565" y="392" width="250" height="90" fill="#3a294d" stroke="#c084fc"/>
  <text x="270" y="430" class="label">Direct3D 11</text><text x="270" y="458" class="small">Windows</text>
  <text x="480" y="430" class="label">Direct3D 12</text><text x="480" y="458" class="small">Windows</text>
  <text x="690" y="430" class="label">Vulkan 1.3</text><text x="690" y="458" class="small">Windows and Linux</text>
</svg>
