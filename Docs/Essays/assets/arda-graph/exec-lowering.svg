<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Four identities describe four different boundaries</title><desc id="desc">Semantic node handles map to compiled dispatch IDs, then to commands bound to frame-slot resources, then to accepted native submission tokens. Entry and exit commands establish reusable resource states.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52664d"/></marker></defs>
<rect width="1000" height="560" fill="#fffdf8"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#28352c} .small{font-size:17px}.label{font-size:19px}.title{font-size:26px;font-weight:600}.muted{fill:#637060}</style>
<text x="36" y="44" class="title">Four identities describe four different boundaries</text>
<text x="30" y="131" class="small">Semantic</text>
<rect x="200" y="95" width="220" height="65" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="310.0" y="133.5" class="label" text-anchor="middle">Upload(A)</text>
<path d="M425 128L450 128" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M310 165L310 195" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="95" width="220" height="65" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="570.0" y="133.5" class="label" text-anchor="middle">Transform(A,B)</text>
<path d="M685 128L710 128" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M570 165L570 195" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720" y="95" width="220" height="65" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="830.0" y="133.5" class="label" text-anchor="middle">Readback(B)</text>
<path d="M830 165L830 195" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="241" class="small">Dispatches</text>
<rect x="200" y="205" width="220" height="65" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="310.0" y="243.5" class="label" text-anchor="middle">D0</text>
<path d="M425 238L450 238" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M310 275L310 305" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="205" width="220" height="65" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="570.0" y="243.5" class="label" text-anchor="middle">D1</text>
<path d="M685 238L710 238" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M570 275L570 305" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720" y="205" width="220" height="65" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="830.0" y="243.5" class="label" text-anchor="middle">D2</text>
<path d="M830 275L830 305" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="351" class="small">Bound commands</text>
<rect x="200" y="315" width="220" height="65" rx="7" fill="#f5e8cf" stroke="#829079" stroke-width="1.5"/>
<text x="310.0" y="353.5" class="label" text-anchor="middle">C0: A#slot0</text>
<path d="M425 348L450 348" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M310 385L310 415" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="315" width="220" height="65" rx="7" fill="#f5e8cf" stroke="#829079" stroke-width="1.5"/>
<text x="570.0" y="353.5" class="label" text-anchor="middle">C1: A#0 → B#0</text>
<path d="M685 348L710 348" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M570 385L570 415" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720" y="315" width="220" height="65" rx="7" fill="#f5e8cf" stroke="#829079" stroke-width="1.5"/>
<text x="830.0" y="353.5" class="label" text-anchor="middle">C2: B#slot0</text>
<path d="M830 385L830 415" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="461" class="small">Native receipts</text>
<rect x="200" y="425" width="220" height="65" rx="7" fill="#ecece6" stroke="#829079" stroke-width="1.5"/>
<text x="310.0" y="463.5" class="label" text-anchor="middle">token U</text>
<path d="M425 458L450 458" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="425" width="220" height="65" rx="7" fill="#ecece6" stroke="#829079" stroke-width="1.5"/>
<text x="570.0" y="463.5" class="label" text-anchor="middle">token C</text>
<path d="M685 458L710 458" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720" y="425" width="220" height="65" rx="7" fill="#ecece6" stroke="#829079" stroke-width="1.5"/>
<text x="830.0" y="463.5" class="label" text-anchor="middle">token R</text>
<text x="36" y="533" class="small muted">Entry/exit commands bracket physical state transitions. The private program consumes an already chosen plan.</text>
</svg>
