<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">A handle names an identity, not an address</title><desc id="desc">A graph handle contains graph identity, slot index and generation. Deleting a node and reusing its slot increments the generation, rejecting the old handle. Another graph also rejects the handle.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52664d"/></marker></defs>
<rect width="1000" height="430" fill="#fffdf8"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#28352c} .small{font-size:17px}.label{font-size:19px}.title{font-size:26px;font-weight:600}.muted{fill:#637060}</style>
<text x="36" y="44" class="title">A handle names an identity, not an address</text>
<rect x="40" y="100" width="300" height="90" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="190.0" y="139.0" class="label" text-anchor="middle">Old handle</text>
<text x="190.0" y="163.0" class="small" text-anchor="middle">graph 7 · slot 3 · generation 12</text>
<rect x="540" y="100" width="400" height="90" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="740.0" y="139.0" class="label" text-anchor="middle">Before removal: Transform</text>
<text x="740.0" y="163.0" class="small" text-anchor="middle">graph 7 · slot 3 · generation 12</text>
<path d="M350 145L530 145" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="412" y="126" class="small">valid</text>
<rect x="540" y="235" width="400" height="90" rx="7" fill="#f5e8cf" stroke="#829079" stroke-width="1.5"/>
<text x="740.0" y="274.0" class="label" text-anchor="middle">After reuse: Debug</text>
<text x="740.0" y="298.0" class="small" text-anchor="middle">graph 7 · slot 3 · generation 13</text>
<path d="M340 160 L425 160 L425 280 L530 280" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="40" y="263" class="label">Same slot, different occupant.</text>
<text x="40" y="298" class="label">Generation mismatch → reject.</text>
<text x="36" y="403" class="small muted">Graph 9 also rejects this handle, even if its slot 3 has generation 12. Lookup checks all three parts.</text>
</svg>
