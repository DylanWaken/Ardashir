<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">One result, several kinds of work</title><desc id="desc">Input values 0, 1, 2, 3 are uploaded, transformed by B equals 2A plus 1, and read back as 1, 3, 5, 7.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52664d"/></marker></defs>
<rect width="1000" height="400" fill="#fffdf8"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#28352c} .small{font-size:17px}.label{font-size:19px}.title{font-size:26px;font-weight:600}.muted{fill:#637060}</style>
<text x="36" y="44" class="title">One result, several kinds of work</text>
<text x="36" y="95" class="label">The application asks for a value</text>
<rect x="40" y="125" width="62" height="56" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="71.0" y="159.0" class="label" text-anchor="middle">0</text>
<rect x="114" y="125" width="62" height="56" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="145.0" y="159.0" class="label" text-anchor="middle">1</text>
<rect x="188" y="125" width="62" height="56" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="219.0" y="159.0" class="label" text-anchor="middle">2</text>
<rect x="262" y="125" width="62" height="56" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="293.0" y="159.0" class="label" text-anchor="middle">3</text>
<path d="M345 153L414 153" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430" y="115" width="190" height="76" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="525.0" y="159.0" class="label" text-anchor="middle">B = 2A + 1</text>
<path d="M635 153L692 153" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="710" y="125" width="56" height="56" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="738.0" y="159.0" class="label" text-anchor="middle">1</text>
<rect x="776" y="125" width="56" height="56" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="804.0" y="159.0" class="label" text-anchor="middle">3</text>
<rect x="842" y="125" width="56" height="56" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="870.0" y="159.0" class="label" text-anchor="middle">5</text>
<rect x="908" y="125" width="56" height="56" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="936.0" y="159.0" class="label" text-anchor="middle">7</text>
<text x="36" y="237" class="label">The machine needs an ordered protocol</text>
<rect x="40" y="263" width="260" height="75" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="170.0" y="294.5" class="label" text-anchor="middle">Upload</text>
<text x="170.0" y="318.5" class="small" text-anchor="middle">CPU → logical A</text>
<path d="M307 300L360 300" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="370" y="263" width="260" height="75" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="500.0" y="294.5" class="label" text-anchor="middle">Transform</text>
<text x="500.0" y="318.5" class="small" text-anchor="middle">read A; write B</text>
<path d="M637 300L690 300" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="700" y="263" width="260" height="75" rx="7" fill="#f5e8cf" stroke="#829079" stroke-width="1.5"/>
<text x="830.0" y="294.5" class="label" text-anchor="middle">Readback</text>
<text x="830.0" y="318.5" class="small" text-anchor="middle">B → CPU result</text>
</svg>
