<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">The caller submits and retires a frame</title><desc id="desc">CPU recording returns a ticket. GPU execution can overlap independent CPU work. Waiting retires the frame before the consumer uses the output.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52664d"/></marker></defs>
<rect width="1000" height="420" fill="#fffdf8"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#28352c} .small{font-size:17px}.label{font-size:19px}.title{font-size:26px;font-weight:600}.muted{fill:#637060}</style>
<text x="36" y="44" class="title">The caller submits and retires a frame</text>
<text x="34" y="140" class="label">Caller</text>
<rect x="160" y="104" width="170" height="55" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="245.0" y="137.5" class="label" text-anchor="middle">Submit producer</text>
<rect x="350" y="104" width="195" height="55" rx="7" fill="#ecece6" stroke="#829079" stroke-width="1.5"/>
<text x="447.5" y="137.5" class="label" text-anchor="middle">Independent work</text>
<rect x="565" y="104" width="130" height="55" rx="7" fill="#f5e8cf" stroke="#829079" stroke-width="1.5"/>
<text x="630.0" y="137.5" class="label" text-anchor="middle">Wait(ticket)</text>
<rect x="740" y="104" width="195" height="55" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="837.5" y="137.5" class="label" text-anchor="middle">Submit consumer</text>
<text x="34" y="249" class="label">GPU</text>
<rect x="325" y="212" width="325" height="55" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="487.5" y="245.5" class="label" text-anchor="middle">Execute producer commands</text>
<path d="M315 162L340 205" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M648 207L662 162" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
