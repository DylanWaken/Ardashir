<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Declaration nodes can disappear while ordering survives</title><desc id="desc">Upload, declaration gate, compute and readback form semantic order. The gate has no dispatch. Dispatch dependencies retain upload before compute before readback; cross-domain edges require fences.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52664d"/></marker></defs>
<rect width="1000" height="500" fill="#fffdf8"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#28352c} .small{font-size:17px}.label{font-size:19px}.title{font-size:26px;font-weight:600}.muted{fill:#637060}</style>
<text x="36" y="44" class="title">Declaration nodes can disappear while ordering survives</text>
<rect x="35" y="95" width="195" height="65" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="132.5" y="133.5" class="label" text-anchor="middle">Upload</text>
<path d="M235 128L270 128" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="95" width="195" height="65" rx="7" fill="#ecece6" stroke="#829079" stroke-width="1.5"/>
<text x="377.5" y="133.5" class="label" text-anchor="middle">Declaration gate</text>
<path d="M480 128L515 128" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="525" y="95" width="195" height="65" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="622.5" y="133.5" class="label" text-anchor="middle">Compute</text>
<path d="M725 128L760 128" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="770" y="95" width="195" height="65" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="867.5" y="133.5" class="label" text-anchor="middle">Readback</text>
<text x="40" y="220" class="small">Illustrative placement: copy queue and graphics queue</text>
<text x="40" y="290" class="small">Copy</text>
<text x="40" y="406" class="small">Graphics</text>
<rect x="180" y="250" width="220" height="65" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="290.0" y="288.5" class="label" text-anchor="middle">D0: Upload</text>
<rect x="730" y="250" width="220" height="65" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="840.0" y="288.5" class="label" text-anchor="middle">D2: Readback</text>
<rect x="455" y="365" width="220" height="65" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="565.0" y="403.5" class="label" text-anchor="middle">D1: Compute</text>
<path d="M410 283L720 283" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="472" y="267" class="small">queue order</text>
<path d="M400 315L455 365" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M675 365L730 315" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="257" y="360" class="small">fence</text>
<text x="768" y="361" class="small">fence</text>
<text x="36" y="473" class="small muted">Logical fence = producer/consumer dispatch IDs. Native timeline values are assigned at submission.</text>
</svg>
