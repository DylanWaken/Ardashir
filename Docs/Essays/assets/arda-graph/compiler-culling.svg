<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Observability traces backward through dependencies</title><desc id="desc">Readback is an observable root. Its ancestors Upload and Transform remain live. An unused Debug branch is marked culled. Writes to external or persistent resources are also roots.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52664d"/></marker></defs>
<rect width="1000" height="460" fill="#fffdf8"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#28352c} .small{font-size:17px}.label{font-size:19px}.title{font-size:26px;font-weight:600}.muted{fill:#637060}</style>
<text x="36" y="44" class="title">Observability traces backward through dependencies</text>
<rect x="40" y="150" width="190" height="70" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="135.0" y="191.0" class="label" text-anchor="middle">Upload A</text>
<rect x="350" y="95" width="220" height="70" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="460.0" y="136.0" class="label" text-anchor="middle">Transform A → B</text>
<rect x="710" y="95" width="240" height="70" rx="7" fill="#f5e8cf" stroke="#829079" stroke-width="1.5"/>
<text x="830.0" y="136.0" class="label" text-anchor="middle">Readback B: root</text>
<rect x="350" y="250" width="220" height="70" rx="7" fill="#ecece6" stroke="#829079" stroke-width="1.5"/>
<text x="460.0" y="291.0" class="label" text-anchor="middle">Debug A → D</text>
<path d="M240 175L340 130" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580 130L700 130" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M240 195L340 285" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="620" y="285" class="small">D has no observable use → culled</text>
<text x="40" y="370" class="small">Other roots: side effects, writes to output / persistent / external resources.</text>
<text x="36" y="433" class="small muted">Validation precedes culling. An unused invalid declaration is not permission to skip correctness checks.</text>
</svg>
