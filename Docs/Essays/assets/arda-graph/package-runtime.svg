<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">Bind the backing storage contract, not only visible elements</title><desc id="desc">Package invocation emits ordered graph commands. A caller buffer can hold two disjoint 64-byte package storage ranges, even if each exposed tensor has only 16 visible bytes. Moving the second origin to byte 32 overlaps the package backing extents and is rejected.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52664d"/></marker></defs>
<rect width="1000" height="610" fill="#fffdf8"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#28352c} .small{font-size:17px}.label{font-size:19px}.title{font-size:26px;font-weight:600}.muted{fill:#637060}</style>
<text x="36" y="44" class="title">Bind the backing storage contract, not only visible elements</text>
<rect x="35" y="95" width="195" height="70" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="132.5" y="136.0" class="label" text-anchor="middle">Input tensors</text>
<path d="M235 130L270 130" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="95" width="195" height="70" rx="7" fill="#f5e8cf" stroke="#829079" stroke-width="1.5"/>
<text x="377.5" y="136.0" class="label" text-anchor="middle">Fill workspace</text>
<path d="M480 130L515 130" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="525" y="95" width="195" height="70" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="622.5" y="136.0" class="label" text-anchor="middle">Kernel dispatch</text>
<path d="M725 130L760 130" fill="none" stroke="#52664d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="770" y="95" width="195" height="70" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="867.5" y="136.0" class="label" text-anchor="middle">Prediction → reader</text>
<text x="40" y="209" class="small">Recipe neighbors receive explicit ordering; constants use initialized persistent storage.</text>
<text x="40" y="272" class="small">Caller allocation: 128 bytes. Exposed Float32[4] tensors each contain 16 bytes.</text>
<rect x="80" y="300" width="420" height="65" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<text x="290.0" y="338.5" class="label" text-anchor="middle">First backing extent [0, 64)</text>
<rect x="500" y="300" width="420" height="65" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="710.0" y="338.5" class="label" text-anchor="middle">Second backing extent [64, 128)</text>
<rect x="80" y="375" width="105" height="22" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<rect x="500" y="375" width="105" height="22" rx="7" fill="#e4edda" stroke="#829079" stroke-width="1.5"/>
<text x="80" y="426" class="small">visible [0, 16)</text>
<text x="500" y="426" class="small">visible [64, 80)</text>
<text x="40" y="474" class="small">Rejected: second origin at byte 32 overlaps the first backing extent.</text>
<rect x="80" y="495" width="420" height="44" rx="7" fill="#e1edf0" stroke="#829079" stroke-width="1.5"/>
<rect x="290" y="547" width="420" height="34" rx="7" fill="#f5dfd8" stroke="#829079" stroke-width="1.5"/>
<text x="290" y="524" class="small" text-anchor="middle">first [0, 64)</text>
<text x="500" y="571" class="small" text-anchor="middle">second [32, 96)</text>
</svg>
