<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">ArdaTrace nested scope hierarchy</title>
  <desc id="desc">Nested C++ scope timers retain parent identifiers and appear as stacked intervals on one thread lane in the viewer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font:700 23px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .label{font:650 16px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#b9c8dc;text-anchor:middle}
      .code{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dbeafe}
      .flow{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .guide{stroke:#475569;stroke-width:1;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1080" height="520" rx="22" fill="url(#bg)"/>
  <text x="540" y="42" class="title">Lexical nesting becomes an explicit per-thread hierarchy</text>

  <rect x="45" y="82" width="370" height="355" rx="16" fill="#15243a" stroke="#60a5fa" stroke-width="2"/>
  <text x="230" y="116" class="label">Instrumented C++ scopes</text>
  <text x="75" y="160" class="code">ARDA_NAMED_SCOPE_TIMER("Rendering");</text>
  <text x="75" y="194" class="code">{</text>
  <text x="95" y="228" class="code">ARDA_NAMED_SCOPE_TIMER("Raytracer");</text>
  <text x="95" y="262" class="code">{</text>
  <text x="115" y="296" class="code">ARDA_NAMED_SCOPE_TIMER("Sampler");</text>
  <text x="115" y="330" class="code">{</text>
  <text x="135" y="364" class="code">ARDA_NAMED_SCOPE_TIMER("Gaussian");</text>
  <text x="115" y="398" class="code">}</text>
  <text x="95" y="420" class="code">}</text>

  <path class="flow" d="M415 260 H490"/>

  <rect x="494" y="82" width="541" height="355" rx="16" fill="#142c2b" stroke="#34d399" stroke-width="2"/>
  <text x="764" y="116" class="label">Render Thread timeline</text>
  <line x1="545" y1="145" x2="995" y2="145" class="guide"/>
  <line x1="545" y1="402" x2="995" y2="402" class="guide"/>
  <text x="545" y="137" class="small" text-anchor="start">earlier</text>
  <text x="995" y="137" class="small" text-anchor="end">later</text>

  <rect x="555" y="165" width="425" height="48" rx="8" fill="#1f4e78" stroke="#60a5fa" stroke-width="2"/>
  <text x="767" y="195" class="label">Rendering - root</text>

  <rect x="595" y="225" width="335" height="48" rx="8" fill="#285d50" stroke="#34d399" stroke-width="2"/>
  <text x="762" y="255" class="label">Raytracer - parent Rendering</text>

  <rect x="635" y="285" width="245" height="48" rx="8" fill="#4b3b65" stroke="#c084fc" stroke-width="2"/>
  <text x="757" y="315" class="label">Sampler - parent Raytracer</text>

  <rect x="680" y="345" width="155" height="48" rx="8" fill="#65462c" stroke="#f59e0b" stroke-width="2"/>
  <text x="757" y="375" class="label">Gaussian</text>

  <text x="540" y="478" class="small">A timer on another thread starts a separate root; parent identifiers never cross thread lanes.</text>
</svg>
