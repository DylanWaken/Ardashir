<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">D3D12 per-queue submission lifetime and retirement</title>
  <desc id="desc">CPU submission creates a retained lifetime snapshot for graphics, compute, or copy work. Each queue signals an independent fence. Garbage collection releases a snapshot only after the fence belonging to that submission reaches its value.</desc>
  <defs>
    <style>
      .bg{fill:#07111f}.panel{fill:#0f2135;stroke:#35516d;stroke-width:2}.cpu{fill:#12314a;stroke:#38bdf8;stroke-width:2}.gpu{fill:#123426;stroke:#4ade80;stroke-width:2}.hold{fill:#3b2b16;stroke:#fbbf24;stroke-width:2}.gc{fill:#2e2045;stroke:#c084fc;stroke-width:2}.title{fill:#f8fafc;font:700 25px system-ui,sans-serif}.sub{fill:#a8bfd3;font:14px system-ui,sans-serif}.label{fill:#edf6ff;font:700 16px system-ui,sans-serif}.text{fill:#c9d9e7;font:13px system-ui,sans-serif}.tiny{fill:#9fb5c8;font:12px ui-monospace,monospace}.arrow{stroke:#7dd3fc;stroke-width:2.5;fill:none;marker-end:url(#a)}.signal{stroke:#86efac;stroke-width:2.5;fill:none;marker-end:url(#g)}.life{stroke:#fbbf24;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#y)}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7dd3fc"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#86efac"/></marker>
    <marker id="y" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker>
  </defs>
  <rect class="bg" width="1100" height="680"/>
  <text class="title" x="38" y="48">CPU scope may end; queue completion owns native retirement</text>
  <text class="sub" x="38" y="76">Submission instances encode queue identity and that queue's fence value. Values from different queues are never compared.</text>

  <rect class="cpu" x="38" y="115" width="250" height="120" rx="14"/>
  <text class="label" x="163" y="148" text-anchor="middle">ExecuteCommandList</text>
  <text class="text" x="58" y="179">validate submitted start states</text>
  <text class="text" x="58" y="202">execute + signal queue fence</text>
  <text class="tiny" x="58" y="222">return Encode(queue, value)</text>

  <rect class="hold" x="375" y="105" width="310" height="150" rx="14"/>
  <text class="label" x="530" y="138" text-anchor="middle">Pending submission snapshot</text>
  <text class="text" x="397" y="168">allocator + native command list</text>
  <text class="text" x="397" y="191">upload/readback helpers + signatures</text>
  <text class="text" x="397" y="214">descriptor owners + resource references</text>
  <text class="tiny" x="397" y="238">queue = Q, fence value = N</text>

  <path class="arrow" d="M288 175H375"/>
  <text class="tiny" x="307" y="161">capture</text>

  <rect class="panel" x="735" y="104" width="325" height="360" rx="16"/>
  <text class="label" x="897" y="137" text-anchor="middle">Independent native queues</text>

  <rect class="gpu" x="765" y="163" width="265" height="72" rx="12"/>
  <text class="label" x="786" y="191">Graphics queue</text>
  <text class="tiny" x="786" y="215">graphicsFence: ... 41, 42, 43</text>
  <rect class="gpu" x="765" y="263" width="265" height="72" rx="12"/>
  <text class="label" x="786" y="291">Compute queue</text>
  <text class="tiny" x="786" y="315">computeFence: ... 18, 19, 20</text>
  <rect class="gpu" x="765" y="363" width="265" height="72" rx="12"/>
  <text class="label" x="786" y="391">Copy queue</text>
  <text class="tiny" x="786" y="415">copyFence: ... 27, 28, 29</text>

  <path class="signal" d="M685 180H735"/>
  <text class="tiny" x="688" y="166">Q,N</text>

  <rect class="gc" x="375" y="330" width="310" height="178" rx="14"/>
  <text class="label" x="530" y="365" text-anchor="middle">RunGarbageCollection</text>
  <text class="text" x="397" y="397">read the snapshot's queue fence</text>
  <text class="tiny" x="397" y="425">completed(Q) &lt; N  =&gt; retain all</text>
  <text class="tiny" x="397" y="450">completed(Q) &gt;= N =&gt; release snapshot</text>
  <text class="text" x="397" y="482">no device-wide idle wait per frame</text>

  <path class="life" d="M530 255V330"/>
  <path class="signal" d="M735 420H685"/>
  <text class="tiny" x="692" y="405">completion</text>

  <rect class="panel" x="38" y="550" width="1022" height="90" rx="14"/>
  <text class="label" x="62" y="584">Regression evidence</text>
  <text class="text" x="62" y="612">256 command lists are released immediately after CPU submission, then a blocking readback must return the last value.</text>
  <text class="text" x="62" y="632">ARDGExample.D3D12.MultiFrameLifetime renders 120 frames and must not lose the device during allocation, execution, or present.</text>
</svg>
