<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">One schema, three representations, one selected kernel</title><desc id="desc">The schema defines host retained resources, graph logical dependencies and CUDA argument slots. Physical resources resolve during execution. A frozen single-kernel plan can be submitted immediately or recorded for later submission.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><rect width="1000" height="460" rx="12" fill="#f8fafc"/><g font-family="system-ui,sans-serif" font-size="16" fill="#0f172a"><text x="28" y="35" font-size="22" font-weight="700">One schema, three representations, one selected kernel</text><rect x="28" y="70" width="270" height="95" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="42" y="95" font-weight="700">Parameter schema</text><text x="42" y="120">Host: values + RHI views</text><text x="42" y="145">CUDA: values + pointer slots</text><rect x="366" y="70" width="270" height="95" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="380" y="95" font-weight="700">RDG representation</text><text x="380" y="120">Logical handles + hazards</text><text x="380" y="145">Allocate at execution</text><rect x="704" y="70" width="270" height="95" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="718" y="95" font-weight="700">Bind + SelectKernel</text><text x="718" y="120">Native variants + payloads</text><text x="718" y="145">Validate and freeze choice</text><rect x="28" y="240" width="270" height="95" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="42" y="265" font-weight="700">Physical resource mapping</text><text x="42" y="290">CUDA pointer / surface</text><text x="42" y="315">Patch retained argument copy</text><rect x="366" y="240" width="270" height="95" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="380" y="265" font-weight="700">One frozen kernel plan</text><text x="380" y="290">Dispatch: submit now</text><text x="380" y="315">Deferred: caller submits</text><rect x="704" y="240" width="270" height="95" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="718" y="265" font-weight="700">Provider-owned execution</text><text x="718" y="290">Correct context + stream</text><text x="718" y="315">Retire on graphics completion</text><rect x="250" y="355" width="490" height="95" rx="8" fill="#ffffff" stroke="#64748b"/><text x="264" y="380" font-weight="700">Two-kernel algorithm = two RDG passes</text><text x="264" y="405">Intermediate resource exposes the dependency</text><text x="264" y="430">No author-overridden dispatch hooks</text></g><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M298 117H363"/><path d="M636 117H701"/><path d="M165 165V236"/><path d="M501 165V199H165V236"/><path d="M840 165V202H500V236"/><path d="M298 287H363"/><path d="M636 287H701"/></g></svg>
