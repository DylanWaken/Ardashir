<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Two CUDA authoring paths with different launch owners</title>
  <desc id="desc">The implemented RHI path takes embedded or offline PTX, or compiles device CUDA source with NVRTC, then records descriptors and lets a provider launch them. The direct CUDA path compiles a host helper and device kernels with a CUDA compiler, then the application calls triple-chevron launches on its own compatible stream. Both require graphics memory and synchronization integration.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
  <rect width="1000" height="470" rx="12" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="16" fill="#0f172a">
    <text x="24" y="34" font-size="21" font-weight="700">Who prepares the code, and who submits the launch?</text>
    <text x="24" y="72" font-weight="700">1. Implemented RHI descriptor path</text>
    <rect x="24" y="88" width="275" height="98" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="40" y="114">Device .cu → NVRTC → PTX</text><text x="40" y="140">or embedded / offline PTX</text><text x="40" y="167">No compiled host launch helper</text>
    <rect x="352" y="88" width="275" height="98" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="368" y="114" font-weight="700">Plain C++ dispatch</text><text x="368" y="140">Entry + grid/block + arguments</text><text x="368" y="167">Commands.DispatchCuda(Work)</text>
    <rect x="680" y="88" width="296" height="98" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="696" y="114" font-weight="700">Provider owns launch</text><text x="696" y="140">cuLaunchKernel or</text><text x="696" y="167">vkCmdCudaLaunchKernelNV</text>
    <g stroke="#334155" fill="none" marker-end="url(#arrow)"><path d="M299 137H347"/><path d="M627 137H675"/></g>
    <text x="24" y="236" font-weight="700">2. Application-owned direct CUDA path (adapter required)</text>
    <rect x="24" y="254" width="275" height="98" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="40" y="280">Host helper + device kernels</text><text x="40" y="306">.cu → CUDA compiler + linker</text><text x="40" y="333">Host object + device code</text>
    <rect x="352" y="254" width="275" height="98" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="368" y="280" font-weight="700">Application calls helper</text><text x="368" y="306">Kernel&lt;&lt;&lt;Grid, Block,</text><text x="368" y="333">    0, Stream&gt;&gt;&gt;(Arguments)</text>
    <rect x="680" y="254" width="296" height="98" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="696" y="280" font-weight="700">Application owns integration</text><text x="696" y="306">CUDA mappings + context/stream</text><text x="696" y="333">Graphics handoffs + completion</text>
    <g stroke="#334155" fill="none" marker-end="url(#arrow)"><path d="M299 303H347"/><path d="M627 303H675"/></g>
    <text x="24" y="398" font-weight="700">Launch syntax does not determine graphics ordering.</text>
    <text x="24" y="428">RHI recording retains dependencies. A direct helper needs an explicit compatible interop path.</text>
  </g>
</svg>
