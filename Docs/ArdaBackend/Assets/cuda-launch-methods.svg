<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">Two launch spellings invoke precompiled native code</title><desc id="desc">nvcc compiles global kernels and native architecture images during the build. Direct CUDA uses chevron syntax; Arda binds typed symbols and calls cudaLaunchKernel. Both require an explicit context, stream and valid resource views. Scheduling is a separate policy.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><rect width="1000" height="460" rx="12" fill="#f8fafc"/><g font-family="system-ui,sans-serif" font-size="16" fill="#0f172a"><text x="28" y="35" font-size="22" font-weight="700">Two launch spellings invoke precompiled native code</text><rect x="28" y="70" width="270" height="95" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="42" y="95" font-weight="700">Build machine: nvcc</text><text x="42" y="120">__global__ kernel definition</text><text x="42" y="145">Native architecture profiles</text><rect x="366" y="70" width="270" height="95" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="380" y="95" font-weight="700">Packaged native code</text><text x="380" y="120">Compiled host entry wrapper</text><text x="380" y="145">No runtime compiler lookup</text><rect x="704" y="70" width="270" height="95" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="718" y="95" font-weight="700">Deployment selection</text><text x="718" y="120">Match native target coverage</text><text x="718" y="145">Unsupported if no candidate</text><rect x="28" y="240" width="430" height="95" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="42" y="265" font-weight="700">Direct CUDA C++ spelling</text><text x="42" y="290">Kernel&lt;&lt;&lt;grid, block, shared, stream&gt;&gt;&gt;(P)</text><text x="42" y="315">Application supplies interop + completion</text><rect x="542" y="240" width="430" height="95" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="556" y="265" font-weight="700">Arda registered spelling</text><text x="556" y="290">Bind typed symbol; cudaLaunchKernel(...)</text><text x="556" y="315">Provider supplies interop + completion</text><rect x="210" y="355" width="580" height="95" rx="8" fill="#ffffff" stroke="#64748b"/><text x="224" y="380" font-weight="700">Both launch one by-value parameter block on a CUDA stream</text><text x="224" y="405">D3D12 CiG / Vulkan CiG / ordinary context is a scheduling choice</text><text x="224" y="430">The spelling alone does not establish a graphics dependency</text></g><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M298 117H363"/><path d="M636 117H701"/><path d="M500 165V205H245V236"/><path d="M500 205H755V236"/></g></svg>
