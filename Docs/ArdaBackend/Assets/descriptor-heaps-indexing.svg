<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Descriptor indexing and direct heap addressing</title>
  <desc id="desc">A portable bindless layout chooses classic descriptor indexing or direct resource and sampler heaps. Mutable versioning retains resources, while the direct path pushes each table base index so shaders can add dynamic indices.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7185a5"/></marker><style>.bg{fill:#0f1726}.b{fill:#19263b;stroke:#566c8c;stroke-width:2}.classic{fill:#1b3941;stroke:#53b6c8;stroke-width:2}.direct{fill:#312847;stroke:#ad8cff;stroke-width:2}.shader{fill:#173a31;stroke:#55c69a;stroke-width:2}.line{fill:none;stroke:#7185a5;stroke-width:3;marker-end:url(#a)}.t{font:600 19px system-ui,sans-serif;fill:#f5f7fb}.s{font:14px system-ui,sans-serif;fill:#cbd5e1}.tiny{font:13px system-ui,sans-serif;fill:#afbdd0}</style></defs>
  <rect class="bg" width="1200" height="540" rx="20"/>
  <rect class="b" x="45" y="175" width="225" height="165" rx="15"/><text class="t" x="157" y="213" text-anchor="middle">Arda descriptor table</text><text class="s" x="70" y="247">unbounded declaration</text><text class="s" x="70" y="273">variable live count</text><text class="s" x="70" y="299">partial mutable writes</text><text class="tiny" x="70" y="326">register space / descriptor set</text>
  <path class="line" d="M270 220 H365"/><path class="line" d="M270 300 H365"/>
  <rect class="classic" x="365" y="70" width="315" height="185" rx="15"/><text class="t" x="522" y="108" text-anchor="middle">Classic indexed descriptors</text><text class="s" x="390" y="142">D3D12 descriptor-table range</text><text class="s" x="390" y="168">Vulkan descriptor set + indexing flags</text><text class="s" x="390" y="194">update-after-bind + variable count</text><text class="tiny" x="390" y="225">typed null entries fill unwritten slots</text>
  <rect class="direct" x="365" y="290" width="315" height="185" rx="15"/><text class="t" x="522" y="328" text-anchor="middle">Direct heap indexing</text><text class="s" x="390" y="362">global resource + sampler heaps</text><text class="s" x="390" y="388">native descriptors encoded in place</text><text class="s" x="390" y="414">table base pushed per layout</text><text class="tiny" x="390" y="445">D3D12 SM 6.6 / Vulkan EXT heap mapping</text>
  <path class="line" d="M680 160 H770"/><path class="line" d="M680 382 H770"/>
  <rect class="b" x="770" y="120" width="190" height="110" rx="14"/><text class="t" x="865" y="158" text-anchor="middle">Version retention</text><text class="s" x="795" y="190">safe in-flight mutation</text><text class="tiny" x="795" y="213">resources live through submit</text>
  <rect class="b" x="770" y="330" width="190" height="110" rx="14"/><text class="t" x="865" y="368" text-anchor="middle">Base index</text><text class="s" x="795" y="400">pushed to native shader</text><text class="tiny" x="795" y="423">survives heap reallocation</text>
  <path class="line" d="M960 175 H1020 V260 H1050"/><path class="line" d="M960 385 H1020 V280 H1050"/>
  <rect class="shader" x="1050" y="205" width="115" height="130" rx="14"/><text class="t" x="1107" y="244" text-anchor="middle">Shader</text><text class="s" x="1070" y="276">base +</text><text class="s" x="1070" y="301">GPU index</text>
</svg>
