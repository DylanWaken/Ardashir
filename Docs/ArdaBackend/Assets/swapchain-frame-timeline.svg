<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="swapchain-title swapchain-desc">
  <title id="swapchain-title">Swap chain frame, resize, and teardown timeline</title>
  <desc id="swapchain-desc">Per-frame sequence for AcquireFrame, command recording, PrepareSubmit, submission, and Present, including Vulkan image-available and render-finished semaphore roles, plus resize and teardown ordering.</desc>
  <defs>
    <marker id="call-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#7dd3fc"/></marker>
    <marker id="data-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#34d399"/></marker>
    <marker id="guard-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#fbbf24"/></marker>
    <style>
      .bg{fill:#0b1220}.panel{fill:#101a2c;stroke:#52647d;stroke-width:1.5}.api{fill:#1f3656;stroke:#60a5fa;stroke-width:1.5}.data{fill:#214b45;stroke:#34d399;stroke-width:1.5}.guard{fill:#493720;stroke:#fbbf24;stroke-width:1.5}.native{fill:#312c3f;stroke:#a78bfa;stroke-width:1.5}
      .title{font:700 25px system-ui,sans-serif;fill:#eef6ff}.sub{font:14px system-ui,sans-serif;fill:#b9c8db}.label{font:600 13px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}.small{font:11.5px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}.note{font:12px system-ui,sans-serif;fill:#c5d2e3}.lane{font:700 11px system-ui,sans-serif;fill:#7dd3fc;letter-spacing:1px}.call{fill:none;stroke:#7dd3fc;stroke-width:2.2;marker-end:url(#call-arrow)}.output{fill:none;stroke:#34d399;stroke-width:2.2;marker-end:url(#data-arrow)}.guardline{fill:none;stroke:#fbbf24;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#guard-arrow)}.lifeline{stroke:#52647d;stroke-width:1.2;stroke-dasharray:4 5}
    </style>
  </defs>
  <rect class="bg" width="900" height="760"/>
  <text class="title" x="32" y="42">Swap chain timeline: frame ownership and presentation order</text>
  <text class="sub" x="32" y="68">The public sequence is platform-neutral; Vulkan adds two distinct semaphore edges.</text>

  <rect class="panel" x="24" y="92" width="852" height="364" rx="12"/>
  <text class="lane" x="48" y="118">ONE FRAME</text>
  <line class="lifeline" x1="70" y1="176" x2="834" y2="176"/>

  <rect class="api" x="42" y="138" width="118" height="76" rx="8"/>
  <text class="label" x="101" y="164">AcquireFrame</text>
  <text class="small" x="101" y="184">(OutFramebuffer)</text>
  <text class="small" x="101" y="202">borrowed back buffer</text>

  <rect class="data" x="184" y="138" width="118" height="76" rx="8"/>
  <text class="label" x="243" y="164">Record</text>
  <text class="small" x="243" y="184">Open / Set / Draw</text>
  <text class="small" x="243" y="202">or Dispatch / Close</text>
  <path class="call" d="M160 176 H180"/>

  <rect class="api" x="326" y="138" width="118" height="76" rx="8"/>
  <text class="label" x="385" y="164">PrepareSubmit</text>
  <text class="small" x="385" y="184">arm presentation</text>
  <text class="small" x="385" y="202">sync before execute</text>
  <path class="call" d="M302 176 H322"/>

  <rect class="native" x="468" y="138" width="118" height="76" rx="8"/>
  <text class="label" x="527" y="164">Submit</text>
  <text class="small" x="527" y="184">ExecuteCommandList(s)</text>
  <text class="small" x="527" y="202">graphics queue work</text>
  <path class="call" d="M444 176 H464"/>

  <rect class="api" x="610" y="138" width="118" height="76" rx="8"/>
  <text class="label" x="669" y="164">Present</text>
  <text class="small" x="669" y="184">display acquired</text>
  <text class="small" x="669" y="202">image index</text>
  <path class="call" d="M586 176 H606"/>

  <rect class="data" x="752" y="138" width="100" height="76" rx="8"/>
  <text class="label" x="802" y="164">Next frame</text>
  <text class="small" x="802" y="184">advance Vulkan</text>
  <text class="small" x="802" y="202">frame index</text>
  <path class="output" d="M728 176 H748"/>

  <rect class="native" x="42" y="250" width="386" height="160" rx="8"/>
  <text class="label" x="235" y="277">Vulkan synchronization</text>
  <text class="small" x="235" y="302">AcquireFrame: vkAcquireNextImageKHR signals imageAvailable[frame]</text>
  <text class="small" x="235" y="326">NVRHI graphics queue waits for imageAvailable before rendering</text>
  <text class="small" x="235" y="350">PrepareSubmit: queue signals renderFinished[frame] after submitted work</text>
  <text class="small" x="235" y="374">Present waits for renderFinished, then advances frameIndex</text>
  <text class="small" x="235" y="397">out-of-date acquire/present recreates the swap chain</text>
  <path class="guardline" d="M101 214 C101 230 116 230 116 246"/>
  <path class="guardline" d="M385 214 C385 230 360 230 360 246"/>

  <rect class="native" x="452" y="250" width="400" height="160" rx="8"/>
  <text class="label" x="652" y="277">D3D12 presentation</text>
  <text class="small" x="652" y="302">AcquireFrame selects GetCurrentBackBufferIndex()</text>
  <text class="small" x="652" y="326">PrepareSubmit is intentionally empty</text>
  <text class="small" x="652" y="350">Present calls IDXGISwapChain3::Present(1, 0)</text>
  <text class="small" x="652" y="374">the same public ordering remains valid on both backends</text>
  <text class="small" x="652" y="397">AcquireFrame returns FArdaRHIFramebufferRef</text>

  <rect class="panel" x="24" y="478" width="852" height="104" rx="10"/>
  <text class="lane" x="48" y="502">RESIZE</text>
  <rect class="api" x="48" y="518" width="150" height="44" rx="7"/><text class="label" x="123" y="545">Resize(w, h)</text>
  <rect class="guard" x="240" y="518" width="150" height="44" rx="7"/><text class="label" x="315" y="545">WaitForIdle</text>
  <rect class="native" x="432" y="518" width="190" height="44" rx="7"/><text class="label" x="527" y="538">release / recreate images</text><text class="small" x="527" y="554">or ResizeBuffers</text>
  <rect class="data" x="664" y="518" width="188" height="44" rx="7"/><text class="label" x="758" y="538">import textures + rebuild</text><text class="small" x="758" y="554">FArdaRHIFramebufferRef objects</text>
  <path class="call" d="M198 540 H236"/><path class="guardline" d="M390 540 H428"/><path class="output" d="M622 540 H660"/>

  <rect class="guard" x="24" y="604" width="852" height="90" rx="10"/>
  <text class="label" x="450" y="628">Teardown ordering and invariants</text>
  <text class="note" x="48" y="651">" swapChain.WaitForIdle() &#8594; destroy renderer-owned GPU state and swap chain &#8594; ShutdownBackend().</text>
  <text class="note" x="48" y="672">" Swap chain destructors also wait idle before releasing images; Vulkan then destroys both semaphore arrays.</text>
  <text class="note" x="48" y="689">" Never destroy the backend first: swap chains and borrowed back-buffer wrappers pin backend/native device lifetime.</text>

  <rect class="panel" x="24" y="712" width="852" height="34" rx="7"/>
  <path class="call" d="M48 729 H94"/><text class="note" x="103" y="733">call</text>
  <path class="output" d="M174 729 H220"/><text class="note" x="229" y="733">frame / recreated data</text>
  <path class="guardline" d="M398 729 H444"/><text class="note" x="453" y="733">synchronization / ordering</text>
</svg>
