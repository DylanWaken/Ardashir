<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Ray-tracing and machine-learning capability admission</title>
  <desc id="desc">A desktop adapter is probed into an immutable ability table. Required ray-tracing infrastructure admits the runtime, while each module independently checks hardware ray tracing, indirect dispatch, bindless descriptors, queues, and optional advanced features.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6f7f9b"/></marker>
    <style>
      .bg{fill:#0f1726}.panel{fill:#18243a;stroke:#526684;stroke-width:2}.gate{fill:#24334d;stroke:#7aa2f7;stroke-width:2}.yes{fill:#183b32;stroke:#54c59a;stroke-width:2}.no{fill:#44252c;stroke:#e46b77;stroke-width:2}.line{fill:none;stroke:#6f7f9b;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#7aa2f7;stroke-width:2;stroke-dasharray:7 7}.t{font:600 20px system-ui,sans-serif;fill:#f4f7fb}.s{font:15px system-ui,sans-serif;fill:#cbd5e1}.tiny{font:13px system-ui,sans-serif;fill:#b6c2d4}.accent{fill:#8db4ff}
    </style>
  </defs>
  <rect class="bg" width="1200" height="520" rx="20"/>
  <rect class="panel" x="40" y="170" width="210" height="150" rx="15"/>
  <text class="t" x="145" y="207" text-anchor="middle">Desktop adapter</text>
  <text class="s" x="65" y="242">D3D12 feature queries</text><text class="s" x="65" y="268">Vulkan extension/features</text><text class="s" x="65" y="294">queue + memory topology</text>
  <path class="line" d="M250 245 H330"/>
  <rect class="panel" x="330" y="105" width="280" height="280" rx="15"/>
  <text class="t" x="470" y="143" text-anchor="middle">Immutable ability table</text>
  <text class="s" x="355" y="181">RT tier / hardware RT cores</text><text class="s" x="355" y="208">AS build, update, compaction</text><text class="s" x="355" y="235">SBT, local args, indirect rays</text><text class="s" x="355" y="262">descriptor indexing / heaps</text><text class="s" x="355" y="289">compute + transfer queues</text><text class="s" x="355" y="316">sparse, OMM, feedback</text><text class="s" x="355" y="343">work graphs / bundles / present</text>
  <path class="line" d="M610 190 H690"/>
  <rect class="gate" x="690" y="120" width="250" height="140" rx="15"/>
  <text class="t" x="815" y="158" text-anchor="middle">Runtime profile gate</text>
  <text class="s" x="715" y="193">Required infrastructure present?</text><text class="tiny" x="715" y="222">The profile names exact missing abilities.</text>
  <path class="line" d="M815 260 V330"/>
  <rect class="yes" x="670" y="350" width="285" height="120" rx="15"/>
  <text class="t" x="812" y="387" text-anchor="middle">Admitted runtime</text>
  <text class="s" x="695" y="418">Each renderer/ML module checks</text><text class="s" x="695" y="444">its own requirement profile.</text>
  <path class="line" d="M940 190 H1010"/>
  <rect class="no" x="1010" y="130" width="155" height="120" rx="15"/>
  <text class="t" x="1087" y="169" text-anchor="middle">Rejected</text>
  <text class="s" x="1032" y="200">Unsupported</text><text class="s" x="1032" y="225">+ diagnostics</text>
  <path class="dash" d="M470 385 V455 H670"/>
  <text class="tiny accent" x="357" y="482">Software RT can use a profile that does not require hardware RT cores.</text>
</svg>
