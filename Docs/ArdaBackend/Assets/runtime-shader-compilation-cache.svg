<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Runtime shader compilation and persistent artifact cache</title>
  <desc id="desc">Registered shader permutations branch by LoadOnly, Startup, or OnDemand mode. Startup ensures all selected artifacts before device creation. OnDemand ensures one artifact at first lookup. A matching sidecar key is a cache hit; otherwise optional external DXC compilation atomically publishes bytecode and key before RHI shader creation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#425466"/></marker>
    <style>
      .box{fill:#f5f8fb;stroke:#425466;stroke-width:2}.decision{fill:#fff8df;stroke:#8a6516;stroke-width:2}
      .disk{fill:#e9f7ef;stroke:#287a4b;stroke-width:2}.fail{fill:#fff0f0;stroke:#a33;stroke-width:2}
      .line{fill:none;stroke:#425466;stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:7 5}
      text{font:16px system-ui,sans-serif;fill:#17212b}.label{font-size:14px;font-weight:700}.small{font-size:13px}
    </style>
  </defs>
  <rect class="box" x="30" y="45" width="220" height="78" rx="10"/>
  <text x="140" y="75" text-anchor="middle">Committed shader types</text>
  <text x="140" y="100" text-anchor="middle" class="small">selected backend permutations</text>
  <path class="line" d="M250 84H330"/>
  <polygon class="decision" points="430,30 530,84 430,138 330,84"/>
  <text x="430" y="79" text-anchor="middle">Compilation</text>
  <text x="430" y="101" text-anchor="middle">mode?</text>

  <path class="line" d="M430 138V205H160V245"/>
  <text x="290" y="193" text-anchor="middle" class="label">LoadOnly</text>
  <rect class="disk" x="45" y="245" width="230" height="76" rx="10"/>
  <text x="160" y="275" text-anchor="middle">Load deployed bytecode</text>
  <text x="160" y="300" text-anchor="middle" class="small">DXC is never launched</text>

  <path class="line" d="M530 84H635V180"/>
  <text x="580" y="72" text-anchor="middle" class="label">Startup</text>
  <rect class="box" x="535" y="180" width="200" height="76" rx="10"/>
  <text x="635" y="210" text-anchor="middle">Ensure every selected</text>
  <text x="635" y="235" text-anchor="middle">artifact before device</text>

  <path class="line" d="M430 30V15H850V180"/>
  <text x="650" y="30" text-anchor="middle" class="label">OnDemand</text>
  <rect class="box" x="750" y="180" width="200" height="76" rx="10"/>
  <text x="850" y="210" text-anchor="middle">First Find / Enumerate</text>
  <text x="850" y="235" text-anchor="middle">ensures one slot</text>

  <path class="line" d="M635 256V300H570V344"/>
  <path class="line" d="M850 256V300H670V344"/>
  <polygon class="decision" points="620,344 735,405 620,466 505,405"/>
  <text x="620" y="392" text-anchor="middle">Non-empty artifact +</text>
  <text x="620" y="415" text-anchor="middle">matching .arda-key?</text>
  <text x="620" y="438" text-anchor="middle" class="small">legacy bytes may be accepted</text>

  <path class="line" d="M735 405H810"/>
  <text x="772" y="392" text-anchor="middle" class="label">yes</text>
  <rect class="disk" x="810" y="365" width="260" height="80" rx="10"/>
  <text x="940" y="395" text-anchor="middle">Persistent cache hit</text>
  <text x="940" y="420" text-anchor="middle" class="small">reuse .dxil/.spv across runs</text>
  <path class="line" d="M940 445V485"/>

  <path class="line optional" d="M620 466V505H420"/>
  <text x="570" y="493" text-anchor="middle" class="label">no, if policy allows</text>
  <rect class="box" x="175" y="465" width="245" height="95" rx="10"/>
  <text x="297" y="495" text-anchor="middle">Launch external DXC</text>
  <text x="297" y="520" text-anchor="middle" class="small">temporary output + key</text>
  <text x="297" y="542" text-anchor="middle" class="small">atomic replace with rollback</text>
  <path class="line" d="M420 530H810"/>

  <path class="line" d="M160 321V575H940V445"/>
  <rect class="box" x="810" y="485" width="260" height="80" rx="10"/>
  <text x="940" y="515" text-anchor="middle">Load bytes and create RHI</text>
  <text x="940" y="540" text-anchor="middle" class="small">shader + binding layouts</text>
</svg>
