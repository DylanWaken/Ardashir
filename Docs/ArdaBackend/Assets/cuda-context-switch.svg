<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Context-switching CUDA submission</title>
  <desc id="desc">Recording stores graphics A, CUDA, and graphics B. Submission completes graphics A, executes and completes the ordinary CUDA stream, then submits graphics B with the normal RHI completion fence. Graphics and CUDA do not overlap.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526b88"/></marker></defs>
  <rect width="960" height="280" rx="12" fill="#f4f7fc"/>
  <g font-family="system-ui,sans-serif" fill="#182b45">
    <text x="24" y="35" font-size="21" font-weight="700">One recording, separate execution</text>
    <text x="24" y="76" font-size="16">Graphics queue</text>
    <rect x="210" y="52" width="190" height="50" rx="6" fill="#d9e9ff" stroke="#3976bd"/>
    <text x="235" y="83" font-size="16">Graphics segment A</text>
    <rect x="690" y="52" width="230" height="50" rx="6" fill="#d9e9ff" stroke="#3976bd"/>
    <text x="717" y="83" font-size="16">Graphics segment B</text>
    <text x="24" y="153" font-size="16">Ordinary CUDA stream</text>
    <rect x="450" y="126" width="190" height="50" rx="6" fill="#e4f2d6" stroke="#658642"/>
    <text x="480" y="157" font-size="16">CUDA kernel batch</text>
    <path d="M400 77H425V151H448M640 151H666V77H688" fill="none" stroke="#526b88" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="300" y="215" font-size="14">Graphics completion wait</text>
    <text x="562" y="215" font-size="14">CUDA stream completion wait</text>
    <path d="M425 186V197M666 186V197" stroke="#526b88"/>
    <text x="24" y="255" font-size="15">Recording retains resources and arguments. Submission waits at each boundary; the final graphics fence retires the recording.</text>
  </g>
</svg>
