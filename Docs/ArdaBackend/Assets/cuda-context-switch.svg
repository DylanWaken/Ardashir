<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">GPU handoffs preserve order without per-kernel CPU waits</title><desc id="desc">Graphics submits a producer and signals Ready. CUDA waits Ready, launches native code and signals Done. Graphics waits Done before its consumer and signals final completion. D3D12 uses fence values 1 and 2; Vulkan uses a binary semaphore pair. The CPU submits work; only completion or failure cleanup needs a CPU wait.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><rect width="1000" height="460" rx="12" fill="#f8fafc"/><g font-family="system-ui,sans-serif" font-size="16" fill="#0f172a"><text x="28" y="35" font-size="22" font-weight="700">GPU handoffs preserve order without per-kernel CPU waits</text><rect x="28" y="70" width="270" height="95" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="42" y="95" font-weight="700">Graphics queue</text><text x="42" y="120">Producer writes shared data</text><text x="42" y="145">Signal Ready</text><rect x="366" y="170" width="270" height="95" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="380" y="195" font-weight="700">CUDA stream</text><text x="380" y="220">Wait Ready -&gt; one kernel</text><text x="380" y="245">Signal Done</text><rect x="704" y="270" width="270" height="95" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="718" y="295" font-weight="700">Graphics queue</text><text x="718" y="320">Wait Done -&gt; consumer</text><text x="718" y="345">Signal final completion</text><rect x="28" y="355" width="600" height="95" rx="8" fill="#ffffff" stroke="#64748b"/><text x="42" y="380" font-weight="700">Keep allocations, imports, streams and semaphores alive</text><text x="42" y="405">D3D12: shared fence values 1 (Ready), 2 (Done)</text><text x="42" y="430">Vulkan: binary Ready/Done + queue-family ownership barriers</text></g><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M298 117H330V217H363"/><path d="M636 217H670V317H701"/></g></svg>
