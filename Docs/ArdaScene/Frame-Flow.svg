<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">ArdaScene update and immutable snapshot publication</title>
  <desc id="desc">A representation-only sequence from scene producer transaction through validation, publication, concurrent reading, and snapshot retirement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa1b3"/>
    </marker>
    <style>
      .background { fill: #11151a; }
      .lane { fill: #171d24; stroke: #3c4856; stroke-width: 2; }
      .step { fill: #182533; stroke: #65a7d8; stroke-width: 2; }
      .reader { fill: #1c2923; stroke: #70b58a; stroke-width: 2; }
      .old { fill: #231d2a; stroke: #aa82c4; stroke-width: 2; }
      .title { fill: #f1f5f9; font: 700 30px "Segoe UI", sans-serif; }
      .heading { fill: #f1f5f9; font: 700 18px "Segoe UI", sans-serif; }
      .text { fill: #d4dbe3; font: 14px "Segoe UI", sans-serif; }
      .small { fill: #9eabb8; font: 12px "Segoe UI", sans-serif; }
      .arrow { stroke: #8fa1b3; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .return { stroke: #aa82c4; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="background" width="1500" height="900"/>
  <text class="title" x="55" y="52">ArdaScene transaction and snapshot flow</text>
  <text class="small" x="55" y="78">No backend, graph, acceleration structure, or rendering work occurs in this flow.</text>

  <rect class="lane" x="45" y="115" width="1410" height="250" rx="10"/>
  <text class="heading" x="70" y="150">Single producer transaction</text>

  <rect class="step" x="80" y="195" width="240" height="115" rx="8"/>
  <text class="heading" x="105" y="228">1. Begin update</text>
  <text class="text" x="105" y="255">Capture base scene epoch</text>
  <text class="small" x="105" y="282">One active writer</text>

  <rect class="step" x="370" y="195" width="240" height="115" rx="8"/>
  <text class="heading" x="395" y="228">2. Record commands</text>
  <text class="text" x="395" y="255">Add, patch, and remove</text>
  <text class="small" x="395" y="282">Typed handles and source IDs</text>

  <rect class="step" x="660" y="195" width="240" height="115" rx="8"/>
  <text class="heading" x="685" y="228">3. Validate result</text>
  <text class="text" x="685" y="255">References, ranges, layouts</text>
  <text class="small" x="685" y="282">Failure publishes nothing</text>

  <rect class="step" x="950" y="195" width="240" height="115" rx="8"/>
  <text class="heading" x="975" y="228">4. Build snapshot N</text>
  <text class="text" x="975" y="255">Dense immutable arrays</text>
  <text class="small" x="975" y="282">Handle lookup and change set</text>

  <rect class="step" x="1240" y="195" width="170" height="115" rx="8"/>
  <text class="heading" x="1265" y="228">5. Publish</text>
  <text class="text" x="1265" y="255">Advance epoch</text>
  <text class="small" x="1265" y="282">Atomic pointer swap</text>

  <path class="arrow" d="M 320 252 L 370 252"/>
  <path class="arrow" d="M 610 252 L 660 252"/>
  <path class="arrow" d="M 900 252 L 950 252"/>
  <path class="arrow" d="M 1190 252 L 1240 252"/>

  <rect class="lane" x="45" y="410" width="1410" height="345" rx="10"/>
  <text class="heading" x="70" y="445">Concurrent immutable readers</text>

  <rect class="reader" x="100" y="505" width="350" height="155" rx="8"/>
  <text class="heading" x="125" y="540">Reader A retains snapshot N</text>
  <text class="text" x="125" y="568">Dense geometry and instance traversal</text>
  <text class="text" x="125" y="594">Typed handle lookup</text>
  <text class="small" x="125" y="625">No locks during ordinary reads</text>

  <rect class="reader" x="575" y="505" width="350" height="155" rx="8"/>
  <text class="heading" x="600" y="540">Reader B retains snapshot N</text>
  <text class="text" x="600" y="568">Materials, lights, environments, views</text>
  <text class="text" x="600" y="594">Epoch and change-set inspection</text>
  <text class="small" x="600" y="625">No mutable record access</text>

  <rect class="old" x="1050" y="505" width="350" height="155" rx="8"/>
  <text class="heading" x="1075" y="540">Snapshot N-1 retirement</text>
  <text class="text" x="1075" y="568">Old records remain valid while retained</text>
  <text class="text" x="1075" y="594">Owned blobs release with final reference</text>
  <text class="small" x="1075" y="625">No GPU completion dependency in core</text>

  <path class="arrow" d="M 1325 310 L 1325 380 L 275 380 L 275 505"/>
  <path class="arrow" d="M 1325 380 L 750 380 L 750 505"/>
  <path class="return" d="M 450 675 C 520 730, 980 730, 1050 650"/>

  <rect class="step" x="530" y="790" width="440" height="70" rx="8"/>
  <text class="heading" x="555" y="822">Producer may start transaction N+1</text>
  <text class="small" x="555" y="846">Published snapshot N remains immutable and independently retained</text>

  <path class="arrow" d="M 750 660 L 750 790"/>
</svg>
