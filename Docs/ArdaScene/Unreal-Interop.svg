<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Future Unreal scene extraction representation boundary</title>
  <desc id="desc">A future Unreal adapter maps Unreal identities, resources, and semantic objects into engine-neutral ArdaScene update records without implementing GPU interop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa1b3"/>
    </marker>
    <style>
      .background { fill: #11151a; }
      .ue { fill: #24221a; stroke: #c5a65a; stroke-width: 2; }
      .adapter { fill: #231d2a; stroke: #aa82c4; stroke-width: 2; stroke-dasharray: 8 6; }
      .core { fill: #182533; stroke: #65a7d8; stroke-width: 2; }
      .excluded { fill: #171d24; stroke: #596675; stroke-width: 2; stroke-dasharray: 5 6; }
      .title { fill: #f1f5f9; font: 700 30px "Segoe UI", sans-serif; }
      .heading { fill: #f1f5f9; font: 700 18px "Segoe UI", sans-serif; }
      .text { fill: #d4dbe3; font: 14px "Segoe UI", sans-serif; }
      .small { fill: #9eabb8; font: 12px "Segoe UI", sans-serif; }
      .arrow { stroke: #8fa1b3; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .boundary { stroke: #e06c75; stroke-width: 2; fill: none; stroke-dasharray: 9 6; }
    </style>
  </defs>

  <rect class="background" width="1500" height="900"/>
  <text class="title" x="55" y="52">Future Unreal producer boundary: representation only</text>
  <text class="small" x="55" y="78">The current ArdaScene milestone defines the right-hand contracts; the Unreal adapter itself is deferred.</text>

  <rect class="ue" x="45" y="120" width="390" height="650" rx="10"/>
  <text class="heading" x="70" y="157">Future Unreal source domain</text>

  <rect class="ue" x="85" y="200" width="310" height="100" rx="8"/>
  <text class="heading" x="110" y="233">Stable source identities</text>
  <text class="text" x="110" y="260">Components, proxies, resources</text>
  <text class="small" x="110" y="282">Never stored as pointers in ArdaScene</text>

  <rect class="ue" x="85" y="340" width="310" height="120" rx="8"/>
  <text class="heading" x="110" y="373">Scene semantics</text>
  <text class="text" x="110" y="400">Geometry, instances, materials</text>
  <text class="text" x="110" y="425">Lights, environments, views</text>
  <text class="small" x="110" y="447">Mapped to project-owned records</text>

  <rect class="ue" x="85" y="500" width="310" height="130" rx="8"/>
  <text class="heading" x="110" y="533">Source data descriptions</text>
  <text class="text" x="110" y="560">External resource identity</text>
  <text class="text" x="110" y="585">Byte ranges, strides, field offsets</text>
  <text class="small" x="110" y="610">No wrapping or synchronization yet</text>

  <rect class="adapter" x="505" y="120" width="420" height="650" rx="10"/>
  <text class="heading" x="530" y="157">Future FArdaUnrealSceneExtractor</text>

  <rect class="adapter" x="545" y="200" width="340" height="100" rx="8"/>
  <text class="heading" x="570" y="233">Identity mapping</text>
  <text class="text" x="570" y="260">UE object key to FArdaSourceObjectId</text>
  <text class="small" x="570" y="282">Preserves handles across updates</text>

  <rect class="adapter" x="545" y="340" width="340" height="120" rx="8"/>
  <text class="heading" x="570" y="373">Semantic conversion</text>
  <text class="text" x="570" y="400">Create engine-neutral record descriptors</text>
  <text class="text" x="570" y="425">Convert inline math conventions</text>
  <text class="small" x="570" y="447">Preserve opaque extensions when needed</text>

  <rect class="adapter" x="545" y="500" width="340" height="130" rx="8"/>
  <text class="heading" x="570" y="533">Layout declaration</text>
  <text class="text" x="570" y="560">FArdaExternalDataDesc</text>
  <text class="text" x="570" y="585">FArdaStructLayoutDesc</text>
  <text class="small" x="570" y="610">Allocation and content revisions</text>

  <rect class="core" x="995" y="120" width="460" height="650" rx="10"/>
  <text class="heading" x="1020" y="157">ArdaScene current milestone</text>

  <rect class="core" x="1035" y="200" width="380" height="100" rx="8"/>
  <text class="heading" x="1060" y="233">FArdaSceneUpdateBatch</text>
  <text class="text" x="1060" y="260">Typed add, patch, and remove commands</text>
  <text class="small" x="1060" y="282">Same API used by standalone producer</text>

  <rect class="core" x="1035" y="340" width="380" height="120" rx="8"/>
  <text class="heading" x="1060" y="373">Engine-neutral records</text>
  <text class="text" x="1060" y="400">Handles and source IDs</text>
  <text class="text" x="1060" y="425">Data views and semantic layouts</text>
  <text class="small" x="1060" y="447">No Unreal or GPU API types</text>

  <rect class="core" x="1035" y="500" width="380" height="130" rx="8"/>
  <text class="heading" x="1060" y="533">FArdaSceneSnapshot</text>
  <text class="text" x="1060" y="560">Immutable dense semantic arrays</text>
  <text class="text" x="1060" y="585">External identities remain opaque</text>
  <text class="small" x="1060" y="610">No resource copy or realization</text>

  <path class="arrow" d="M 395 250 L 545 250"/>
  <path class="arrow" d="M 885 250 L 1035 250"/>
  <path class="arrow" d="M 395 400 L 545 400"/>
  <path class="arrow" d="M 885 400 L 1035 400"/>
  <path class="arrow" d="M 395 565 L 545 565"/>
  <path class="arrow" d="M 885 565 L 1035 565"/>

  <path class="boundary" d="M 465 105 L 465 790"/>
  <text class="small" x="478" y="810">Unreal type boundary</text>

  <rect class="excluded" x="270" y="825" width="960" height="48" rx="8"/>
  <text class="small" x="300" y="854">Deferred: FRHI wrapping, shared device, fences, RDG imports, acceleration structures, shaders, GI, and rendering</text>
</svg>
