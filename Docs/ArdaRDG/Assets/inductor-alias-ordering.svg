<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="alias-title alias-desc">
  <title id="alias-title">Memory aliasing requires GPU completion dependencies</title>
  <desc id="alias-desc">The linear order is old graphics user O1, old compute user O2, then new user N. Separate schedule positions do not prevent O2 from overlapping N on the GPU. If old resource R and new resource R prime use the same heap bytes, N must wait for all old users, including O1 and O2. This added dependency delays N, reduces possible overlap, and makes reuse safe. These timelines are illustrative.</desc>
  <defs>
    <marker id="alias-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#eef6ff"/></marker>
    <pattern id="alias-conflict" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 L3 -3 M0 12 L12 0 M9 15 L15 9" stroke="#fb7185" stroke-width="2" opacity="0.32"/></pattern>
    <style>
      text { font-family: system-ui, sans-serif; font-size: 24px; fill: #eef6ff; }
      .title { font-size: 33px; font-weight: 700; }
      .heading { font-size: 27px; font-weight: 650; }
      .small { font-size: 22px; }
      .muted { fill: #b7cbe1; }
      .panel { fill: #111f33; stroke: #29425f; stroke-width: 2; }
      .old { fill: #164962; stroke: #7dd3fc; stroke-width: 2; }
      .next { fill: #3b305b; stroke: #c4b5fd; stroke-width: 2; }
      .edge { fill: none; stroke: #eef6ff; stroke-width: 2.5; marker-end: url(#alias-arrow); }
      .grid { fill: none; stroke: #29425f; stroke-width: 1; stroke-dasharray: 4 6; }
    </style>
  </defs>
  <rect width="1200" height="1150" rx="20" fill="#0b1424"/>
  <text class="title" x="40" y="58">Memory reuse needs completion, not just order</text>
  <text class="small muted" x="40" y="100">Different queues can overlap even when their nodes occupy separate schedule positions.</text>
  <rect class="panel" x="40" y="132" width="1120" height="125" rx="14"/>
  <text class="small muted" x="64" y="167">LINEAR ORDER · earlier production of R omitted</text>
  <rect class="old" x="70" y="190" width="300" height="45" rx="7"/>
  <text class="small" x="220" y="220" text-anchor="middle">Position 0: O1 reads R</text>
  <rect class="old" x="410" y="190" width="300" height="45" rx="7"/>
  <text class="small" x="560" y="220" text-anchor="middle">Position 1: O2 reads R</text>
  <rect class="next" x="750" y="190" width="360" height="45" rx="7"/>
  <text class="small" x="930" y="220" text-anchor="middle">Position 2: N writes R′</text>

  <rect class="panel" x="40" y="284" width="1120" height="270" rx="14"/>
  <text class="heading" x="64" y="329">Unsafe: N has no wait for O2</text>
  <text class="small" x="1128" y="329" text-anchor="end" style="fill:#fda4af">Shared bytes overlap in use</text>
  <path class="grid" d="M210 346 V485 M390 346 V485 M690 346 V485 M870 346 V485"/>
  <text x="65" y="388">Graphics</text>
  <text x="65" y="463">Compute</text>
  <rect class="old" x="210" y="356" width="180" height="49" rx="5"/>
  <text x="300" y="389" text-anchor="middle">O1</text>
  <rect class="next" x="390" y="356" width="180" height="49" rx="5"/>
  <text x="480" y="389" text-anchor="middle">N</text>
  <rect class="old" x="210" y="431" width="480" height="49" rx="5"/>
  <text x="450" y="464" text-anchor="middle">O2 still reads R</text>
  <rect x="390" y="346" width="180" height="143" fill="url(#alias-conflict)" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text class="small muted" x="902" y="397" text-anchor="middle">R and R′ occupy</text>
  <text class="small muted" x="902" y="433" text-anchor="middle">the same heap range</text>
  <text class="small" x="64" y="530" style="fill:#fda4af">N overwrites the range before every old user has finished.</text>

  <rect class="panel" x="40" y="582" width="1120" height="307" rx="14"/>
  <text class="heading" x="64" y="627">Safe: all old users finish before N starts</text>
  <path class="grid" d="M210 644 V818 M390 644 V818 M690 644 V818 M870 644 V818"/>
  <text x="65" y="686">Graphics</text>
  <text x="65" y="761">Compute</text>
  <rect class="old" x="210" y="654" width="180" height="49" rx="5"/>
  <text x="300" y="687" text-anchor="middle">O1</text>
  <rect x="390" y="654" width="300" height="49" rx="5" fill="#342d23" stroke="#f5cc8a" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="small" x="540" y="687" text-anchor="middle">wait for O2</text>
  <rect class="next" x="690" y="654" width="180" height="49" rx="5"/>
  <text x="780" y="687" text-anchor="middle">N</text>
  <rect class="old" x="210" y="729" width="480" height="49" rx="5"/>
  <text x="450" y="762" text-anchor="middle">O2 reads R</text>
  <path class="edge" d="M690 726 V706"/>
  <text class="small muted" x="983" y="754" text-anchor="middle">Added O2 → N wait</text>
  <text class="small muted" x="210" y="816" text-anchor="middle">0</text>
  <text class="small muted" x="390" y="816" text-anchor="middle">3</text>
  <text class="small muted" x="690" y="816" text-anchor="middle">8</text>
  <text class="small muted" x="870" y="816" text-anchor="middle">11</text>
  <text class="small" x="64" y="850">Shared storage adds ordering and may reduce overlap.</text>
  <text class="small" x="64" y="879">Separate storage can keep these users independent.</text>

  <rect class="old" x="95" y="925" width="190" height="57" rx="9"/>
  <text x="190" y="963" text-anchor="middle">Old user O1</text>
  <rect class="old" x="95" y="1013" width="190" height="57" rx="9"/>
  <text x="190" y="1051" text-anchor="middle">Old user O2</text>
  <path class="edge" d="M288 953 H405 V998 H710"/>
  <path class="edge" d="M288 1041 H405 V998 H710"/>
  <text class="small muted" x="542" y="960" text-anchor="middle">all old users</text>
  <rect class="next" x="715" y="969" width="390" height="59" rx="9"/>
  <text x="910" y="994" text-anchor="middle">N · first new user</text>
  <text class="small" x="910" y="1020" text-anchor="middle">of shared bytes</text>
  <text class="small muted" x="40" y="1120">Illustrative GPU timelines. Safe aliasing also requires the native alias/state barriers.</text>
</svg>
