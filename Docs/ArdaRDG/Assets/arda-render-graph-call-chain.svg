<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Persistent graph call chain</title><desc id="desc">Public APIs describe semantics; a private native program executes the compiled plan.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#7dd3fc"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#0b1424"/>
<g font-family="system-ui,sans-serif"><text x="40" y="57" fill="#eef6ff" font-size="29" font-weight="700">Persistent graph call chain</text>
<text x="40" y="96" fill="#b7cbe1" font-size="16">Public APIs describe semantics; a private native program executes the compiled plan.</text>
<rect x="40" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="60" y="198" fill="#7dd3fc" font-size="14">01</text>
<text x="60" y="239" fill="#eef6ff" font-size="19" font-weight="700">Author</text>
<text x="60" y="280" fill="#c4d3e5" font-size="15">BeginGraphEdit</text>
<text x="60" y="312" fill="#c4d3e5" font-size="15">Create / Import resources</text>
<text x="60" y="344" fill="#c4d3e5" font-size="15">AttachOrFind / dependencies</text>
<path d="M294 274H322" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="350" y="198" fill="#7dd3fc" font-size="14">02</text>
<text x="350" y="239" fill="#eef6ff" font-size="19" font-weight="700">Compile</text>
<text x="350" y="280" fill="#c4d3e5" font-size="15">EndGraphEdit</text>
<text x="350" y="312" fill="#c4d3e5" font-size="15">ArdaInductor resolution</text>
<text x="350" y="344" fill="#c4d3e5" font-size="15">Cache pipelines and storage</text>
<path d="M584 274H612" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="640" y="198" fill="#7dd3fc" font-size="14">03</text>
<text x="640" y="239" fill="#eef6ff" font-size="19" font-weight="700">Execute</text>
<text x="640" y="280" fill="#c4d3e5" font-size="15">Submit frame</text>
<text x="640" y="312" fill="#c4d3e5" font-size="15">Record native program</text>
<text x="640" y="344" fill="#c4d3e5" font-size="15">Queue waits and submission</text>
<path d="M874 274H902" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="910" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="930" y="198" fill="#7dd3fc" font-size="14">04</text>
<text x="930" y="239" fill="#eef6ff" font-size="19" font-weight="700">Observe</text>
<text x="930" y="280" fill="#c4d3e5" font-size="15">Wait / IsComplete</text>
<text x="930" y="312" fill="#c4d3e5" font-size="15">Readbacks and reports</text>
<text x="930" y="344" fill="#c4d3e5" font-size="15">Replay or begin next edit</text>
<rect x="40" y="432" width="1120" height="130" rx="12" fill="#152637"/><text x="62" y="476" fill="#d8e6f4" font-size="16">FArdaDependencyGraph is the application entry point; automatic pipelines resolve by node-local slot.</text><text x="62" y="518" fill="#abc4dc" font-size="16">A stable compile revision across frames means the retained execution program is being reused.</text></g></svg>