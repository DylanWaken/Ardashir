<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">ArdaInductor compilation</title><desc id="desc">A deterministic semantic graph becomes a feasible native program.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#7dd3fc"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#0b1424"/>
<g font-family="system-ui,sans-serif"><text x="40" y="57" fill="#eef6ff" font-size="29" font-weight="700">ArdaInductor compilation</text>
<text x="40" y="96" fill="#b7cbe1" font-size="16">A deterministic semantic graph becomes a feasible native program.</text>
<rect x="40" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="60" y="198" fill="#7dd3fc" font-size="14">01</text>
<text x="60" y="239" fill="#eef6ff" font-size="19" font-weight="700">Resolve semantics</text>
<text x="60" y="280" fill="#c4d3e5" font-size="15">Validate handles/ranges</text>
<text x="60" y="312" fill="#c4d3e5" font-size="15">One producer per value</text>
<text x="60" y="344" fill="#c4d3e5" font-size="15">Reject dependency cycles</text>
<path d="M294 274H322" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="350" y="198" fill="#7dd3fc" font-size="14">02</text>
<text x="350" y="239" fill="#eef6ff" font-size="19" font-weight="700">Cull and infer</text>
<text x="350" y="280" fill="#c4d3e5" font-size="15">Trace observable roots</text>
<text x="350" y="312" fill="#c4d3e5" font-size="15">Resolve shader ancestry</text>
<text x="350" y="344" fill="#c4d3e5" font-size="15">Assign pipeline slots</text>
<path d="M584 274H612" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="640" y="198" fill="#7dd3fc" font-size="14">03</text>
<text x="640" y="239" fill="#eef6ff" font-size="19" font-weight="700">Search plans</text>
<text x="640" y="280" fill="#c4d3e5" font-size="15">Choose legal queues</text>
<text x="640" y="312" fill="#c4d3e5" font-size="15">Group CUDA operations</text>
<text x="640" y="344" fill="#c4d3e5" font-size="15">Evaluate cost and VRAM</text>
<path d="M874 274H902" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="910" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="930" y="198" fill="#7dd3fc" font-size="14">04</text>
<text x="930" y="239" fill="#eef6ff" font-size="19" font-weight="700">Materialize plan</text>
<text x="930" y="280" fill="#c4d3e5" font-size="15">Allocate frame pools</text>
<text x="930" y="312" fill="#c4d3e5" font-size="15">Build barriers and waits</text>
<text x="930" y="344" fill="#c4d3e5" font-size="15">Publish compile revision</text>
<rect x="40" y="432" width="1120" height="130" rx="12" fill="#152637"/><text x="62" y="476" fill="#d8e6f4" font-size="16">Bounded search retains its best feasible incumbent; exhaustive search evaluates every legal order.</text><text x="62" y="518" fill="#abc4dc" font-size="16">The result describes the implemented cost/allocation model, not a guarantee of fastest hardware time.</text></g></svg>