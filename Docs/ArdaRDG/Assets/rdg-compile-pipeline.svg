<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Exact fourteen stages of the current ARDG compile pipeline</title>
  <desc id="desc">Source-ordered stages: validate before compile, validate extracted resources, append and wire graph epilogue, assign pipelines, build consumer edges, cull passes, rebuild live resource intervals, compile resource lifetimes, compile barriers, validate transitions, compile asynchronous metadata, compile queue dependencies, compile raster groups, and publish compiled state.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17233a"/></linearGradient>
    <style>.stage{fill:#101a2c;stroke:#52647d}.check{fill:#493720;stroke:#fbbf24}.graph{fill:#214b45;stroke:#34d399}.meta{fill:#3a294d;stroke:#c084fc}.stage,.check,.graph,.meta{stroke-width:2}.h1{font:700 30px system-ui,sans-serif;fill:#eef6ff}.num{font:700 18px system-ui,sans-serif;fill:#7dd3fc}.name{font:700 16px system-ui,sans-serif;fill:#eef6ff}.s{font:13px system-ui,sans-serif;fill:#aebdd0}.t{font:15px system-ui,sans-serif;fill:#c5d2e3}</style>
  </defs>
  <rect width="1200" height="900" rx="24" fill="url(#bg)"/><text x="48" y="52" class="h1">Compile pipeline: exact current source order</text><text x="48" y="80" class="t">Each stage consumes the previous representation; mbCompiled is committed only after stage 13.</text>
  <g transform="translate(48 116)">
    <rect width="530" height="82" rx="13" class="check"/><text x="22" y="32" class="num">01</text><text x="72" y="32" class="name">ValidateBeforeCompile</text><text x="72" y="58" class="s">contracts + produced-before-read replay</text>
    <rect y="96" width="530" height="82" rx="13" class="check"/><text x="22" y="128" class="num">02</text><text x="72" y="128" class="name">Validate extracted resources</text><text x="72" y="154" class="s">reject graph-owned extraction never produced</text>
    <rect y="192" width="530" height="82" rx="13" class="graph"/><text x="22" y="224" class="num">03</text><text x="72" y="224" class="name">Append + wire GraphEpilogue</text><text x="72" y="250" class="s">output producers + trailing-reader sync edges</text>
    <rect y="288" width="530" height="82" rx="13" class="meta"/><text x="22" y="320" class="num">04</text><text x="72" y="320" class="name">AssignPipelines</text><text x="72" y="346" class="s">Graphics / AsyncCompute / Copy fallback</text>
    <rect y="384" width="530" height="82" rx="13" class="graph"/><text x="22" y="416" class="num">05</text><text x="72" y="416" class="name">BuildConsumerEdges</text><text x="72" y="442" class="s">mirror edges; verify strictly forward handles</text>
    <rect y="480" width="530" height="82" rx="13" class="graph"/><text x="22" y="512" class="num">06</text><text x="72" y="512" class="name">CullPasses</text><text x="72" y="538" class="s">backward data walk from epilogue + NeverCull</text>
    <rect y="576" width="530" height="82" rx="13" class="graph"/><text x="22" y="608" class="num">07</text><text x="72" y="608" class="name">RebuildLiveResourceIntervals</text><text x="72" y="634" class="s">discard dead declarations; replay live accesses</text>
  </g>
  <g transform="translate(622 116)">
    <rect width="530" height="82" rx="13" class="graph"/><text x="22" y="32" class="num">08</text><text x="72" y="32" class="name">CompileResourceLifetimes</text><text x="72" y="58" class="s">inclusive compact execution indices</text>
    <rect y="96" width="530" height="82" rx="13" class="graph"/><text x="22" y="128" class="num">09</text><text x="72" y="128" class="name">CompileBarriers</text><text x="72" y="154" class="s">lower declarations to logical transitions</text>
    <rect y="192" width="530" height="82" rx="13" class="check"/><text x="22" y="224" class="num">10</text><text x="72" y="224" class="name">ValidateTransitions</text><text x="72" y="250" class="s">independent continuity + final-state replay</text>
    <rect y="288" width="530" height="82" rx="13" class="meta"/><text x="22" y="320" class="num">11</text><text x="72" y="320" class="name">CompileAsyncMetadata</text><text x="72" y="346" class="s">descriptive graphics fork / join reachability</text>
    <rect y="384" width="530" height="82" rx="13" class="meta"/><text x="22" y="416" class="num">12</text><text x="72" y="416" class="name">CompileQueueDependencies</text><text x="72" y="442" class="s">live cross-pipeline edge pairs drive waits</text>
    <rect y="480" width="530" height="82" rx="13" class="meta"/><text x="22" y="512" class="num">13</text><text x="72" y="512" class="name">CompileRasterGroups</text><text x="72" y="538" class="s">compatible consecutive raster metadata</text>
    <rect y="576" width="530" height="82" rx="13" class="stage"/><text x="22" y="608" class="num">14</text><text x="72" y="608" class="name">Set mbCompiled; return result</text><text x="72" y="634" class="s">later Compile returns the cache</text>
  </g>
  <rect x="48" y="806" width="1104" height="48" rx="12" class="stage"/><text x="72" y="836" class="t">Limits: execution remains live registry order; raster groups do not merge command lists or render passes.</text>
  <text x="48" y="882" class="s">Legend: amber = validation | green = graph lowering | purple = scheduling metadata | gray = publication</text>
</svg>
