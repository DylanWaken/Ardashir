<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Queue ownership handoff</title><desc id="desc">Producer completion must precede consumer access on another queue.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#7dd3fc"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#0b1424"/>
<g font-family="system-ui,sans-serif"><text x="40" y="57" fill="#eef6ff" font-size="29" font-weight="700">Queue ownership handoff</text>
<text x="40" y="96" fill="#b7cbe1" font-size="16">Producer completion must precede consumer access on another queue.</text>
<rect x="40" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="60" y="198" fill="#7dd3fc" font-size="14">01</text>
<text x="60" y="239" fill="#eef6ff" font-size="19" font-weight="700">Producer work</text>
<text x="60" y="280" fill="#c4d3e5" font-size="15">Declared write/read state</text>
<text x="60" y="312" fill="#c4d3e5" font-size="15">Record native commands</text>
<text x="60" y="344" fill="#c4d3e5" font-size="15">Use producer queue</text>
<path d="M294 274H322" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="350" y="198" fill="#7dd3fc" font-size="14">02</text>
<text x="350" y="239" fill="#eef6ff" font-size="19" font-weight="700">Release and signal</text>
<text x="350" y="280" fill="#c4d3e5" font-size="15">Record release state</text>
<text x="350" y="312" fill="#c4d3e5" font-size="15">Signal completion token</text>
<text x="350" y="344" fill="#c4d3e5" font-size="15">Retain live resources</text>
<path d="M584 274H612" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="640" y="198" fill="#7dd3fc" font-size="14">03</text>
<text x="640" y="239" fill="#eef6ff" font-size="19" font-weight="700">Wait and acquire</text>
<text x="640" y="280" fill="#c4d3e5" font-size="15">Consumer waits on token</text>
<text x="640" y="312" fill="#c4d3e5" font-size="15">Transfer queue ownership</text>
<text x="640" y="344" fill="#c4d3e5" font-size="15">Apply consumer state</text>
<path d="M874 274H902" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="910" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="930" y="198" fill="#7dd3fc" font-size="14">04</text>
<text x="930" y="239" fill="#eef6ff" font-size="19" font-weight="700">Consumer work</text>
<text x="930" y="280" fill="#c4d3e5" font-size="15">Read the produced value</text>
<text x="930" y="312" fill="#c4d3e5" font-size="15">Record dependent work</text>
<text x="930" y="344" fill="#c4d3e5" font-size="15">Restore imports at exit</text>
<rect x="40" y="432" width="1120" height="130" rx="12" fill="#152637"/><text x="62" y="476" fill="#d8e6f4" font-size="16">D3D12 uses resource transitions and queue fences; Vulkan also tracks queue-family ownership.</text><text x="62" y="518" fill="#abc4dc" font-size="16">CUDA batch waits/signals surround one framework-stream sequence and stay outside captured executables.</text></g></svg>