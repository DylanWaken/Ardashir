<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">ARDG CPU parallel recording waves and deterministic queue submission</title>
  <desc id="desc">Dependency levels form CPU recording waves. Eligible passes in one level record concurrently in bounded asynchronous batches, while NeverParallel passes record serially. Completion order is ignored. Submission walks stable execution order, performs uniform upload waits and compiled cross-queue waits, and submits each recorded command list deterministically.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17233a"/></linearGradient><marker id="y" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#fbbf24"/></marker>
    <style>.p{fill:#101a2c;stroke:#52647d;stroke-width:2}.gfx{fill:#1f3656;stroke:#60a5fa;stroke-width:2}.compute{fill:#214b45;stroke:#34d399;stroke-width:2}.copy{fill:#3a294d;stroke:#c084fc;stroke-width:2}.serial{fill:#493720;stroke:#fbbf24;stroke-width:2}.h1{font:700 30px system-ui,sans-serif;fill:#eef6ff}.h2{font:700 19px system-ui,sans-serif;fill:#eef6ff}.t{font:15px system-ui,sans-serif;fill:#c5d2e3}.s{font:13px system-ui,sans-serif;fill:#aebdd0}.lane{stroke:#52647d;stroke-width:2}.wait{fill:none;stroke:#fbbf24;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#y)}</style>
  </defs>
  <rect width="1200" height="820" rx="24" fill="url(#bg)"/><text x="48" y="52" class="h1">Record in parallel; submit deterministically</text>
  <rect x="48" y="100" width="1104" height="300" rx="18" class="p"/><text x="72" y="138" class="h2">CPU command recording waves</text><text x="72" y="166" class="s">level(pass) = max(level of data and synchronization producers + 1)</text>
  <text x="82" y="220" class="s">worker 1</text><text x="82" y="282" class="s">worker 2</text><text x="82" y="344" class="s">serial</text><path d="M150 205H1110M150 267H1110M150 329H1110" class="lane"/>
  <rect x="180" y="184" width="220" height="42" rx="9" class="copy"/><text x="290" y="211" class="t" text-anchor="middle">P1 record Copy</text><rect x="180" y="246" width="220" height="42" rx="9" class="compute"/><text x="290" y="273" class="t" text-anchor="middle">P2 record Compute</text>
  <rect x="470" y="184" width="250" height="42" rx="9" class="compute"/><text x="595" y="211" class="t" text-anchor="middle">P3 record Compute</text><rect x="760" y="308" width="260" height="42" rx="9" class="serial"/><text x="890" y="335" class="t" text-anchor="middle">P4 NeverParallel</text>
  <text x="180" y="378" class="s">Wave 0: P1 and P2 can finish in either order</text><text x="520" y="378" class="s">join each batch before the next wave</text>
  <rect x="48" y="430" width="1104" height="300" rx="18" class="p"/><text x="72" y="468" class="h2">GPU queue submission walks mExecutionOrder</text><text x="72" y="496" class="s">record completion order is ignored; one command list per live pass with work</text>
  <text x="82" y="548" class="s">Copy queue</text><text x="82" y="612" class="s">Compute queue</text><text x="82" y="676" class="s">Graphics queue</text><path d="M170 533H1110M170 597H1110M170 661H1110" class="lane"/>
  <rect x="200" y="512" width="170" height="42" rx="9" class="copy"/><text x="285" y="539" class="t" text-anchor="middle">submit P1</text><rect x="430" y="576" width="170" height="42" rx="9" class="compute"/><text x="515" y="603" class="t" text-anchor="middle">submit P2</text><rect x="660" y="576" width="170" height="42" rx="9" class="compute"/><text x="745" y="603" class="t" text-anchor="middle">submit P3</text><rect x="900" y="640" width="170" height="42" rx="9" class="gfx"/><text x="985" y="667" class="t" text-anchor="middle">submit P4</text>
  <path d="M370 533C410 533 390 597 420 597" class="wait"/><text x="398" y="566" class="s">wait P1 instance</text><path d="M830 597C870 597 860 661 890 661" class="wait"/><text x="858" y="630" class="s">cross-queue wait</text>
  <text x="72" y="710" class="s">Same-queue edges use queue order. Upload is graphics-first; first non-graphics consumer waits once.</text>
  <rect x="48" y="752" width="1104" height="40" rx="10" class="serial"/><text x="72" y="778" class="t">CPU submission only: Execute does not call waitForIdle or poll fences.</text>
  <text x="48" y="812" class="s">Legend: blue = graphics | green = compute | purple = copy | amber = serial rule / explicit wait</text>
</svg>
