<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Terrain assembled from individual operations</title>
<desc id="desc">Settings upload, copy, generate, erode, triangulate, draw and overlay form a resource dependency chain. Camera upload independently feeds drawing. Separate optional vertex and index readbacks branch after triangulation. Each box is one graph node; the compiler derives execution order and barriers.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7dd3fc"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#0b1424"/>
<g font-family="system-ui,sans-serif" fill="#eef6ff">
<text x="36" y="43" font-size="27" font-weight="700">Each box is one registered graph operation</text>
<text x="36" y="77" font-size="16" fill="#b7cbe1">Attachment order is independent of execution order. Arrows follow resource values.</text>
<rect x="36" y="222" width="144" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="108.0" y="253" text-anchor="middle" font-size="16" font-weight="700">Upload settings</text>
<text x="108.0" y="281" text-anchor="middle" font-size="14" fill="#c4d3e5">CPU bytes</text>
<path d="M180 263H195" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="198" y="222" width="144" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="270.0" y="253" text-anchor="middle" font-size="16" font-weight="700">Copy settings</text>
<text x="270.0" y="281" text-anchor="middle" font-size="14" fill="#c4d3e5">GPU input</text>
<path d="M342 263H357" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="360" y="222" width="144" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="432.0" y="253" text-anchor="middle" font-size="16" font-weight="700">Generate</text>
<text x="432.0" y="281" text-anchor="middle" font-size="14" fill="#c4d3e5">raw heightmap</text>
<path d="M504 263H519" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="522" y="222" width="144" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="594.0" y="253" text-anchor="middle" font-size="16" font-weight="700">Erode</text>
<text x="594.0" y="281" text-anchor="middle" font-size="14" fill="#c4d3e5">eroded heightmap</text>
<path d="M666 263H681" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="222" width="144" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="756.0" y="253" text-anchor="middle" font-size="16" font-weight="700">Triangulate</text>
<text x="756.0" y="281" text-anchor="middle" font-size="14" fill="#c4d3e5">vertices + indices</text>
<path d="M828 263H843" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="846" y="222" width="144" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="918.0" y="253" text-anchor="middle" font-size="16" font-weight="700">Draw terrain</text>
<text x="918.0" y="281" text-anchor="middle" font-size="14" fill="#c4d3e5">scene color</text>
<path d="M990 263H1005" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1008" y="222" width="144" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="1080.0" y="253" text-anchor="middle" font-size="16" font-weight="700">Overlay</text>
<text x="1080.0" y="281" text-anchor="middle" font-size="14" fill="#c4d3e5">back buffer</text>
<rect x="846" y="110" width="144" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="918.0" y="141" text-anchor="middle" font-size="16" font-weight="700">Upload camera</text>
<text x="918.0" y="169" text-anchor="middle" font-size="14" fill="#c4d3e5">CPU matrices</text>
<path d="M918 192V219" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M594 222V204H874V219" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="610" y="194" font-size="14" fill="#b7cbe1">heightmap</text>
<rect x="546" y="378" width="190" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="641.0" y="409" text-anchor="middle" font-size="16" font-weight="700">Read vertices</text>
<text x="641.0" y="437" text-anchor="middle" font-size="14" fill="#c4d3e5">optional CPU validation</text>
<rect x="782" y="378" width="190" height="82" rx="10" fill="#172a43" stroke="#5cb8df"/>
<text x="877.0" y="409" text-anchor="middle" font-size="16" font-weight="700">Read indices</text>
<text x="877.0" y="437" text-anchor="middle" font-size="14" fill="#c4d3e5">optional CPU validation</text>
<path d="M756 304V342H641V375" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<path d="M756 342H877V375" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="36" y="355" font-size="15" fill="#b7cbe1">Solid arrows: required values</text>
<text x="36" y="384" font-size="15" fill="#b7cbe1">Dashed arrows: optional readback branches</text>
<rect x="36" y="498" width="1128" height="90" rx="12" fill="#152637"/>
<text x="56" y="534" font-size="16">ArdaInductor resolves dependencies, barriers, queues, PSOs and transient lifetimes at EndGraphEdit.</text>
<text x="56" y="566" font-size="16" fill="#b7cbe1">Replay updates CPU inputs. After first-frame validation, an edit removes only the readback branches.</text>
</g></svg>