<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
<title id="title">Shared vertex values assemble independent graphics draws</title>
<desc id="desc">One vertex operation feeds two raster operations through a typed vertex value. Each raster produces fragments for its pixel operation. Both draws execute the vertex shader; compatible complete state can reuse one cached graphics pipeline.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#334155"/></marker></defs>
<rect width="800" height="320" rx="12" fill="#f8fafc"/>
<g font-family="system-ui,sans-serif" fill="#172554" font-size="16" text-anchor="middle">
<rect x="20" y="100" width="155" height="60" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="97" y="125">Vertex operation</text><text x="97" y="147">Vertices</text>
<rect x="260" y="40" width="150" height="60" rx="5" fill="#e2e8f0" stroke="#475569"/>
<text x="335" y="65">Raster A</text><text x="335" y="87">Fragments A</text>
<rect x="260" y="160" width="150" height="60" rx="5" fill="#e2e8f0" stroke="#475569"/>
<text x="335" y="185">Raster B</text><text x="335" y="207">Fragments B</text>
<rect x="470" y="40" width="135" height="60" rx="5" fill="#dcfce7" stroke="#15803d"/>
<text x="537" y="65">Pixel A</text><text x="537" y="87">color A</text>
<rect x="470" y="160" width="135" height="60" rx="5" fill="#dcfce7" stroke="#15803d"/>
<text x="537" y="185">Pixel B</text><text x="537" y="207">color B</text>
<rect x="665" y="100" width="110" height="60" rx="5" fill="#fef3c7" stroke="#92400e"/>
<text x="720" y="125">One PSO</text><text x="720" y="147">reused</text>
<text x="400" y="265">Two draws; the vertex shader executes in each.</text>
<text x="400" y="290">Solid: typed dataflow. Dashed: compatible complete state reuses the PSO.</text>
</g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
<path d="M175 118 L215 118 L215 70 L257 70"/><path d="M175 144 L215 144 L215 190 L257 190"/>
<path d="M410 70 L467 70"/><path d="M410 190 L467 190"/>
<path stroke-dasharray="5 4" d="M605 70 L637 70 L637 118 L662 118"/>
<path stroke-dasharray="5 4" d="M605 190 L637 190 L637 144 L662 144"/>
</g></svg>
