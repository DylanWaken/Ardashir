<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ARDG texture mip by slice barrier grid and whole-buffer tracking</title>
  <desc id="desc">Texture state compilation expands subresource ranges into mip by array-slice cells and tracks each cell independently. Buffer state compilation tracks one state for the whole logical buffer even when declarations preserve byte ranges. Compatible reads merge; conflicting writes are rejected; equal UAV use still requests ordering.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17233a"/></linearGradient>
    <style>.p{fill:#101a2c;stroke:#52647d;stroke-width:2}.read{fill:#1f3656;stroke:#60a5fa;stroke-width:2}.write{fill:#3a294d;stroke:#c084fc;stroke-width:2}.uav{fill:#214b45;stroke:#34d399;stroke-width:2}.whole{fill:#493720;stroke:#fbbf24;stroke-width:2}.h1{font:700 30px system-ui,sans-serif;fill:#eef6ff}.h2{font:700 20px system-ui,sans-serif;fill:#eef6ff}.t{font:15px system-ui,sans-serif;fill:#c5d2e3}.s{font:13px system-ui,sans-serif;fill:#aebdd0}.cell{font:600 14px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}</style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/><text x="48" y="52" class="h1">Barrier granularity: texture cells, whole buffers</text>
  <rect x="48" y="100" width="690" height="500" rx="18" class="p"/><text x="72" y="138" class="h2">Texture state grid: mip x array slice</text><text x="72" y="166" class="s">Example 4 mips x 3 slices; each cell has independent current state.</text>
  <text x="225" y="208" class="s" text-anchor="middle">mip 0</text><text x="355" y="208" class="s" text-anchor="middle">mip 1</text><text x="485" y="208" class="s" text-anchor="middle">mip 2</text><text x="615" y="208" class="s" text-anchor="middle">mip 3</text>
  <text x="112" y="266" class="s">slice 0</text><text x="112" y="366" class="s">slice 1</text><text x="112" y="466" class="s">slice 2</text>
  <rect x="165" y="225" width="120" height="80" rx="10" class="write"/><text x="225" y="270" class="cell">RenderTarget</text><rect x="295" y="225" width="120" height="80" rx="10" class="read"/><text x="355" y="270" class="cell">ShaderRead</text><rect x="425" y="225" width="120" height="80" rx="10" class="read"/><text x="485" y="270" class="cell">ShaderRead</text><rect x="555" y="225" width="120" height="80" rx="10" class="uav"/><text x="615" y="270" class="cell">UAV</text>
  <rect x="165" y="325" width="120" height="80" rx="10" class="read"/><text x="225" y="370" class="cell">ShaderRead</text><rect x="295" y="325" width="120" height="80" rx="10" class="uav"/><text x="355" y="370" class="cell">UAV</text><rect x="425" y="325" width="120" height="80" rx="10" class="uav"/><text x="485" y="370" class="cell">UAV</text><rect x="555" y="325" width="120" height="80" rx="10" class="read"/><text x="615" y="370" class="cell">ShaderRead</text>
  <rect x="165" y="425" width="120" height="80" rx="10" class="read"/><text x="225" y="470" class="cell">ShaderRead</text><rect x="295" y="425" width="120" height="80" rx="10" class="read"/><text x="355" y="470" class="cell">ShaderRead</text><rect x="425" y="425" width="120" height="80" rx="10" class="write"/><text x="485" y="470" class="cell">CopyDest</text><rect x="555" y="425" width="120" height="80" rx="10" class="read"/><text x="615" y="470" class="cell">ShaderRead</text>
  <text x="72" y="550" class="t">Normalize ranges, expand cells, merge per pass, then emit transitions.</text><text x="72" y="578" class="s">Equal UAV requests ordering; conservative mode can force other equal-state barriers.</text>
  <rect x="774" y="100" width="378" height="500" rx="18" class="p"/><text x="798" y="138" class="h2">Buffer state: whole resource</text><text x="798" y="174" class="s">Byte ranges remain for bounds and</text><text x="798" y="196" class="s">execution access validation.</text>
  <rect x="810" y="240" width="306" height="100" rx="14" class="whole"/><text x="963" y="278" class="cell">one current state</text><text x="963" y="306" class="cell">for the entire buffer</text>
  <path d="M860 350V430M963 350V430M1066 350V430" stroke="#fbbf24" stroke-dasharray="6 5"/><text x="820" y="458" class="s">range A</text><text x="928" y="458" class="s">range B</text><text x="1030" y="458" class="s">range C</text>
  <text x="798" y="506" class="t">No independent range states.</text><text x="798" y="534" class="t">One transition per buffer.</text><text x="798" y="568" class="s">This is an implementation limit,</text><text x="798" y="590" class="s">not a general render-graph rule.</text>
  <rect x="48" y="630" width="1104" height="70" rx="12" class="p"/><text x="72" y="659" class="t">Compile validates logical transitions; execution corrects the before state by physical identity after pool reuse.</text><text x="72" y="684" class="s">Conflicting writes in one pass are rejected; compatible read masks can merge.</text>
  <text x="48" y="735" class="s">Legend: blue = read | purple = write | green = UAV ordering | amber = whole-buffer behavior</text>
</svg>
