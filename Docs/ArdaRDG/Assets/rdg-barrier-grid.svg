<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Resource-state conformance</title><desc id="desc">Check expected graph state against independent facade and native observations.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#7dd3fc"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#0b1424"/>
<g font-family="system-ui,sans-serif"><text x="40" y="57" fill="#eef6ff" font-size="29" font-weight="700">Resource-state conformance</text>
<text x="40" y="96" fill="#b7cbe1" font-size="16">Check expected graph state against independent facade and native observations.</text>
<rect x="40" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="60" y="198" fill="#7dd3fc" font-size="14">01</text>
<text x="60" y="239" fill="#eef6ff" font-size="19" font-weight="700">Before transition</text>
<text x="60" y="280" fill="#c4d3e5" font-size="15">Identify physical resource</text>
<text x="60" y="312" fill="#c4d3e5" font-size="15">Observe current state</text>
<text x="60" y="344" fill="#c4d3e5" font-size="15">Check previous ownership</text>
<path d="M294 274H322" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="350" y="198" fill="#7dd3fc" font-size="14">02</text>
<text x="350" y="239" fill="#eef6ff" font-size="19" font-weight="700">After transition</text>
<text x="350" y="280" fill="#c4d3e5" font-size="15">Compare required state</text>
<text x="350" y="312" fill="#c4d3e5" font-size="15">Validate native encoding</text>
<text x="350" y="344" fill="#c4d3e5" font-size="15">Track queue family</text>
<path d="M584 274H612" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="640" y="198" fill="#7dd3fc" font-size="14">03</text>
<text x="640" y="239" fill="#eef6ff" font-size="19" font-weight="700">After callback</text>
<text x="640" y="280" fill="#c4d3e5" font-size="15">Observe recorded effects</text>
<text x="640" y="312" fill="#c4d3e5" font-size="15">Detect undeclared changes</text>
<text x="640" y="344" fill="#c4d3e5" font-size="15">Report node/resource name</text>
<path d="M874 274H902" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="910" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="930" y="198" fill="#7dd3fc" font-size="14">04</text>
<text x="930" y="239" fill="#eef6ff" font-size="19" font-weight="700">Queue checkpoints</text>
<text x="930" y="280" fill="#c4d3e5" font-size="15">Validate release/acquire</text>
<text x="930" y="312" fill="#c4d3e5" font-size="15">Check destination owner</text>
<text x="930" y="344" fill="#c4d3e5" font-size="15">Retain conformance record</text>
<rect x="40" y="432" width="1120" height="130" rx="12" fill="#152637"/><text x="62" y="476" fill="#d8e6f4" font-size="16">State agreement verifies transition bookkeeping; it does not prove shader output is numerically correct.</text><text x="62" y="518" fill="#abc4dc" font-size="16">Use execution status, conformance reports and numerical readback together.</text></g></svg>