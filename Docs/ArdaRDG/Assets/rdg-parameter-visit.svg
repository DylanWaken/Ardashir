<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Typed node contract</title><desc id="desc">Public parameters determine identity; new instances prepare retained state before description and recording.</desc>
