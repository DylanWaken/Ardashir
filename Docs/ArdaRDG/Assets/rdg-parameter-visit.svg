<rect width="1200" height="620" rx="20" fill="#0b1424"/>
<g font-family="system-ui,sans-serif"><text x="40" y="57" fill="#eef6ff" font-size="29" font-weight="700">Typed node contract</text>
<text x="40" y="96" fill="#b7cbe1" font-size="16">Public parameters determine identity; new instances prepare retained state before description and recording.</text>
<rect x="40" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="60" y="198" fill="#7dd3fc" font-size="14">01</text>
<text x="60" y="239" fill="#eef6ff" font-size="19" font-weight="700">Frozen parameters</text>
<text x="60" y="280" fill="#c4d3e5" font-size="15">Values and handles</text>
<text x="60" y="312" fill="#c4d3e5" font-size="15">Immutable semantic refs</text>
<text x="60" y="344" fill="#c4d3e5" font-size="15">Explicit dynamic inputs</text>
<path d="M294 274H322" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="350" y="198" fill="#7dd3fc" font-size="14">02</text>
<text x="350" y="239" fill="#eef6ff" font-size="19" font-weight="700">Canonical identity</text>
<text x="350" y="280" fill="#c4d3e5" font-size="15">Full resource identities</text>
<text x="350" y="312" fill="#c4d3e5" font-size="15">Behavior-affecting values</text>
<text x="350" y="344" fill="#c4d3e5" font-size="15">No structure padding</text>
<path d="M584 274H612" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="640" y="198" fill="#7dd3fc" font-size="14">03</text>
<text x="640" y="239" fill="#eef6ff" font-size="19" font-weight="700">Node description</text>
<text x="640" y="280" fill="#c4d3e5" font-size="15">Read/write states/ranges</text>
<text x="640" y="312" fill="#c4d3e5" font-size="15">Pipeline slots and cost</text>
<text x="640" y="344" fill="#c4d3e5" font-size="15">Workspace and side effects</text>
<path d="M874 274H902" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="910" y="162" width="250" height="226" rx="14" fill="#172a43" stroke="#5cb8df" stroke-width="2"/>
<text x="930" y="198" fill="#7dd3fc" font-size="14">04</text>
<text x="930" y="239" fill="#eef6ff" font-size="19" font-weight="700">Native callback</text>
<text x="930" y="280" fill="#c4d3e5" font-size="15">Resolve declared objects</text>
<text x="930" y="312" fill="#c4d3e5" font-size="15">Use inferred pipelines</text>
<text x="930" y="344" fill="#c4d3e5" font-size="15">Return execution status</text>
<rect x="40" y="432" width="1120" height="130" rx="12" fill="#152637"/><text x="62" y="476" fill="#d8e6f4" font-size="16">The key uses public parameters. New instances retain those inputs and prepared state for description and recording.</text><text x="62" y="518" fill="#abc4dc" font-size="16">Arbitrary pointers are not deep-copied. Authors own pointee immutability and synchronization.</text></g></svg>