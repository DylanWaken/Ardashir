<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">Inclusive logical lifetime overlap</title>
  <desc id="desc">HeightTile A lives from execution index one through three. MeshScratch B lives from three through four, so it overlaps A at index three and cannot reuse A. TerrainDebug C lives only at index five and may reuse either exact descriptor match.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <style>
      .title{font:700 22px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .label{font:600 16px system-ui,sans-serif;fill:#eef6ff}
      .index{font:700 16px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}
      .grid{stroke:#475569;stroke-width:1}
      .bar{rx:10;stroke-width:2}
    </style>
  </defs>
  <rect width="1100" height="460" rx="22" fill="url(#bg)"/>
  <text x="550" y="40" class="title">Inclusive last use prevents reuse at the shared index</text>

  <text x="180" y="92" class="label">Execution index</text>
  <text x="385" y="92" class="index">1</text>
  <text x="535" y="92" class="index">2</text>
  <text x="685" y="92" class="index">3</text>
  <text x="835" y="92" class="index">4</text>
  <text x="985" y="92" class="index">5</text>
  <line x1="310" y1="110" x2="1060" y2="110" class="grid"/>
  <line x1="310" y1="110" x2="310" y2="335" class="grid"/>
  <line x1="460" y1="110" x2="460" y2="335" class="grid"/>
  <line x1="610" y1="110" x2="610" y2="335" class="grid"/>
  <line x1="760" y1="110" x2="760" y2="335" class="grid"/>
  <line x1="910" y1="110" x2="910" y2="335" class="grid"/>
  <line x1="1060" y1="110" x2="1060" y2="335" class="grid"/>

  <text x="55" y="164" class="label">HeightTile A [1,3]</text>
  <rect class="bar" x="320" y="132" width="430" height="48" fill="#1f3656" stroke="#60a5fa"/>
  <text x="535" y="162" class="small">live at 1, 2, and 3</text>

  <text x="55" y="239" class="label">MeshScratch B [3,4]</text>
  <rect class="bar" x="620" y="207" width="280" height="48" fill="#493720" stroke="#fbbf24"/>
  <text x="760" y="237" class="small">live at 3 and 4</text>

  <text x="55" y="314" class="label">TerrainDebug C [5,5]</text>
  <rect class="bar" x="920" y="282" width="130" height="48" fill="#214b45" stroke="#34d399"/>
  <text x="985" y="312" class="small">live at 5</text>

  <rect x="610" y="112" width="150" height="225" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-dasharray="6 5"/>
  <text x="685" y="365" class="small">A and B overlap at index 3: no reuse</text>
  <rect x="215" y="392" width="670" height="42" rx="10" fill="#20364a" stroke="#38bdf8"/>
  <text x="550" y="419" class="small">C starts after both prior lifetimes expire and may reuse an exact compatible match.</text>
</svg>
