<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="340" viewBox="0 0 1160 340" role="img" aria-labelledby="title desc">
  <title id="title">CPU phases and asynchronous GPU work</title>
  <desc id="desc">The CPU builds the logical API graph, compiles schedule and state, records command lists, and submits queue calls. Execute returns at the CPU submission boundary while GPU work continues asynchronously.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font:700 22px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .label{font:600 16px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}
      .phase{rx:12;stroke-width:2}
      .flow{stroke:#7dd3fc;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .boundary{stroke:#fbbf24;stroke-width:3;stroke-dasharray:8 5}
    </style>
  </defs>
  <rect width="1160" height="340" rx="22" fill="url(#bg)"/>
  <text x="580" y="40" class="title">Execute reaches CPU submission; GPU completion is later</text>

  <rect class="phase" x="40" y="105" width="185" height="90" fill="#253247" stroke="#94a3b8"/>
  <text x="132" y="139" class="label">CPU build</text>
  <text x="132" y="166" class="small">logical API</text>

  <rect class="phase" x="270" y="105" width="185" height="90" fill="#3a294d" stroke="#c084fc"/>
  <text x="362" y="139" class="label">CPU compile</text>
  <text x="362" y="166" class="small">schedule + state</text>

  <rect class="phase" x="500" y="105" width="185" height="90" fill="#214b45" stroke="#34d399"/>
  <text x="592" y="139" class="label">CPU record</text>
  <text x="592" y="166" class="small">ICommandList</text>

  <rect class="phase" x="730" y="105" width="185" height="90" fill="#493720" stroke="#fbbf24"/>
  <text x="822" y="139" class="label">CPU submit</text>
  <text x="822" y="166" class="small">queue calls</text>

  <rect class="phase" x="960" y="105" width="160" height="90" fill="#1f3656" stroke="#60a5fa"/>
  <text x="1040" y="139" class="label">GPU work</text>
  <text x="1040" y="166" class="small">asynchronous</text>

  <path class="flow" d="M225 150 H265"/>
  <path class="flow" d="M455 150 H495"/>
  <path class="flow" d="M685 150 H725"/>
  <path class="flow" d="M915 150 H955"/>

  <line x1="937" y1="76" x2="937" y2="260" class="boundary"/>
  <text x="937" y="285" class="label">Execute returns</text>
  <text x="937" y="310" class="small">CPU submission complete</text>
</svg>
