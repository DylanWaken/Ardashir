<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">ScratchA and ScratchB reuse one physical buffer</title>
  <desc id="desc">ScratchA is written at P1 and read at P2. ScratchB is written at P3 after ScratchA expires. With the same normalized buffer descriptor and queue domain, both logical buffers bind one physical NVRHI buffer at different times.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="downArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font:700 22px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .label{font:600 17px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}
      .axis{stroke:#64748b;stroke-width:2}
      .guide{stroke:#475569;stroke-width:1;stroke-dasharray:5 7}
      .bar{rx:11;stroke-width:2}
      .flow{stroke:#7dd3fc;stroke-width:2.5;fill:none;marker-end:url(#downArrow)}
    </style>
  </defs>
  <rect width="1100" height="520" rx="22" fill="url(#bg)"/>
  <text x="550" y="40" class="title">Two logical lifetimes, one execution-local committed buffer</text>

  <text x="370" y="90" class="label">P1</text>
  <text x="610" y="90" class="label">P2</text>
  <text x="850" y="90" class="label">P3</text>
  <line x1="250" y1="110" x2="970" y2="110" class="axis"/>
  <line x1="250" y1="110" x2="250" y2="290" class="guide"/>
  <line x1="490" y1="110" x2="490" y2="290" class="guide"/>
  <line x1="730" y1="110" x2="730" y2="290" class="guide"/>
  <line x1="970" y1="110" x2="970" y2="290" class="guide"/>

  <text x="125" y="169" class="label">ScratchA</text>
  <rect class="bar" x="270" y="135" width="440" height="58" fill="#1f3656" stroke="#60a5fa"/>
  <text x="370" y="169" class="small">write</text>
  <text x="610" y="169" class="small">read</text>

  <text x="125" y="249" class="label">ScratchB</text>
  <rect class="bar" x="750" y="215" width="200" height="58" fill="#214b45" stroke="#34d399"/>
  <text x="850" y="249" class="small">write</text>

  <rect x="230" y="315" width="640" height="55" rx="12" fill="#20364a" stroke="#38bdf8"/>
  <text x="550" y="338" class="small">same normalized BufferDesc + same queue domain</text>
  <text x="550" y="359" class="small">ScratchB.firstUse is after ScratchA.lastUse</text>
  <path class="flow" d="M550 370 V410"/>

  <rect class="bar" x="275" y="415" width="550" height="70" fill="#3a294d" stroke="#c084fc"/>
  <text x="550" y="444" class="label">one nvrhi::IBuffer</text>
  <text x="550" y="469" class="small">bound to ScratchA, then rebound to ScratchB</text>
</svg>
