<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="sheet-title sheet-desc">
  <title id="sheet-title">Resource and parameter dependency diagrams</title>
  <desc id="sheet-desc">Four diagrams show parameter metadata outputs, logical texture views, external resource import, and terrain resource lifetimes.</desc>
  <view id="parameter-metadata" viewBox="0 0 1200 500"/>
  <view id="logical-view-tree" viewBox="0 500 1200 500"/>
  <view id="external-import-boundary" viewBox="0 1000 1200 500"/>
  <view id="terrain-lifetimes" viewBox="0 1500 1200 500"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="blue-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#34d399"/>
    </marker>
    <style>
      .panel{fill:url(#bg)}
      .title{font:700 24px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .label{font:600 17px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}
      .left{font:14px system-ui,sans-serif;fill:#c5d2e3}
      .box{rx:14;stroke-width:2}
      .blue{fill:#1f3656;stroke:#60a5fa}
      .green{fill:#214b45;stroke:#34d399}
      .purple{fill:#3a294d;stroke:#c084fc}
      .gray{fill:#2c3442;stroke:#64748b}
      .line{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#blue-arrow)}
      .boundary{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}
      .grid{stroke:#475569;stroke-width:1}
    </style>
  </defs>

  <g id="parameter-metadata-panel" role="img" aria-labelledby="pm-title pm-desc">
    <title id="pm-title">Parameter metadata fork</title>
    <desc id="pm-desc">A logical resource, selected view or range, and required state become parameter metadata, which drives dependency edges and state transitions.</desc>
    <rect class="panel" width="1200" height="500" rx="22"/>
    <text x="600" y="48" class="title">Parameter declarations drive two compiler inputs</text>
    <rect class="box blue" x="250" y="85" width="700" height="72"/>
    <text x="600" y="116" class="label">Logical resource + selected view or range + required state</text>
    <text x="600" y="141" class="small">The complete access declaration is frozen when the pass is registered</text>
    <path class="line" d="M600 158 V215"/>
    <rect class="box purple" x="430" y="218" width="340" height="72"/>
    <text x="600" y="250" class="label">Parameter metadata</text>
    <text x="600" y="275" class="small">Enumerated by FARDGSetupContext</text>
    <path class="line" d="M600 291 V325 H340 V360"/>
    <path class="line" d="M600 325 H860 V360"/>
    <rect class="box green" x="175" y="362" width="330" height="82"/>
    <text x="340" y="396" class="label">Dependency edges</text>
    <text x="340" y="421" class="small">Producer and synchronization ordering</text>
    <rect class="box green" x="695" y="362" width="330" height="82"/>
    <text x="860" y="396" class="label">State transitions</text>
    <text x="860" y="421" class="small">Required NVRHI state and selected range</text>
  </g>

  <g id="logical-view-tree-panel" transform="translate(0 500)" role="img" aria-labelledby="tree-title tree-desc">
    <title id="tree-title">Logical texture and view tree</title>
    <desc id="tree-desc">Logical texture T0 named Heightmap owns two logical views: V0 is a mip zero UAV and V1 is a mip zero SRV. Both resolve to the same physical parent texture.</desc>
    <rect class="panel" width="1200" height="500" rx="22"/>
    <text x="600" y="48" class="title">Views narrow access without creating physical children</text>
    <rect class="box blue" x="405" y="82" width="390" height="82"/>
    <text x="600" y="116" class="label">Texture T0: Heightmap</text>
    <text x="600" y="142" class="small">Logical parent resource</text>
    <path class="line" d="M530 165 V230 H310 V274"/>
    <path class="line" d="M670 165 V230 H890 V274"/>
    <rect class="box purple" x="145" y="277" width="330" height="88"/>
    <text x="310" y="312" class="label">View V0: mip 0 UAV</text>
    <text x="310" y="339" class="small">UnorderedAccess write selection</text>
    <rect class="box green" x="725" y="277" width="330" height="88"/>
    <text x="890" y="312" class="label">View V1: mip 0 SRV</text>
    <text x="890" y="339" class="small">ShaderResource read selection</text>
    <rect class="box gray" x="330" y="404" width="540" height="58"/>
    <text x="600" y="429" class="label">Context getters return the parent ITexture</text>
    <text x="600" y="451" class="small">The view descriptor supplies format and subresource selection to bindings</text>
  </g>

  <g id="external-import-boundary-panel" transform="translate(0 1000)" role="img" aria-labelledby="import-title import-desc">
    <title id="import-title">External import boundary</title>
    <desc id="import-desc">A caller-owned NVRHI texture crosses the graph boundary through RegisterExternalTexture. The graph creates a BackBuffer logical record whose initial producer is GraphPrologue.</desc>
    <rect class="panel" width="1200" height="500" rx="22"/>
    <text x="600" y="48" class="title">Import wraps caller-owned storage in one logical record</text>
    <line x1="600" y1="76" x2="600" y2="455" class="boundary"/>
    <text x="300" y="91" class="small">Caller-owned NVRHI objects</text>
    <text x="900" y="91" class="small">Render graph</text>
    <rect class="box gray" x="90" y="190" width="390" height="100"/>
    <text x="285" y="228" class="label">Existing nvrhi::ITexture</text>
    <text x="285" y="256" class="small">Swap-chain image in Present state</text>
    <rect class="box blue" x="720" y="112" width="360" height="82"/>
    <text x="900" y="146" class="label">P0 GraphPrologue</text>
    <text x="900" y="172" class="small">Initial producer</text>
    <rect class="box purple" x="720" y="284" width="360" height="105"/>
    <text x="900" y="320" class="label">BackBuffer logical record</text>
    <text x="900" y="347" class="small">External flag + physical handle</text>
    <text x="900" y="372" class="small">Initial and default final state: Present</text>
    <path class="line" d="M900 195 V280"/>
    <path d="M480 240 H655 V336 H715" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#green-arrow)"/>
    <rect class="box green" x="392" y="413" width="416" height="52"/>
    <text x="600" y="445" class="small">RegisterExternalTexture is the ownership and state boundary</text>
  </g>

  <g id="terrain-lifetimes-panel" transform="translate(0 1500)" role="img" aria-labelledby="life-title life-desc">
    <title id="life-title">Terrain resource lifetime Gantt</title>
    <desc id="life-desc">Inclusive execution intervals show TerrainSettingsUpload from upload through epilogue, TerrainSettings from upload through generate, Heightmap from generate through triangulate, terrain buffers from triangulate through render, and BackBuffer from render through epilogue. DebugHeightmap is absent because it was culled.</desc>
    <rect class="panel" width="1200" height="500" rx="22"/>
    <text x="600" y="42" class="title">Live-pass execution order defines inclusive resource intervals</text>
    <g class="small">
      <text x="315" y="78">P0</text><text x="420" y="78">P1</text><text x="525" y="78">P2</text>
      <text x="630" y="78">P4</text><text x="735" y="78">P5</text><text x="840" y="78">P6</text>
      <text x="945" y="78">P7</text><text x="1050" y="78">P8</text>
      <text x="315" y="99">Prologue</text><text x="420" y="99">Upload</text><text x="525" y="99">Generate</text>
      <text x="630" y="99">Erode</text><text x="735" y="99">Triangulate</text><text x="840" y="99">Render</text>
      <text x="945" y="99">Overlay</text><text x="1050" y="99">Epilogue</text>
    </g>
    <g class="grid">
      <line x1="315" y1="110" x2="315" y2="430"/><line x1="420" y1="110" x2="420" y2="430"/>
      <line x1="525" y1="110" x2="525" y2="430"/><line x1="630" y1="110" x2="630" y2="430"/>
      <line x1="735" y1="110" x2="735" y2="430"/><line x1="840" y1="110" x2="840" y2="430"/>
      <line x1="945" y1="110" x2="945" y2="430"/><line x1="1050" y1="110" x2="1050" y2="430"/>
    </g>
    <g class="left">
      <text x="28" y="151">TerrainSettingsUpload</text><text x="28" y="205">TerrainSettings</text>
      <text x="28" y="259">Heightmap</text><text x="28" y="313">TerrainVertices</text>
      <text x="28" y="367">TerrainIndices</text><text x="28" y="421">BackBuffer</text>
    </g>
    <rect x="420" y="126" width="645" height="34" rx="8" fill="#1f5b78" stroke="#38bdf8" stroke-width="2"/>
    <rect x="420" y="180" width="120" height="34" rx="8" fill="#214b45" stroke="#34d399" stroke-width="2"/>
    <rect x="525" y="234" width="225" height="34" rx="8" fill="#3a294d" stroke="#c084fc" stroke-width="2"/>
    <rect x="735" y="288" width="120" height="34" rx="8" fill="#214b45" stroke="#34d399" stroke-width="2"/>
    <rect x="735" y="342" width="120" height="34" rx="8" fill="#214b45" stroke="#34d399" stroke-width="2"/>
    <rect x="840" y="396" width="225" height="34" rx="8" fill="#3a294d" stroke="#c084fc" stroke-width="2"/>
    <text x="600" y="468" class="small">P3 DebugHeightmap is omitted because culling rebuilds intervals from live passes only</text>
  </g>
</svg>
