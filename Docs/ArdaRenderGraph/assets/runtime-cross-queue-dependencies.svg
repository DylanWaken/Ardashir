<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Terrain cross-queue dependency pair</title>
  <desc id="desc">P1 on the copy queue precedes P2 on async compute. P5 on async compute precedes P6 on graphics. Each edge becomes a queue wait during submission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#fbbf24"/>
    </marker>
    <style>
      .title{font:700 22px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .label{font:600 17px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}
      .node{rx:12;stroke-width:2}
      .wait{stroke:#fbbf24;stroke-width:3;stroke-dasharray:8 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="330" rx="22" fill="url(#bg)"/>
  <text x="500" y="40" class="title">Only live cross-pipeline edges become queue dependencies</text>

  <rect class="node" x="65" y="95" width="220" height="76" fill="#493720" stroke="#fbbf24"/>
  <text x="175" y="126" class="label">P1 Upload</text>
  <text x="175" y="151" class="small">Copy</text>

  <rect class="node" x="365" y="95" width="220" height="76" fill="#214b45" stroke="#34d399"/>
  <text x="475" y="126" class="label">P2 Generate</text>
  <text x="475" y="151" class="small">AsyncCompute</text>

  <rect class="node" x="365" y="215" width="220" height="76" fill="#214b45" stroke="#34d399"/>
  <text x="475" y="246" class="label">P5 Triangulate</text>
  <text x="475" y="271" class="small">AsyncCompute</text>

  <rect class="node" x="665" y="215" width="220" height="76" fill="#1f3656" stroke="#60a5fa"/>
  <text x="775" y="246" class="label">P6 Render</text>
  <text x="775" y="271" class="small">Graphics</text>

  <path class="wait" d="M285 133 H360"/>
  <path class="wait" d="M585 253 H660"/>
  <text x="322" y="117" class="small">wait</text>
  <text x="622" y="237" class="small">wait</text>
</svg>
