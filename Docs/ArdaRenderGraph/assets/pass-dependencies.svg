<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Terrain pass dependencies and culling</title>
  <desc id="desc">The live terrain producer chain reaches the imported back buffer. DebugHeightmap reads the old heightmap and contributes a synchronization-only edge to ErodeHeightmap, but remains dead because culling follows producer edges only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="syncArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#fbbf24"/>
    </marker>
    <style>
      .box{rx:13;stroke-width:2}.title{font:700 22px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .label{font:600 15px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .small{font:13px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}
      .data{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .sync{stroke:#fbbf24;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#syncArrow)}
    </style>
  </defs>
  <rect width="1080" height="520" rx="22" fill="url(#bg)"/>
  <text x="540" y="40" class="title">Terrain data edges carry liveness; WAR edges carry ordering only</text>

  <rect class="box" x="25" y="105" width="225" height="100" fill="#1f3656" stroke="#60a5fa"/>
  <text x="137" y="143" class="label">P2 GenerateNoiseHeightmap</text>
  <text x="137" y="170" class="small">UAV-writes Heightmap</text>
  <text x="137" y="191" class="small">producer for P3 and P4</text>

  <rect class="box" x="295" y="105" width="210" height="100" fill="#214b45" stroke="#34d399"/>
  <text x="400" y="143" class="label">P4 ErodeHeightmap</text>
  <text x="400" y="170" class="small">UAV-rewrites Heightmap</text>
  <text x="400" y="191" class="small">live producer chain</text>

  <rect class="box" x="550" y="105" width="230" height="100" fill="#214b45" stroke="#34d399"/>
  <text x="665" y="143" class="label">P5 TriangulateTerrain</text>
  <text x="665" y="170" class="small">reads Heightmap</text>
  <text x="665" y="191" class="small">writes terrain buffers</text>

  <rect class="box" x="825" y="105" width="230" height="100" fill="#3a294d" stroke="#c084fc"/>
  <text x="940" y="143" class="label">P6 RenderTerrain</text>
  <text x="940" y="170" class="small">reads terrain buffers</text>
  <text x="940" y="191" class="small">writes imported BackBuffer</text>

  <path class="data" d="M250 155 H290"/>
  <path class="data" d="M505 155 H545"/>
  <path class="data" d="M780 155 H820"/>

  <rect class="box" x="105" y="300" width="250" height="100" fill="#2c3442" stroke="#64748b" opacity="0.62"/>
  <text x="230" y="338" class="label" opacity="0.72">P3 DebugHeightmap</text>
  <text x="230" y="365" class="small" opacity="0.72">reads Heightmap for minimap</text>
  <text x="230" y="387" class="small" opacity="0.72">culled: no observable output</text>

  <path class="data" d="M137 205 C137 245 180 255 210 295"/>
  <path class="sync" d="M355 350 C430 350 430 230 400 210"/>
  <text x="472" y="330" class="small">P3 - -sync- -&gt; P4</text>

  <rect x="105" y="445" width="870" height="48" rx="12" fill="#20364a" stroke="#38bdf8" stroke-width="2"/>
  <text x="540" y="474" class="small">Backward culling reaches P6, P5, P4, and P2; it does not follow P4's synchronization producer P3.</text>
</svg>
