<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img" aria-labelledby="title desc">
  <title id="title">ArdaRenderGraph compilation pipeline</title>
  <desc id="desc">Fourteen deterministic stages transform the registered P0 through P7 terrain graph into live P0, P1, P2, P4, P5, P6, P7, P8 execution order, lifetimes, barriers, queue dependencies, and raster metadata.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .box{rx:11;stroke-width:2}.title{font:700 22px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .label{font:600 15px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .small{font:13px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}
      .flow{stroke:#7dd3fc;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1160" height="610" rx="22" fill="url(#bg)"/>
  <text x="580" y="38" class="title">Compile filters and lowers registration order; it does not topologically sort</text>

  <rect class="box" x="45" y="78" width="230" height="82" fill="#253247" stroke="#94a3b8"/>
  <text x="160" y="108" class="label">Terrain build products</text>
  <text x="160" y="132" class="small">P0-P7 declarations + edges</text>
  <path class="flow" d="M275 119 H330"/>

  <rect class="box" x="335" y="78" width="230" height="82" fill="#493720" stroke="#fbbf24"/>
  <text x="450" y="108" class="label">1-3 Validate + boundaries</text>
  <text x="450" y="132" class="small">validate all, append epilogue, root outputs</text>
  <path class="flow" d="M565 119 H620"/>

  <rect class="box" x="625" y="78" width="230" height="82" fill="#214b45" stroke="#34d399"/>
  <text x="740" y="108" class="label">4-5 Pipelines + reverse edges</text>
  <text x="740" y="132" class="small">graphics/compute/copy, consumers</text>
  <path class="flow" d="M855 119 H910"/>

  <rect class="box" x="915" y="78" width="200" height="82" fill="#1f3656" stroke="#60a5fa"/>
  <text x="1015" y="108" class="label">6 Cull DebugHeightmap</text>
  <text x="1015" y="132" class="small">ignore sync-only P3 branch</text>
  <path class="flow" d="M1015 160 V213"/>

  <rect class="box" x="875" y="218" width="240" height="82" fill="#1f3656" stroke="#60a5fa"/>
  <text x="995" y="248" class="label">7-8 Live uses + lifetimes</text>
  <text x="995" y="272" class="small">stable order, inclusive intervals</text>
  <path class="flow" d="M875 259 H820"/>

  <rect class="box" x="575" y="218" width="240" height="82" fill="#3a294d" stroke="#c084fc"/>
  <text x="695" y="248" class="label">9-10 States + validation</text>
  <text x="695" y="272" class="small">texture cells, whole buffers, replay</text>
  <path class="flow" d="M575 259 H520"/>

  <rect class="box" x="275" y="218" width="240" height="82" fill="#214b45" stroke="#34d399"/>
  <text x="395" y="248" class="label">11-12 Queue metadata</text>
  <text x="395" y="272" class="small">fork/join diagnostics, cross-queue edges</text>
  <path class="flow" d="M275 259 H220"/>

  <rect class="box" x="45" y="218" width="170" height="82" fill="#493720" stroke="#fbbf24"/>
  <text x="130" y="248" class="label">13 Raster groups</text>
  <text x="130" y="272" class="small">compatible neighbors</text>
  <path class="flow" d="M130 300 V353"/>

  <rect class="box" x="75" y="358" width="1010" height="96" fill="#20364a" stroke="#38bdf8"/>
  <text x="580" y="390" class="label">14 Immutable compile products</text>
  <text x="580" y="418" class="small">live order P0,P1,P2,P4,P5,P6,P7,P8 | terrain lifetimes | transitions | queue edges</text>
  <text x="580" y="441" class="small">mAsyncFork/mAsyncJoin and raster groups are descriptive metadata today</text>

  <rect x="125" y="500" width="910" height="68" rx="13" fill="#2c3442" stroke="#94a3b8" stroke-width="2"/>
  <text x="580" y="528" class="label">Core invariant</text>
  <text x="580" y="552" class="small">Every edge points from a lower handle to a higher handle, so live registration order is already valid.</text>
</svg>
