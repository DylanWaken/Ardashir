<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="sheet-title sheet-desc">
  <title id="sheet-title">ArdaRenderGraph introduction diagrams</title>
  <desc id="sheet-desc">Two dark themed diagrams show the terrain dependency graph and the bridge from logical graph declarations to physical NVRHI work.</desc>
  <view id="terrain-dag" viewBox="0 0 1200 560"/>
  <view id="logical-physical-bridge" viewBox="0 580 1200 580"/>
  <defs>
    <linearGradient id="readme-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="readme-arrow-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="readme-arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#6ee7b7"/>
    </marker>
    <style>
      .rm-bg{fill:url(#readme-bg)}
      .rm-panel{fill:#111c2e;stroke:#334b68;stroke-width:2}
      .rm-node{fill:#173047;stroke:#38bdf8;stroke-width:2}
      .rm-compute{fill:#253154;stroke:#818cf8;stroke-width:2}
      .rm-raster{fill:#214b45;stroke:#34d399;stroke-width:2}
      .rm-copy{fill:#493720;stroke:#fbbf24;stroke-width:2}
      .rm-dead{fill:#392b3d;stroke:#f472b6;stroke-width:2;stroke-dasharray:7 5}
      .rm-title{font:700 25px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .rm-subtitle{font:15px system-ui,sans-serif;fill:#aebed2;text-anchor:middle}
      .rm-label{font:600 16px system-ui,sans-serif;fill:#eef6ff;text-anchor:middle}
      .rm-small{font:14px system-ui,sans-serif;fill:#c5d2e3;text-anchor:middle}
      .rm-left{font:15px system-ui,sans-serif;fill:#d8e5f4}
      .rm-code{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#d8e5f4}
      .rm-tag{font:700 12px system-ui,sans-serif;fill:#93c5fd;text-anchor:middle;letter-spacing:.7px}
      .rm-flow{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#readme-arrow-cyan)}
      .rm-data{fill:none;stroke:#6ee7b7;stroke-width:3;marker-end:url(#readme-arrow-green)}
      .rm-dashed{fill:none;stroke:#f472b6;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#readme-arrow-cyan)}
    </style>
  </defs>

  <g id="terrain-dag-diagram" role="img" aria-labelledby="terrain-title terrain-desc">
    <title id="terrain-title">Procedural terrain dependency graph</title>
    <desc id="terrain-desc">Terrain settings flow through noise generation, erosion, triangulation, terrain rendering, and overlay. A debug heightmap branch is culled because it has no observable output.</desc>
    <rect class="rm-bg" width="1200" height="560" rx="22"/>
    <text x="600" y="42" class="rm-title">Procedural terrain: declared work and observable output</text>
    <text x="600" y="68" class="rm-subtitle">Solid paths survive compilation; the dashed debug branch is removed.</text>

    <rect x="45" y="116" width="190" height="78" rx="13" class="rm-copy"/>
    <text x="140" y="146" class="rm-label">Upload settings</text>
    <text x="140" y="171" class="rm-small">imported source</text>

    <rect x="285" y="116" width="190" height="78" rx="13" class="rm-compute"/>
    <text x="380" y="146" class="rm-label">Generate noise</text>
    <text x="380" y="171" class="rm-small">heightmap UAV</text>

    <rect x="525" y="116" width="190" height="78" rx="13" class="rm-compute"/>
    <text x="620" y="146" class="rm-label">Erode heightmap</text>
    <text x="620" y="171" class="rm-small">UAV rewrite</text>

    <rect x="765" y="116" width="190" height="78" rx="13" class="rm-compute"/>
    <text x="860" y="146" class="rm-label">Triangulate</text>
    <text x="860" y="171" class="rm-small">vertices + indices</text>

    <path d="M235 155 H285" class="rm-flow"/>
    <path d="M475 155 H525" class="rm-flow"/>
    <path d="M715 155 H765" class="rm-flow"/>

    <rect x="285" y="260" width="190" height="82" rx="13" class="rm-dead"/>
    <text x="380" y="290" class="rm-label">Debug minimap</text>
    <text x="380" y="315" class="rm-small">no observable output</text>
    <path d="M380 194 V260" class="rm-dashed"/>
    <text x="397" y="231" class="rm-tag">CULLED</text>

    <rect x="765" y="282" width="190" height="82" rx="13" class="rm-raster"/>
    <text x="860" y="313" class="rm-label">Render terrain</text>
    <text x="860" y="338" class="rm-small">writes BackBuffer</text>
    <path d="M860 194 V282" class="rm-data"/>
    <text x="877" y="240" class="rm-small">terrain buffers</text>

    <rect x="1000" y="282" width="155" height="82" rx="13" class="rm-raster"/>
    <text x="1077.5" y="313" class="rm-label">Overlay</text>
    <text x="1077.5" y="338" class="rm-small">same target</text>
    <path d="M955 323 H1000" class="rm-data"/>

    <rect x="765" y="425" width="390" height="72" rx="13" class="rm-panel"/>
    <text x="960" y="454" class="rm-label">Observable result: BackBuffer</text>
    <text x="960" y="479" class="rm-small">final state returns to Present</text>
    <path d="M1077.5 364 V402 H960 V425" class="rm-data"/>

    <rect x="45" y="425" width="630" height="72" rx="13" class="rm-panel"/>
    <text x="70" y="454" class="rm-left">Compiler result:</text>
    <text x="185" y="454" class="rm-code">Upload -&gt; Generate -&gt; Erode -&gt; Triangulate -&gt; Render -&gt; Overlay</text>
    <text x="70" y="480" class="rm-left">The debug read has no output, extraction, or side effect, so it cannot root live work.</text>
  </g>

  <g id="logical-physical-bridge-diagram" role="img" aria-labelledby="bridge-title bridge-desc">
    <title id="bridge-title">Logical to physical bridge</title>
    <desc id="bridge-desc">Compilation transforms logical texture, buffer, pass, state, producer, and synchronization declarations into physical NVRHI resources, barriers, command lists, ordering, and queue waits.</desc>
    <rect class="rm-bg" x="0" y="580" width="1200" height="580" rx="22"/>
    <text x="600" y="622" class="rm-title">The two-level mental model</text>
    <text x="600" y="648" class="rm-subtitle">Compilation preserves intent while execution commits physical resources and GPU work.</text>

    <rect x="45" y="690" width="455" height="365" rx="18" class="rm-panel"/>
    <text x="272.5" y="728" class="rm-label">BUILD + COMPILE: logical graph</text>
    <text x="272.5" y="753" class="rm-small">descriptions, identity, dependency history</text>

    <rect x="700" y="690" width="455" height="365" rx="18" class="rm-panel"/>
    <text x="927.5" y="728" class="rm-label">EXECUTE: physical NVRHI work</text>
    <text x="927.5" y="753" class="rm-small">objects, transitions, recording, submission</text>

    <rect x="75" y="785" width="385" height="48" rx="10" class="rm-node"/>
    <text x="267.5" y="815" class="rm-code">logical Texture T0</text>
    <rect x="740" y="785" width="375" height="48" rx="10" class="rm-raster"/>
    <text x="927.5" y="815" class="rm-code">physical nvrhi::ITexture</text>
    <path d="M460 809 H740" class="rm-data"/>

    <rect x="75" y="850" width="385" height="48" rx="10" class="rm-node"/>
    <text x="267.5" y="880" class="rm-code">logical Buffer B0</text>
    <rect x="740" y="850" width="375" height="48" rx="10" class="rm-raster"/>
    <text x="927.5" y="880" class="rm-code">physical nvrhi::IBuffer</text>
    <path d="M460 874 H740" class="rm-data"/>

    <rect x="75" y="915" width="385" height="48" rx="10" class="rm-node"/>
    <text x="267.5" y="945" class="rm-code">pass + state declarations</text>
    <rect x="740" y="915" width="375" height="48" rx="10" class="rm-copy"/>
    <text x="927.5" y="945" class="rm-code">barriers + ICommandList</text>
    <path d="M460 939 H740" class="rm-data"/>

    <rect x="75" y="980" width="385" height="48" rx="10" class="rm-node"/>
    <text x="267.5" y="1010" class="rm-code">producer + sync edges</text>
    <rect x="740" y="980" width="375" height="48" rx="10" class="rm-copy"/>
    <text x="927.5" y="1010" class="rm-code">ordering + queue waits</text>
    <path d="M460 1004 H740" class="rm-data"/>

    <rect x="190" y="1083" width="820" height="48" rx="12" fill="#20364a" stroke="#38bdf8" stroke-width="2"/>
    <text x="600" y="1113" class="rm-small">Imported resources cross the bridge early: their logical records already wrap caller-owned NVRHI handles.</text>
  </g>
</svg>
