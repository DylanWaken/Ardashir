name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "Docs/**"
      - "Skills/document-codebase/**"
      - "Scripts/Docs/**"
      - "Source/ArdaInfra/ArdaBackend/Public/**"
      - "Source/ArdaInfra/ArdaDependencyGraph/Public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Test API inventory generation
        run: >-
          python3 -m unittest discover
          -s Skills/document-codebase/scripts
          -p test_api_extraction.py
          -v

      - name: Check generated API inventories
        run: >-
          python3 Skills/document-codebase/scripts/sync_api_inventories.py
          --repo-root .
          --check

      - name: Check generated Unreal tech blogs
        run: python3 Scripts/Docs/unreal_articles/build.py --check

      - name: Check rendered equation cache
        run: python3 Scripts/Docs/unreal_articles/math_typesetting.py --check --node node

      - name: Validate reproducible rendering laboratory evidence
        run: python3 Scripts/Docs/unreal_articles/validate_labs.py

      - name: Validate Unreal tech blogs
        run: python3 Scripts/Docs/unreal_articles/validate.py

      - name: Check generated Arda graph essay
        run: python3 Scripts/Docs/arda_graph_essay/build.py --check

      - name: Validate Arda graph essay
        run: python3 Scripts/Docs/arda_graph_essay/validate.py

      - name: Validate documentation
        run: >-
          python3 Skills/document-codebase/scripts/validate_docs.py
          Docs
          --repo-root .
          --verbose

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Docs
          include-hidden-files: true

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
